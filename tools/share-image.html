<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>共有画像（体験版）</title>
<!-- 題字は右上（時計台の側）。ミミの顔と胸元に重ねない。
     体験版の共有画像 1080×1080 を組む台紙。node tools/make-share-image.mjs で撮って assets/ui/share_trial.jpg にする。
     素材はタイトル画面で誰にでも見える背景と題字だけ（未公開の一枚絵・物語の核心・プレイヤーの情報は入れない） -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&display=swap">
<style>
  html, body { margin: 0; background: #12040a; }
  .card { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: #12040a; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 8% 30%; }
  .shade { position: absolute; inset: 0; background: radial-gradient(70% 60% at 82% 26%, rgba(18,4,10,.78) 0%, rgba(18,4,10,.45) 55%, rgba(18,4,10,0) 80%), linear-gradient(180deg, rgba(18,4,10,0) 70%, rgba(18,4,10,.55) 100%); }
  .frame { position: absolute; inset: 22px; border: 2px solid rgba(232,196,106,.75); box-shadow: inset 0 0 0 6px rgba(18,4,10,.35), inset 0 0 0 8px rgba(232,196,106,.35); pointer-events: none; }
  .logo { position: absolute; right: 36px; top: 64px; width: 640px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.7)); }
  .plate { position: absolute; right: 196px; top: 470px; padding: 10px 56px 12px; font-family: 'Shippori Mincho B1', 'Yu Mincho', serif; font-weight: 800; font-size: 56px; letter-spacing: .28em; text-indent: .28em; color: #2a0b0e;
    background: linear-gradient(180deg, #fbe7a6 0%, #e8c46a 45%, #b8892e 100%); border: 2px solid #fff1c4; box-shadow: 0 0 0 4px rgba(18,4,10,.8), 0 0 0 6px #b8892e, 0 10px 28px rgba(0,0,0,.6); }
</style>
<div class="card" id="card">
  <img class="bg" src="../assets/backgrounds/title_bg.webp" alt="">
  <div class="shade"></div>
  <img class="logo" src="../assets/ui/title_logo_hd.webp" alt="ミミのテキサスホールデムポーカー">
  <div class="plate">体験版</div>
  <div class="frame"></div>
</div>
</html>
