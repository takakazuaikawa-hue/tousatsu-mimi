<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>卓を選ぶ v11 見本</title>
<!-- 「卓を選ぶ」画面の見本 v11（2026-10-05）。ホーム v11 の「卓へ」から来る。見た目の決まりはホーム v11 と同じ：
     ・場所はホームと同じ大広間（ぼかして沈める）。選んだ相手を1人だけ大きく（拡大し直した高精細の立ち絵）
     ・道具立てはトランプ：相手を選ぶのはロイヤルフラッシュの5枚の札（勝った札は表に「勝」の印、まだの札は裏）
     ・リコ先輩のひとことは手書きのメモ、数字は Bodoni、名前は明朝。箱で囲まない
     ・卓につく前に分かること：この卓で覚えること・勝つともらえる物（コイン・ご褒美CG・Sランクのおまけ・戦術ノート）。始めるのは金のボタンだけ
     ?state=early|mid|last|clear、?sel=rico_tutorial などで選ぶ人を変えられる -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..700&family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@500;600;700;800&display=swap">
<style>
  :root {
    --k: 1;
    --bx: 0px;
    --fs-caption: max(14px, calc(11px / var(--k)));
    --fs-label: max(16px, calc(13px / var(--k)));
    --fs-body: max(20px, calc(14px / var(--k)));
    --fs-lead: max(24px, calc(16px / var(--k)));
    --fs-title: max(30px, calc(20px / var(--k)));
    --fs-num: max(34px, calc(19px / var(--k)));
    --fs-hero: max(54px, calc(28px / var(--k)));
    --tap: max(48px, calc(44px / var(--k)));
    --el: calc(max(30px, env(safe-area-inset-left, 0px) / var(--k) + 14px) - var(--bx));
    --er: calc(max(30px, env(safe-area-inset-right, 0px) / var(--k) + 14px) - var(--bx));
    --ivory: #f5eee2;
    --muted: #cbbfae;
    --dim: #8f8273;
    --gold: #cfa862;
    --gold-hi: #f1d89e;
    --heart: #c3132f;
    --serif-jp: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --serif: "Bodoni Moda", "Shippori Mincho B1", serif;
    --hand: "Klee One", "Shippori Mincho B1", serif;
    --sans: "Noto Sans JP", "Hiragino Sans", sans-serif;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #080507; }
  body { font-family: var(--sans); color: var(--ivory); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: inherit; }
  svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 4px; }
  .jp { word-break: auto-phrase; line-break: strict; text-wrap: pretty; }
  .nb { white-space: nowrap; }
  .stage { position: fixed; left: 50%; top: 50%; width: 1280px; height: 800px; overflow: visible; isolation: isolate;
    transform: translate(-50%, -50%) scale(var(--k)); transform-origin: center; }

  /* 大広間（ホームと同じ場所）。ホームより一段暗く、右（情報の側）をさらに沈める */
  .bg { position: absolute; left: -357px; top: 0; width: 1886px; height: 800px; pointer-events: none;
    background: url('../../assets/backgrounds/home_hall_blur.webp') 0 0 / 100% 100% no-repeat; filter: brightness(.58) saturate(.9); }
  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #080507 0, rgba(8, 5, 7, 0) 60px, rgba(8, 5, 7, 0) calc(100% - 60px), #080507 100%); }
  .grade { position: absolute; top: 0; bottom: 0; left: calc(-1 * var(--bx)); right: calc(-1 * var(--bx)); pointer-events: none; background:
      radial-gradient(40% 60% at 30% 42%, rgba(255, 214, 150, .14), rgba(255, 214, 150, 0) 70%),
      linear-gradient(90deg, rgba(8, 4, 6, 0) 0, rgba(8, 4, 6, 0) 50%, rgba(8, 4, 6, .6) 64%, rgba(8, 4, 6, .82) 100%),
      linear-gradient(0deg, rgba(8, 4, 6, .66) 0, rgba(8, 4, 6, 0) 26%),
      linear-gradient(180deg, rgba(8, 4, 6, .6) 0, rgba(8, 4, 6, 0) 16%); }

  /* 選んだ相手：1人を大きく。前の人が左へ消え、次の人が右から来る */
  .hero { position: absolute; left: calc(-.4 * var(--bx)); top: 0; width: 760px; height: 800px; pointer-events: none; }
  .hero-word { position: absolute; left: 30px; top: 470px; font-family: var(--serif); font-weight: 800; font-style: italic; font-size: 200px; line-height: .8; letter-spacing: -.01em;
    color: transparent; -webkit-text-stroke: 1.2px rgba(241, 216, 158, .22); white-space: nowrap; transition: opacity .5s ease; }
  .hero-breath { position: absolute; inset: 0; transform-origin: 32% 60%; animation: breath 5s ease-in-out infinite alternate; }
  .fig { position: absolute; left: 70px; top: 26px; height: 1100px; width: auto; opacity: 0; transform: translateX(28px);
    filter: drop-shadow(1.5px 0 0 rgba(255, 222, 170, .36)) drop-shadow(0 0 28px rgba(6, 2, 4, .55)); transition: opacity .55s ease, transform .8s var(--ease); }
  .fig.is-front { opacity: 1; transform: none; }
  .fig.is-leaving { opacity: 0; transform: translateX(-22px); transition-duration: .35s, .5s; }
  .fig.is-locked { filter: brightness(0) drop-shadow(0 0 2px rgba(200, 160, 255, .5)) drop-shadow(0 0 30px rgba(120, 80, 200, .35)); }
  .fig.is-locked.is-front { opacity: .85; }
  @keyframes breath { from { transform: translateY(0) scale(1); } to { transform: translateY(-3px) scale(1.005); } }
  .fore { position: absolute; top: 0; bottom: 0; left: calc(-1 * var(--bx)); right: calc(-1 * var(--bx)); pointer-events: none;
    background: linear-gradient(0deg, rgba(8, 4, 6, .62) 0, rgba(8, 4, 6, .2) 14%, rgba(8, 4, 6, 0) 30%); }

  /* 上：ホームへ戻る・画面の名前／コイン・設定 */
  .top { position: absolute; left: var(--el); right: var(--er); top: 22px; display: flex; align-items: center; gap: 18px; z-index: 4; }
  .back { display: inline-flex; align-items: center; gap: .4em; height: var(--tap); padding: 0 1.2em 0 .85em; border-radius: 999px;
    font-family: var(--serif-jp); font-weight: 700; font-size: var(--fs-label); letter-spacing: .14em; color: var(--gold-hi); border: 1px solid rgba(241, 216, 158, .4); background: rgba(10, 6, 8, .35); }
  .back svg { width: 1.05em; height: 1.05em; }
  .back:hover { border-color: var(--gold-hi); background: rgba(10, 6, 8, .55); }
  .ttl { display: grid; line-height: 1.1; }
  .ttl small { font-family: var(--serif); font-size: var(--fs-caption); letter-spacing: .42em; color: var(--gold); }
  .ttl b { font-family: var(--serif-jp); font-weight: 800; font-size: var(--fs-lead); letter-spacing: .14em; }
  .spacer { flex: 1; }
  .coins { display: flex; align-items: center; gap: .55em; }
  .coins img { width: calc(var(--fs-num) * 1.05); height: calc(var(--fs-num) * 1.05); object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .5)); }
  .coins b { font-family: var(--serif); font-weight: 600; font-size: var(--fs-num); color: var(--gold-hi); line-height: 1; text-shadow: 0 2px 14px rgba(0, 0, 0, .6); }
  .coins small { font-family: var(--serif); font-size: var(--fs-caption); letter-spacing: .32em; color: var(--muted); align-self: flex-end; padding-bottom: .3em; }
  .gear { width: var(--tap); height: var(--tap); border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(241, 216, 158, .38); color: var(--gold-hi); background: rgba(10, 6, 8, .35); }
  .gear svg { width: 46%; height: 46%; stroke-width: 1.4; }

  /* 右：この卓のこと */
  .panel { position: absolute; right: var(--er); top: 100px; width: 470px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; z-index: 3; }
  .p-eye { display: flex; align-items: center; flex-wrap: wrap; gap: 6px .8em; min-height: var(--tap); }
  .p-eye .ep { font-family: var(--serif); font-size: var(--fs-caption); letter-spacing: .38em; color: var(--gold); white-space: nowrap; }
  .p-eye .ep b { color: var(--gold-hi); font-weight: 700; letter-spacing: .14em; }
  .chip { font-family: var(--serif-jp); font-weight: 700; font-size: var(--fs-caption); letter-spacing: .14em; padding: .2em .8em; border-radius: 999px; white-space: nowrap; }
  .chip.is-next { color: #fff4dc; background: linear-gradient(180deg, #d42a44, #9c0f26); }
  .chip.is-won { color: var(--gold-hi); border: 1px solid rgba(241, 216, 158, .5); }
  .chip.is-locked { color: #cdbcf0; border: 1px solid rgba(205, 188, 240, .45); }
  .prof { margin-left: auto; display: flex; gap: 8px; }
  .ghost { display: inline-flex; align-items: center; gap: .4em; min-height: var(--tap); padding: 0 1em; border-radius: 999px; font-family: var(--serif-jp); font-weight: 700; font-size: var(--fs-caption); letter-spacing: .1em;
    color: var(--gold-hi); border: 1px solid rgba(241, 216, 158, .35); background: rgba(10, 6, 8, .3); white-space: nowrap; }
  .ghost svg { width: 1.1em; height: 1.1em; }
  .name { font-family: var(--serif-jp); font-weight: 800; font-size: var(--fs-hero); letter-spacing: .06em; line-height: 1.1; text-shadow: 0 2px 22px rgba(0, 0, 0, .6); }
  .epithet { margin-top: -4px; font-family: var(--serif-jp); font-weight: 600; font-size: var(--fs-body); color: var(--muted); letter-spacing: .06em; }
  .rule { height: 1px; background: linear-gradient(90deg, rgba(207, 168, 98, .8), rgba(207, 168, 98, 0)); margin: 2px 0; }
  .learn small { display: block; font-family: var(--serif-jp); font-weight: 700; font-size: var(--fs-caption); color: var(--gold); letter-spacing: .16em; margin-bottom: 2px; }
  .learn b { font-family: var(--serif-jp); font-weight: 700; font-size: var(--fs-lead); letter-spacing: .04em; line-height: 1.4; }
  .memo { position: relative; padding: 12px 18px 10px; transform: rotate(-1.2deg); color: #3a2418; background: linear-gradient(175deg, #fbf3e3, #efe2c8); border-radius: 3px;
    box-shadow: 0 12px 24px rgba(0, 0, 0, .4), inset 0 0 0 1px rgba(120, 80, 30, .18); }
  .memo p { font-family: var(--hand); font-weight: 600; font-size: var(--fs-label); line-height: 1.6; }
  .memo p em { font-style: normal; color: #a3122c; background: linear-gradient(transparent 62%, rgba(195, 19, 47, .16) 62%); }
  .memo .sig { position: absolute; right: 14px; bottom: -14px; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 1px solid rgba(139, 106, 47, .7); box-shadow: 0 3px 6px rgba(0, 0, 0, .35); }
  .memo .sig img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
  .reward { display: grid; gap: 3px; margin-top: 6px; }
  .r-main { display: flex; align-items: baseline; gap: .45em; flex-wrap: wrap; }
  .r-main small { font-family: var(--serif-jp); font-weight: 700; font-size: var(--fs-label); color: var(--muted); letter-spacing: .1em; }
  .r-main b { font-family: var(--serif); font-weight: 600; font-size: var(--fs-num); color: var(--gold-hi); line-height: 1; }
  .r-main span { font-size: var(--fs-label); color: var(--ivory); }
  .r-main .link { margin-left: auto; align-self: center; }
  .r-sub { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: var(--fs-caption); color: var(--muted); }
  .r-sub b { font-family: var(--serif); font-size: var(--fs-label); color: var(--gold-hi); font-weight: 700; }
  .r-sub span { white-space: nowrap; }
  .pl { font-family: var(--sans); font-weight: 700; font-size: .8em; margin-right: .06em; }
  .cta { display: flex; align-items: center; justify-content: center; gap: .5em; width: 100%; height: max(66px, calc(48px / var(--k))); border-radius: 999px; margin-top: 4px;
    font-family: var(--serif-jp); font-size: var(--fs-lead); font-weight: 800; letter-spacing: .22em; color: #1f1407;
    background: linear-gradient(180deg, #fbe7b0 0%, #e2bd6c 48%, #b98a3c 100%); box-shadow: 0 0 0 1px rgba(255, 240, 200, .6) inset, 0 12px 30px rgba(207, 160, 80, .32), 0 4px 10px rgba(0, 0, 0, .4); }
  .cta svg { width: .9em; height: .9em; stroke-width: 2.2; }
  .cta:hover { filter: brightness(1.06); }
  .cta[disabled] { cursor: default; color: rgba(245, 238, 226, .7); background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 1px rgba(245, 238, 226, .22); letter-spacing: .08em; font-size: var(--fs-body); }
  .link { min-height: var(--tap); padding: 0 .3em; font-size: var(--fs-caption); color: var(--muted); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(203, 191, 174, .45); white-space: nowrap; }
  .link:hover { color: var(--ivory); }
  .panel > * { transition: opacity .3s ease, transform .4s var(--ease); }
  .panel.is-swap > * { opacity: 0; transform: translateY(8px); }

  /* 右下：ロイヤルフラッシュの5枚＝相手を選ぶ札（ホームと同じ札） */
  .hand { position: absolute; right: var(--er); bottom: 22px; width: 470px; z-index: 3; }
  .hand-head { display: flex; align-items: baseline; gap: .8em; margin-bottom: 16px; }
  .hand-head em { margin-left: auto; font-style: normal; font-size: var(--fs-caption); color: var(--dim); letter-spacing: .04em; }
  .hand-head small { font-family: var(--serif); font-size: var(--fs-caption); letter-spacing: .4em; color: var(--gold); }
  .hand-head span { font-family: var(--serif-jp); font-weight: 700; font-size: var(--fs-label); letter-spacing: .1em; }
  .cards { display: flex; gap: 12px; }
  .card { position: relative; width: 84px; height: 118px; flex: none; border-radius: 7px; background: linear-gradient(160deg, #fcf8ef 0%, #f2e8d4 100%);
    box-shadow: 0 10px 20px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(90, 60, 20, .28); transition: transform .3s var(--ease), box-shadow .3s ease; }
  .card::before { content: ""; position: absolute; inset: 4px; border-radius: 4px; border: 1px solid rgba(166, 128, 66, .5); pointer-events: none; }
  .card .ix { position: absolute; left: 6px; top: 5px; z-index: 2; display: grid; justify-items: center; font-family: var(--serif); font-weight: 700; font-size: 17px; line-height: .92; color: var(--heart); }
  .card .ix i { font-style: normal; font-size: 13px; font-family: var(--sans); }
  .card .win { position: absolute; left: 15px; right: 15px; top: 14px; bottom: 14px; border-radius: 30px 30px 4px 4px / 24px 24px 4px 4px; overflow: hidden; border: 1px solid rgba(166, 128, 66, .7); background: #2a1a1e; }
  .card .win img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
  .card .seal { position: absolute; right: -6px; bottom: -6px; z-index: 3; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--serif-jp); font-weight: 800; font-size: 15px; color: #fff; background: radial-gradient(circle at 35% 30%, #e24a5c, #9e1427); box-shadow: 0 2px 6px rgba(0, 0, 0, .45); }
  .card.is-back { background: #1b1015 url('../../assets/ui/card_back_default.webp') center / cover; box-shadow: 0 10px 20px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(207, 168, 98, .35); }
  .card.is-back::before { display: none; }
  .card.is-back .lock { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; display: grid; place-items: center; background: rgba(10, 6, 8, .72); color: #e7dcff; }
  .card.is-back .lock svg { width: 15px; height: 15px; }
  .card.is-next::after { content: "次"; position: absolute; left: 50%; top: -12px; transform: translateX(-50%); padding: 1px 8px; border-radius: 999px; font-family: var(--serif-jp); font-weight: 800; font-size: 12px; color: #fff4dc; background: linear-gradient(180deg, #d42a44, #9c0f26); }
  .card.is-sel { transform: translateY(-14px); box-shadow: 0 0 0 2px var(--gold-hi), 0 0 26px rgba(241, 200, 120, .5), 0 14px 24px rgba(0, 0, 0, .55); }
  .card:hover:not(.is-sel) { transform: translateY(-6px); }
  .cards-caption { margin-top: 10px; font-size: var(--fs-caption); color: var(--dim); letter-spacing: .04em; }

  /* スキップの確認（紙の札の上に） */
  .confirm { position: absolute; top: 0; bottom: 0; left: calc(-1 * var(--bx)); right: calc(-1 * var(--bx)); z-index: 20; display: grid; place-items: center; background: rgba(5, 2, 4, .7); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fadeIn .3s ease both; }
  .confirm[hidden] { display: none; }
  .ncard { position: relative; width: 660px; padding: 32px 44px 28px; border-radius: 16px; text-align: center; color: #2a1712; background: linear-gradient(170deg, #fcf7ec, #efe3cb);
    box-shadow: 0 0 0 1px rgba(255, 245, 220, .6) inset, 0 40px 90px rgba(0, 0, 0, .6); display: grid; gap: 14px; justify-items: center; animation: rise .45s var(--ease) both; }
  .ncard::before { content: ""; position: absolute; inset: 10px; border-radius: 9px; border: 1px solid rgba(166, 128, 66, .55); pointer-events: none; }
  .ncard > small { font-family: var(--serif-jp); font-weight: 700; font-size: var(--fs-label); letter-spacing: .3em; color: #8b6a2f; }
  .ncard h2 { font-family: var(--serif-jp); font-weight: 800; font-size: max(36px, calc(22px / var(--k))); letter-spacing: .06em; line-height: 1.3; }
  .ncard p { font-size: var(--fs-body); line-height: 1.7; }
  .ncard p em { font-style: normal; color: var(--heart); font-weight: 700; }
  .yesno { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; text-align: left; }
  .yesno > div { padding: 12px 16px 14px; border-radius: 10px; border: 1px solid rgba(139, 106, 47, .3); background: rgba(255, 255, 255, .35); }
  .yesno b { display: block; font-family: var(--serif-jp); font-size: var(--fs-label); letter-spacing: .12em; margin-bottom: 4px; }
  .yesno .ok b { color: #2f6a3a; }
  .yesno .ng b { color: var(--heart); }
  .yesno ul { list-style: none; display: grid; gap: 2px; font-size: var(--fs-label); line-height: 1.5; color: #3a2a20; }
  .yesno li::before { content: "・"; color: #8b6a2f; }
  .yesno .note { margin-top: 6px; font-size: var(--fs-caption); color: #6a5444; line-height: 1.5; }
  .crow { display: flex; gap: 12px; margin-top: 4px; }
  .crow .cta { width: 280px; letter-spacing: .08em; }
  .crow .cta[disabled] { color: #8a7563; background: rgba(90, 60, 30, .06); box-shadow: inset 0 0 0 1px rgba(139, 106, 47, .4); }
  .crow .ghost { min-height: max(66px, calc(48px / var(--k))); padding: 0 1.6em; color: #5a3a24; border-color: rgba(139, 106, 47, .6); background: none; font-size: var(--fs-label); }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }
  .toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); padding: .6em 1.3em; border-radius: 999px; background: rgba(12, 8, 10, .92); border: 1px solid rgba(241, 216, 158, .3);
    font-size: var(--fs-label); opacity: 0; transition: opacity .25s ease; pointer-events: none; z-index: 30; white-space: nowrap; }
  .toast.is-on { opacity: 1; }

  /* スマホ横持ち */
  html.compact .ttl small { display: none; }
  html.compact .panel { top: 96px; width: 560px; gap: 10px; }
  html.compact .epithet, html.compact .learn, html.compact .hint { display: none; }
  html.compact .memo p { font-size: var(--fs-label); }
  html.compact .hand { right: auto; left: var(--el); bottom: 18px; width: 640px; }
  html.compact .card { width: 104px; height: 146px; }
  html.compact .card .ix { font-size: 24px; }
  html.compact .card .ix i { font-size: 18px; }
  html.compact .card .win { left: 18px; right: 18px; top: 18px; bottom: 18px; }
  html.compact .card .seal { width: 38px; height: 38px; font-size: 19px; }
  html.compact .ghost.sm { width: var(--tap); padding: 0; justify-content: center; font-size: 0; gap: 0; }
  html.compact .ghost.sm svg { width: calc(var(--tap) * .42); height: calc(var(--tap) * .42); }
  html.compact .hero-word { font-size: 150px; top: 520px; }
  html.compact .ncard { width: 920px; }
  @media (prefers-reduced-motion: reduce) { .fig, .hero-breath { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg" aria-hidden="true"></div>
  <div class="grade" aria-hidden="true"></div>
  <section class="hero" aria-hidden="true">
    <div class="hero-word" id="heroWord"></div>
    <div class="hero-breath"><img class="fig" id="figA" alt=""><img class="fig" id="figB" alt=""></div>
  </section>
  <div class="fore" aria-hidden="true"></div>

  <header class="top">
    <button class="back" type="button" id="backBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>ホーム</button>
    <h1 class="ttl"><small>TABLES</small><b>卓を選ぶ</b></h1>
    <span class="spacer"></span>
    <div class="coins" title="コイン"><img src="../../assets/ui/chip_gold.webp" alt=""><b id="coins">850</b><small>COINS</small></div>
    <button class="gear" type="button" aria-label="音量と設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h0a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
  </header>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="p-eye"><span class="ep" id="pEp"></span><span class="chip" id="pState"></span><span class="prof" id="pProf"></span></div>
    <h2 class="name jp" id="pName"></h2>
    <p class="epithet jp" id="pEpithet"></p>
    <div class="rule"></div>
    <div class="learn"><small>この卓で覚えること</small><b class="jp" id="pLearn"></b></div>
    <div class="memo jp"><p id="pTip"></p><span class="sig"><img id="pTipFace" alt=""></span></div>
    <div class="reward" id="pReward"></div>
    <button class="cta" id="pCta" type="button"></button>
  </aside>

  <nav class="hand" aria-label="相手を選ぶ">
    <div class="hand-head"><small>ROYAL FLUSH</small><span id="handLeft"></span><em class="hint">札を押すと見られる</em></div>
    <div class="cards" id="cards"></div>
  </nav>

  <div class="confirm" id="confirm" hidden><div class="ncard" role="dialog" aria-modal="true" aria-labelledby="cfTitle" id="cfCard"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
// 言葉は本体の正典から：人物紹介＝OPPONENTS.desc／CHAR_FALLBACK、ひとこと＝LOBBY_PRESENT.rico（key を強調）、覚えること＝各話の題字と OPPONENTS.theme、
// 戦術ノートの名前＝TACTIC_NOTES。数字は OPPONENTS（初回・再戦・S のおまけ）と skipStageCost（初回×3）
const SEATS = [
  { id: 'rico_tutorial', rank: '10', ep: 1, name: 'リコ先輩', latin: 'Rico', img: 'rico_greet', face: 'face_rico_bunny', epithet: 'ギャル口調の頼れる先輩', learn: 'ポーカーの基礎（講義・全35問）',
    tip: '理屈も知りたくなったら、いつでも<em>教室</em>においで', prize: 300, rematch: 50 },
  { id: 'polka', rank: 'J', ep: 2, name: 'ポルカ', latin: 'Polka', img: 'polka_default', face: 'face_polka', epithet: '調子乗りの初心者客', learn: 'ブラフ入門',
    tip: '今夜の相手はポルカ。声がでかい時ほど、<em>手は弱い</em>。耳を澄ませな', prize: 500, rematch: 200, sbonus: 200 },
  { id: 'selina', rank: 'Q', ep: 3, name: 'セリナ', latin: 'Selina', img: 'selina_default', face: 'face_selina', epithet: '落ち着いた常連プレイヤー', learn: '場札の危なさ・賭ける額の意味',
    tip: 'セリナは理詰めの女。<em>ベット額</em>の“意味”を読みな', prize: 700, rematch: 300, sbonus: 300, note: 'ボード危険度の読み方' },
  { id: 'grano', rank: 'K', ep: 4, name: 'グラーノ', latin: 'Grano', img: 'grano_default', face: 'face_grano', epithet: 'ポーカーを商談のように考える商人', learn: 'ポットオッズ・割に合う判断',
    tip: 'グラーノは何でも値段で誘ってくる。<em>払う価値</em>は自分で計算しな', prize: 900, rematch: 400, sbonus: 400, note: 'ポットオッズの計算' },
  { id: 'velvet', rank: 'A', ep: 5, name: 'ヴェルベット', latin: 'Velvet', img: 'velvet_default', face: 'face_velvet', epithet: 'VIPルームを仕切るボスディーラー', learn: '覚えたことを全部つなぐ',
    tip: 'ヴェルベットは言葉と圧で心を折りに来る。あんたはもう<em>全部の武器</em>を持ってる', prize: 1500, rematch: 700, sbonus: 700, note: 'レンジの考え方', vip: true },
];
const q = new URLSearchParams(location.search);
const STATE = q.get('state') || 'mid';
const cleared = STATE === 'clear' ? SEATS.map(s => s.id) : STATE === 'early' ? ['rico_tutorial'] : STATE === 'last' ? ['rico_tutorial', 'polka', 'selina', 'grano'] : ['rico_tutorial', 'polka', 'selina'];
const coins = STATE === 'early' ? 300 : STATE === 'clear' ? 6240 : STATE === 'last' ? 1750 : 850;
const lectureDone = STATE === 'clear';
const unlocked = (i) => i === 0 || cleared.includes(SEATS[i - 1].id);
const nextIdx = SEATS.findIndex((s, i) => unlocked(i) && !cleared.includes(s.id));
let sel = Math.max(0, SEATS.findIndex(s => s.id === q.get('sel')));
if (!q.get('sel')) sel = nextIdx >= 0 ? nextIdx : 0;
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString();
$('coins').textContent = fmt(coins);
const LOCK = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
const PROFILE = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>';
const DRESS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3l3 3 3-3M9 3L6 8l3 2-2 11h10L15 10l3-2-3-5"/></svg>';

function renderCards() {
  $('cards').innerHTML = SEATS.map((s, i) => {
    const won = cleared.includes(s.id), unl = unlocked(i);
    const cls = ['card', !unl ? 'is-back' : '', i === nextIdx ? 'is-next' : '', i === sel ? 'is-sel' : ''].filter(Boolean).join(' ');
    const body = unl ? `<span class="ix">${s.rank}<i>♥</i></span><span class="win"><img src="../../assets/ui/${s.face}.webp" alt=""></span>${won ? '<span class="seal">勝</span>' : ''}` : `<span class="lock">${LOCK}</span>`;
    return `<button class="${cls}" type="button" data-i="${i}" aria-pressed="${i === sel}" aria-label="${s.rank}♥ ${unl ? s.name : '伏せ札'}${won ? '（勝利済み）' : ''}">${body}</button>`;
  }).join('');
  const own = cleared.length;
  $('handLeft').textContent = own >= SEATS.length ? '完成！ 全員に勝った' : `あと ${SEATS.length - own} 枚で完成`;
}
function rewardHtml(s, won, unl, skip) {
  if (s.id === 'rico_tutorial') {
    return lectureDone ? `<div class="r-main"><small>リコの教室</small><span>修了ずみ。いつでも復習できる</span></div>`
      : `<div class="r-main"><small>最後まで受けると</small><b><span class="pl">+</span>${fmt(s.prize)}</b><span>コイン ＋ ご褒美CG</span></div><div class="r-sub"><span>正解するたびに <b><span class="pl">+</span>5</b></span><span>途中でやめても続きから</span></div>`;
  }
  if (won) return `<div class="r-main"><small>再戦で勝つと</small><b><span class="pl">+</span>${fmt(s.rematch)}</b><span>コイン</span></div><div class="r-sub"><span>Sランクなら さらに <b><span class="pl">+</span>${fmt(s.sbonus)}</b></span></div>`;
  const sub = [`<span>Sランクなら さらに <b><span class="pl">+</span>${fmt(s.sbonus)}</b></span>`];
  if (s.note) sub.push(`<span>戦術ノート「${s.note}」</span>`);
  return `<div class="r-main"><small>勝つと</small><b>${fmt(s.prize)}</b><span>コイン ＋ ${s.vip && !unl ? '秘密の' : 'ご褒美'}CG</span>${skip}</div><div class="r-sub">${sub.join('')}</div>`;
}
function renderPanel() {
  const s = SEATS[sel], i = sel, won = cleared.includes(s.id), unl = unlocked(i), isNext = i === nextIdx;
  $('pEp').innerHTML = `EPISODE <b>${String(s.ep).padStart(2, '0')}</b> · ${s.rank}♥${s.vip ? ' · VIP' : ''}`;
  const st = $('pState');
  st.className = 'chip ' + (isNext ? 'is-next' : won ? 'is-won' : !unl ? 'is-locked' : '');
  st.textContent = isNext ? '次の卓' : won ? '勝利済み' : !unl ? '伏せ札' : '';
  st.hidden = !st.textContent;
  $('pName').textContent = unl ? s.name : '？？？';
  $('pEpithet').textContent = unl ? s.epithet : (s.vip ? 'VIPルームの主' : 'まだ会っていない相手');
  $('pLearn').textContent = s.learn;
  const prev = SEATS[i - 1];
  $('pTip').innerHTML = unl ? s.tip : `${prev ? prev.name : ''}に勝ったら、<em>紹介</em>してあげる`;
  $('pTipFace').src = '../../assets/ui/face_rico_bunny.webp';
  const skipCost = s.prize * 3;
  const skip = isNext && s.id !== 'rico_tutorial' ? `<button class="link" type="button" id="skipBtn">スキップ（${fmt(skipCost)}）</button>` : '';
  $('pReward').innerHTML = rewardHtml(s, won, unl, skip);
  if ($('skipBtn')) $('skipBtn').addEventListener('click', () => openSkip(s, skipCost));
  const cta = $('pCta');
  cta.disabled = !unl;
  if (!unl) cta.innerHTML = `${LOCK}${prev.name}に勝つと開きます`;
  else if (s.id === 'rico_tutorial') cta.innerHTML = `${lectureDone ? '教室で復習する' : '講義を受ける'}${ARROW}`;
  else cta.innerHTML = `${won ? '再戦する' : 'この卓につく'}${ARROW}`;
  $('pProf').innerHTML = unl ? `${s.id === 'rico_tutorial' ? `<button class="ghost sm" type="button" data-msg="衣装を開く">${DRESS}衣装</button>` : ''}<button class="ghost sm" type="button" data-msg="${s.name}のプロフィールを開く">${PROFILE}プロフィール</button>` : '';
  document.querySelectorAll('#pProf [data-msg]').forEach(b => b.addEventListener('click', () => toast(b.dataset.msg)));
}
function openSkip(s, cost) {
  const enough = coins >= cost;
  $('cfCard').innerHTML = `<small>スキップ</small><h2 id="cfTitle">コインで、${s.name}に<br>勝ったことにする？</h2>
    <p><em>${fmt(cost)} コイン</em>を使う（今 ${fmt(coins)} コイン）</p>
    <div class="yesno"><div class="ok"><b>もらえる</b><ul><li>次の卓が開く</li><li>♥${s.rank} の札</li>${s.note ? `<li>戦術ノート「${s.note}」</li>` : ''}</ul></div>
    <div class="ng"><b>もらえない</b><ul><li>賞金 ${fmt(s.prize)} コイン</li><li>ランク・ご褒美CG</li></ul><p class="note">CGと幕間は、あとで勝てば見られる</p></div></div>
    <div class="crow"><button class="cta" type="button" id="cfYes"${enough ? '' : ' disabled'}>${enough ? `${fmt(cost)} 使う` : 'コインが足りない'}</button><button class="ghost" type="button" id="cfNo">やめる</button></div>`;
  $('confirm').hidden = false;
  $('cfNo').addEventListener('click', () => { $('confirm').hidden = true; });
  $('cfYes').addEventListener('click', () => { $('confirm').hidden = true; toast('（見本）スキップした'); });
}
let front = null, token = 0;
async function renderHero() {
  const s = SEATS[sel], unl = unlocked(sel), t = ++token;
  const a = $('figA'), b = $('figB'), next = front === a ? b : a, cur = front;
  next.classList.remove('is-front', 'is-leaving'); next.classList.toggle('is-locked', !unl);
  next.src = `../../assets/characters/hd/${s.img}.webp`;
  try { await next.decode(); } catch (e) {}
  if (t !== token) return;
  void next.offsetWidth; next.classList.add('is-front');
  if (cur && cur !== next) { cur.classList.remove('is-front'); cur.classList.add('is-leaving'); }
  front = next;
  $('heroWord').textContent = unl ? s.latin : '';
}
const PRE = SEATS.map(s => { const im = new Image(); im.src = `../../assets/characters/hd/${s.img}.webp`; im.decode().catch(() => {}); return im; });
function select(i, animate = true) {
  if (i === sel && animate) return;
  sel = i;
  const panel = $('panel');
  if (animate) { panel.classList.add('is-swap'); setTimeout(() => { renderPanel(); panel.classList.remove('is-swap'); }, 200); } else renderPanel();
  renderHero(); renderCards();
}
$('cards').addEventListener('click', (e) => { const b = e.target.closest('.card'); if (b) select(+b.dataset.i); });
addEventListener('keydown', (e) => {
  if (!$('confirm').hidden) { if (e.key === 'Escape') $('confirm').hidden = true; return; }
  if (e.key === 'ArrowRight') select(Math.min(SEATS.length - 1, sel + 1));
  if (e.key === 'ArrowLeft') select(Math.max(0, sel - 1));
  if (e.key === 'Escape') $('backBtn').click();
});
let tt = 0;
const toast = (m) => { const t = $('toast'); t.textContent = m; t.classList.add('is-on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('is-on'), 1600); };
$('pCta').addEventListener('click', () => { if (!$('pCta').disabled) toast('（見本）卓につく → 第N話の題字 → 対戦'); });
$('backBtn').addEventListener('click', () => { location.href = `home-v11.html?state=${STATE}`; });
function fit() {
  const k = Math.min(innerWidth / 1280, innerHeight / 800);
  const bx = Math.max(0, Math.min(320, (innerWidth / k - 1280) / 2));
  const r = document.documentElement.style; r.setProperty('--k', k); r.setProperty('--bx', `${bx}px`);
  document.documentElement.classList.toggle('compact', k < 0.6);
}
addEventListener('resize', fit); fit();
select(sel, false);
</script>
</body>
</html>
