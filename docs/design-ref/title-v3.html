<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイトル v3 見本</title>
<!-- タイトル画面の見本 v3（2026-10-04）。本体（index.html の tpl-title・style.css の .title-screen.t3）に組み込み済み。1280×800 で見る。
     v2 で作った絵とロゴの差し替えはやめ、今の背景（title_bg）とロゴ（title_logo）を活かして良くする：
     ・背景：ミミは元の絵のまま動かさない。ミミの写っていない背景だけを動かした動画（title_loop_v3.mp4）を重ねる
     ・ロゴ：同じデザインを高解像度にした title_logo_hd.webp。現れる時に金の光が一度走る
     ・操作：ミミの体に重ならない右下へ。絵文字をやめ、卓の見本 v7 と同じ決まりごと（金は押してほしい1つだけ）
     ・演出：黒からフェードイン → ロゴ → ボタンの順。背景は24秒かけてゆっくり寄り、光の粒が舞う（視差効果を減らす設定では止める） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;700;800&display=swap">
<style>
  :root {
    --ink: #0b0809; --line: rgba(243,236,224,.18); --line-strong: rgba(243,236,224,.34);
    --ivory: #f3ece0; --muted: #b3a998; --gold: #d8b56c; --gold-hi: #f0d595; --gold-ink: #1a1206;
    --num: "Barlow Condensed", "Noto Sans JP", sans-serif; --sans: "Noto Sans JP", sans-serif; --mincho: "Shippori Mincho B1", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  body { font-family: var(--sans); color: var(--ivory); -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 1280px; height: 800px; overflow: hidden; background: #000; isolation: isolate; }

  /* ---- 背景：一枚絵＋背景だけ動く動画。全体をゆっくり寄せる ---- */
  .scene { position: absolute; inset: 0; animation: sceneIn 1.1s ease-out both, push 24s ease-in-out 1.1s infinite alternate; transform-origin: 38% 45%; }
  .scene img, .scene video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scene video { opacity: 0; transition: opacity .8s ease; }
  .scene video.is-playing { opacity: 1; }
  @keyframes sceneIn { from { opacity: 0; filter: brightness(.4); } to { opacity: 1; filter: none; } }
  @keyframes push { from { transform: scale(1); } to { transform: scale(1.035); } }

  /* 縁を沈めて視線を中へ。右下は操作を置くので少し深く */
  .grade { position: absolute; inset: 0; pointer-events: none; background:
      radial-gradient(120% 95% at 40% 42%, rgba(0,0,0,0) 55%, rgba(8,4,6,.55) 100%),
      radial-gradient(48% 46% at 86% 86%, rgba(8,4,6,.72) 0%, rgba(8,4,6,0) 100%),
      linear-gradient(0deg, rgba(8,4,6,.55) 0%, rgba(8,4,6,0) 22%); }

  /* 光の粒：ゆっくり上へ漂う（位置・不透明度だけ動かす） */
  .motes { position: absolute; inset: 0; pointer-events: none; }
  .motes i { position: absolute; width: var(--s); height: var(--s); border-radius: 50%; left: var(--x); top: var(--y);
    background: radial-gradient(circle, rgba(255,226,160,.95) 0%, rgba(255,200,120,.35) 45%, rgba(255,200,120,0) 70%);
    opacity: 0; animation: mote var(--d) linear var(--delay) infinite; }
  @keyframes mote { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: var(--o); } 85% { opacity: var(--o); } 100% { opacity: 0; transform: translate(var(--dx), -140px); } }

  /* ---- ロゴ：中央やや右の上。大時計が後ろからのぞく ---- */
  .logo { position: absolute; left: 472px; top: 34px; width: 600px; aspect-ratio: 1600 / 939; animation: logoIn 1s cubic-bezier(.2,.8,.2,1) .35s both; filter: drop-shadow(0 18px 30px rgba(0,0,0,.55)); }
  .logo img { width: 100%; height: 100%; display: block; }
  @keyframes logoIn { from { opacity: 0; transform: translateY(-10px) scale(1.04); filter: blur(6px) drop-shadow(0 18px 30px rgba(0,0,0,.55)); } to { opacity: 1; transform: none; } }
  /* ロゴの形で切り抜いた金の光が一度走る（以後10秒ごとに弱く） */
  .logo .shine { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
    -webkit-mask: url('../../assets/ui/title_logo_hd.webp') center / 100% 100% no-repeat; mask: url('../../assets/ui/title_logo_hd.webp') center / 100% 100% no-repeat;
    background: linear-gradient(105deg, rgba(255,240,200,0) 42%, rgba(255,240,200,.75) 50%, rgba(255,240,200,0) 58%) no-repeat;
    background-size: 260% 100%; background-position: 130% 0; animation: shine 1.4s ease-in-out 1.25s 1 both, shine2 1.6s ease-in-out 11s infinite; }
  @keyframes shine { from { background-position: 130% 0; } to { background-position: -30% 0; } }
  @keyframes shine2 { 0% { background-position: 130% 0; opacity: .55; } 30%, 100% { background-position: -30% 0; opacity: .55; } }

  /* ---- 操作：右下。金は「続きから」だけ ---- */
  .menu { position: absolute; right: 64px; bottom: 92px; width: 340px; display: grid; gap: 10px; animation: rise .7s ease-out 1.5s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .btn { display: flex; justify-content: space-between; align-items: center; height: 60px; padding: 0 22px; border: 1px solid var(--line-strong); background: rgba(14,9,10,.62); color: var(--ivory); font: inherit; border-radius: 2px; text-align: left; backdrop-filter: blur(2px); }
  .btn b { font-size: 18px; font-weight: 700; letter-spacing: .16em; }
  .btn small { font-family: var(--num); font-size: 14px; letter-spacing: .14em; color: var(--muted); }
  .btn.primary { height: 66px; color: var(--gold-ink); border-color: var(--gold-hi);
    background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 100%); box-shadow: 0 10px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.45); }
  .btn.primary small { color: rgba(26,18,6,.72); }
  .record { display: flex; justify-content: flex-end; gap: 18px; margin-top: 4px; font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  .record b { font-family: var(--num); font-weight: 500; font-size: 15px; color: var(--ivory); letter-spacing: .04em; margin-left: 6px; }

  /* ---- 隅：右上に音・シェア・設定、左下に版 ---- */
  .utils { position: absolute; right: 24px; top: 20px; display: flex; gap: 8px; animation: rise .7s ease-out 1.6s both; }
  .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); background: rgba(12,9,10,.5); color: var(--ivory); border-radius: 2px; }
  .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ver { position: absolute; left: 24px; bottom: 18px; font-family: var(--num); font-size: 13px; letter-spacing: .16em; color: rgba(243,236,224,.5); }

  @media (prefers-reduced-motion: reduce) { .scene, .logo, .logo .shine, .menu, .utils, .motes i { animation: none !important; } .motes { display: none; } }
</style>
</head>
<body>
<div class="stage">
  <div class="scene">
    <img src="../../assets/backgrounds/title_bg.webp" alt="">
    <video muted playsinline loop autoplay preload="auto"></video>
  </div>
  <div class="grade"></div>
  <div class="motes" aria-hidden="true">
    <i style="--x:640px;--y:520px;--s:7px;--d:9s;--delay:0s;--o:.7;--dx:18px"></i>
    <i style="--x:760px;--y:600px;--s:5px;--d:11s;--delay:2s;--o:.55;--dx:-14px"></i>
    <i style="--x:880px;--y:470px;--s:6px;--d:10s;--delay:4.5s;--o:.6;--dx:22px"></i>
    <i style="--x:990px;--y:560px;--s:4px;--d:12s;--delay:1.2s;--o:.5;--dx:-10px"></i>
    <i style="--x:1120px;--y:420px;--s:6px;--d:9.5s;--delay:3.3s;--o:.6;--dx:12px"></i>
    <i style="--x:560px;--y:300px;--s:4px;--d:13s;--delay:6s;--o:.45;--dx:16px"></i>
    <i style="--x:1200px;--y:640px;--s:5px;--d:10.5s;--delay:5.2s;--o:.5;--dx:-18px"></i>
    <i style="--x:700px;--y:250px;--s:3px;--d:12s;--delay:7.4s;--o:.4;--dx:10px"></i>
    <i style="--x:920px;--y:700px;--s:6px;--d:11.5s;--delay:8.1s;--o:.55;--dx:-12px"></i>
    <i style="--x:430px;--y:640px;--s:4px;--d:10s;--delay:3.8s;--o:.45;--dx:14px"></i>
  </div>

  <div class="logo"><img src="../../assets/ui/title_logo_hd.webp" alt="ミミのテキサスホールデムポーカー 〜転生したらバニーガールだった私の外れスキル《ぱにゅぱにゅ》だけがレベルアップな件〜"><i class="shine"></i></div>

  <div class="menu">
    <button class="btn primary"><b>続きから</b><small>STAGE 3 / 4</small></button>
    <button class="btn"><b>はじめから</b></button>
    <div class="record"><span>クリア<b>2 / 4</b></span><span>コイン<b>1,200</b></span></div>
  </div>

  <nav class="utils">
    <button class="icon-btn" aria-label="音量"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button class="icon-btn" aria-label="シェア"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="17.5" cy="6" r="2.5"/><circle cx="17.5" cy="18" r="2.5"/><path d="M8.2 10.9l7-3.7M8.2 13.1l7 3.7"/></svg></button>
    <button class="icon-btn" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></button>
  </nav>
  <div class="ver">v1.0</div>
</div>
<script>
  // ?mv=<動画のパス> で背景の動画を差し替える。?ui=1 で絵と動画を外す（動画に重ねた確認用の合成に使う）。?still=1 で演出を止めた最後の姿
  const q = new URLSearchParams(location.search);
  if (q.get('ui')) { document.querySelector('.scene').remove(); document.querySelector('.stage').style.background = 'transparent'; document.documentElement.style.background = document.body.style.background = 'transparent'; }
  if (q.get('still')) { const s = document.createElement('style'); s.textContent = '*,*::before,*::after{animation-delay:-30s !important;animation-play-state:paused !important}.motes,.logo .shine{display:none}'; document.head.appendChild(s); }
  const v = document.querySelector('.scene video');
  if (v) {
    v.addEventListener('playing', () => v.classList.add('is-playing'), { once: true });
    v.addEventListener('error', () => v.remove(), { once: true });
    v.src = q.get('mv') || '../../assets/motion/title_loop_v3.mp4';
    const pr = v.play(); if (pr && pr.catch) pr.catch(() => {});
  }
</script>
</body>
</html>
