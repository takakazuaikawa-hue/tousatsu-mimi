<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ホーム v15 見本</title>
<!-- ホームの見本 v15（2026-10-15）。v14 の部品を空間に置き、動かす（FABLE: home-r4-fable.md と ASTRA: home-r4-astra.md の合わせ）。
     札は左の留め金で吊って奥行きと位置をずらす／額は鎖で吊って揺れる／台帳は卓に寝かせる／今夜の札は卓に立てて最前／奥行きごとの視差／長針の先が光ると今夜の札が跳ねる。
     元は v14：目標の姿＝完成予想図 m3b（qa-shots-1015/home_concept_m3b.png）。
     本番の部品（ChatGPT で描いて純緑を切り抜いた物）で組み立てる：img/home/
     層：背景（時計の文字盤を裏から見た逆光の舞台）→ 長針 → リコ先輩（頬杖）→ 手前の卓の縁 → UI部品 → コードの文字 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Bodoni+Moda:wght@600;700&display=swap">
<style>
  :root { --k: 1; --sw: 1280px; --ivory: #fbf1dc; --gold-hi: #f6dc9e; --serif-jp: "Shippori Mincho B1", serif; --serif: "Bodoni Moda", serif; --ease: cubic-bezier(.2,.7,.2,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0a0405; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stage { position: fixed; left: 0; top: 0; width: var(--sw); height: 800px; transform: scale(var(--k)); transform-origin: 0 0; overflow: hidden; font-family: var(--serif-jp); color: var(--ivory); }

  /* ===== 絵の層 ===== */
  .bg { position: absolute; left: 50%; top: -10px; width: 1460px; height: 822px; margin-left: -730px; background: url('img/home/scene.webp') center / 100% 100% no-repeat; }
  .fore { clip-path: inset(655px 0 0 0); }
  .glow { position: absolute; left: 50%; top: 247px; width: 620px; height: 620px; margin: -310px 0 0 -242px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(circle, rgba(255,214,140,.22), rgba(255,200,120,0) 62%); animation: glow 6s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .6; } to { opacity: 1; } }
  .vig { position: absolute; inset: 0; pointer-events: none; background:
      linear-gradient(90deg, rgba(10,3,5,.72) 0, rgba(10,3,5,.25) 300px, rgba(10,3,5,0) 420px, rgba(10,3,5,0) calc(100% - 420px), rgba(10,3,5,.3) calc(100% - 300px), rgba(10,3,5,.72) 100%),
      linear-gradient(180deg, rgba(10,3,5,.45) 0, rgba(10,3,5,0) 120px); }
  .hand { position: absolute; left: calc(50% + 67px); top: 246px; width: 380px; height: 26px; margin-top: -13px; transform-origin: 0 50%; transform: rotate(57deg); pointer-events: none;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,.55)); animation: tick 6s ease-in-out infinite; }
  @keyframes tick { 0%, 92% { transform: rotate(57deg); } 95% { transform: rotate(57.8deg); } 100% { transform: rotate(57deg); } }
  .rico { position: absolute; left: calc(50% - 600px); top: 34px; width: 1140px; transform-origin: 50% 90%; animation: breath 6s ease-in-out infinite alternate; pointer-events: none; }
  @keyframes breath { to { transform: translateY(-3px) scale(1.004); } }

  /* ===== UI 部品（絵）＋文字 ===== */
  .ui { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s var(--ease); }
  .stage { perspective: 1400px; }
  .part { position: absolute; display: block; }
  .part img.f { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 2px 0 rgba(58,30,4,.95)) drop-shadow(0 4px 3px rgba(0,0,0,.55)) drop-shadow(0 16px 22px rgba(0,0,0,.6)); transition: filter .3s; }
  .part::after { content: ""; position: absolute; inset: 0; pointer-events: none; -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat;
    background: radial-gradient(120% 90% at var(--lx, 22%) var(--ly, 0%), rgba(255,244,210,.42), rgba(255,244,210,0) 46%), linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.28)); mix-blend-mode: soft-light; }
  .part:hover > img.f { filter: drop-shadow(0 2px 0 rgba(58,30,4,.95)) drop-shadow(0 6px 4px rgba(0,0,0,.5)) drop-shadow(0 26px 30px rgba(0,0,0,.65)); }
  .lbl { position: absolute; font-weight: 800; letter-spacing: .08em; text-shadow: 0 1px 0 rgba(0,0,0,.6), 0 0 10px rgba(0,0,0,.6); white-space: nowrap; }
  .gold-txt { background: linear-gradient(180deg, #fff3cf, #f0cf83 48%, #b8873a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 -1px 0 rgba(255,250,225,.55)) drop-shadow(0 1.5px 0 rgba(48,16,0,.95)) drop-shadow(0 3px 4px rgba(0,0,0,.65)); text-shadow: none; }

  .nameplate { left: 22px; top: 18px; width: 270px; height: 73px; }
  .nameplate .lbl { left: 33%; right: 8%; top: 50%; transform: translateY(-50%); text-align: center; font-size: 27px; letter-spacing: .4em; }

  .places { position: absolute; left: 38px; top: 102px; display: grid; gap: 4px; }
  .pl { position: relative; width: 262px; height: 78px; transition: transform .25s var(--ease), filter .25s; animation: plIn .7s var(--ease) both; animation-delay: calc(.2s + var(--i) * .06s); }
  @keyframes plIn { from { opacity: 0; transform: translateX(-24px); } }
  .pl:hover { transform: translate(4px, -3px); filter: brightness(1.1); }
  .pl .ico { position: absolute; left: 7.6%; top: 50%; width: 30px; height: 30px; transform: translateY(-50%); color: var(--gold-hi); filter: drop-shadow(0 1px 2px #000); }
  .pl .lbl { left: 30%; right: 8%; top: 50%; transform: translateY(-50%); font-size: 21px; text-align: center; }
  .pl.pic .lbl { left: 15%; right: 37%; font-size: 16px; letter-spacing: 0; }
  .pl.pic .win { position: absolute; left: 63.6%; top: 24%; width: 25.4%; height: 52%; object-fit: cover; object-position: 50% 20%; }
  .pl .tag { position: absolute; right: -6px; top: -6px; font-family: var(--serif-jp); font-weight: 800; font-size: 12px; color: var(--gold-hi); background: linear-gradient(180deg, #a3132b, #5e0716); padding: 3px 8px; border: 1px solid #d9b46a; box-shadow: 0 3px 6px rgba(0,0,0,.6); }

  .ledger { left: 22px; bottom: 30px; width: 384px; height: 153px; }
  .ledger .lbl { left: 0; right: 0; top: -26px; text-align: left; font-size: 17px; letter-spacing: .1em; }
  .ledger .lbl small { font-size: 13px; opacity: .8; }
  .slot { position: absolute; top: 22%; width: 14.4%; height: 58%; overflow: hidden; }
  .slot img.p { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; }
  .slot .rn { position: absolute; left: 0; right: 0; top: 2px; text-align: center; font-family: var(--serif); font-size: 12px; color: var(--gold-hi); text-shadow: 0 1px 3px #000; }
  .slot .st { position: absolute; right: 2px; bottom: 2px; width: 26px; }
  .slot.win img.p { filter: saturate(.8) brightness(.85); }
  .slot.now { box-shadow: inset 0 0 0 2px rgba(255,226,150,.9), 0 0 16px rgba(255,214,140,.7); }
  .slot.now .st { width: 16px; right: 4px; bottom: 0; }
  .slot.lock img.p { filter: grayscale(1) brightness(.35); }
  .slot.lock .st { left: 50%; top: 50%; right: auto; bottom: auto; width: 30px; transform: translate(-50%, -50%); }

  .top { position: absolute; right: 22px; top: 16px; display: flex; gap: 8px; }
  .oct { position: relative; width: 58px; height: 58px; }
  .oct svg { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; color: var(--gold-hi); }
  .oct .dot { position: absolute; right: 9px; top: 9px; width: 10px; height: 10px; border-radius: 50%; background: #e3243f; box-shadow: 0 0 0 2px #2a0a0e, 0 0 8px #e3243f; }
  .purse { position: relative; height: 58px; display: flex; align-items: center; gap: 6px; padding: 0 6px; }
  .purse b { font-family: var(--serif); font-size: 26px; }

  .frame { right: 30px; top: 96px; width: 300px; height: 396px; }
  .frame .pic { position: absolute; left: 16.7%; top: 13%; width: 66.3%; height: 63.2%; object-fit: cover; object-position: 50% 20%; filter: sepia(.7) contrast(1.12) saturate(.85); }
  .frame .lbl { left: 19%; right: 20%; top: 84.5%; transform: translateY(-50%); text-align: center; font-size: 24px; letter-spacing: .14em; }
  .frame .sub { position: absolute; left: 0; right: 0; top: -2px; text-align: center; font-size: 13px; letter-spacing: .2em; color: var(--gold-hi); text-shadow: 0 1px 4px #000; }

  .ticket { right: 22px; bottom: 26px; width: 386px; height: 245px; animation: beat 2.6s ease-in-out infinite; }
  @keyframes beat { 50% { filter: drop-shadow(0 0 18px rgba(255,214,140,.55)); } }
  .ticket .lbl { left: 12%; right: 12%; top: 54%; transform: translateY(-50%); text-align: center; font-size: 44px; letter-spacing: .1em; }
  .ticket .prize { position: absolute; left: 0; right: 0; top: 70%; text-align: center; font-size: 14px; color: var(--gold-hi); letter-spacing: .06em; text-shadow: 0 1px 3px #000; }
  .ticket .shine { position: absolute; inset: 22% 10%; overflow: hidden; pointer-events: none; }
  .ticket .shine::after { content: ""; position: absolute; top: -20%; bottom: -20%; width: 60px; left: -80px; transform: skewX(-20deg); background: linear-gradient(90deg, rgba(255,240,200,0), rgba(255,240,200,.35), rgba(255,240,200,0)); animation: sheen 8s ease-in-out 2s infinite; }
  @keyframes sheen { 0% { left: -80px; } 14%, 100% { left: 110%; } }
  .ticket:active { transform: translateY(3px); }

  /* ===== v15：部品を空間に置く ===== */
  .ui, .places, .top { transform-style: preserve-3d; }
  .pl { animation: none; }
  .part.d3 { transform: translate3d(calc(var(--dx, 0px) + var(--mx, 0) * var(--p, 0) * 1px), calc(var(--dy, 0px) + var(--my, 0) * var(--p, 0) * 1px), calc(var(--z, 0px) + var(--hz, 0px)))
      rotateX(calc(var(--rx, 0deg) * var(--flat, 1))) rotateY(calc(var(--ry, 0deg) * var(--flat, 1))) rotateZ(var(--rz, 0deg)) !important;
    transform-origin: var(--o, 50% 50%); transition: transform .6s cubic-bezier(.2,.8,.2,1), filter .3s; }
  .part.d3:hover { --hz: 16px; --flat: .5; filter: brightness(1.08); }
  .part.d3:active { --hz: -6px; transition-duration: .08s; }
  .part.d3::after { display: none; }
  .en { position: absolute; inset: 0; display: block; transform-origin: var(--o, 50% 50%); animation: enter .7s cubic-bezier(.16,1,.3,1) both; animation-delay: var(--d, 0ms); }
  @keyframes enter { from { opacity: 0; transform: translate3d(var(--fx, -40px), var(--fy, 0px), -80px) rotateX(var(--frx, 0deg)); } 70% { opacity: 1; } }
  .sw { position: absolute; inset: 0; display: block; transform-origin: var(--so, 8% 50%); animation: sway var(--sp, 5s) ease-in-out infinite alternate; animation-delay: var(--sd, 0s); }
  @keyframes sway { from { transform: rotate(calc(var(--sa, .4deg) * -1)); } to { transform: rotate(var(--sa, .4deg)); } }
  /* 部品の形で切った光の膜（揺れと一緒に動く） */
  .sw::after { content: ""; position: absolute; inset: 0; pointer-events: none; -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat;
    background: radial-gradient(120% 90% at var(--lx, 22%) var(--ly, 0%), rgba(255,244,210,.42), rgba(255,244,210,0) 46%), linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.28)); mix-blend-mode: soft-light; }
  /* 留め金のピン */
  .pin { position: absolute; left: 4.5%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; z-index: 3;
    background: radial-gradient(circle at 35% 30%, #fff3c4, #c8963e 50%, #4a2c08 100%); box-shadow: 0 2px 3px rgba(0,0,0,.7); }
  /* 額を吊る鎖 */
  .chain { position: absolute; top: -120px; width: 6px; height: 132px; margin-left: -3px; border-radius: 3px; box-shadow: 0 0 6px rgba(0,0,0,.6);
    background: repeating-linear-gradient(180deg, #f0cf83 0 5px, #7a5420 5px 7px, #c79a48 7px 12px, rgba(0,0,0,0) 12px 13px); }
  /* 長針の先の光 */
  .tip { position: absolute; left: calc(50% + 330px); top: 488px; width: 80px; height: 80px; margin: -40px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen; opacity: 0;
    background: radial-gradient(circle, rgba(255,246,210,.95), rgba(255,210,120,.35) 30%, rgba(255,200,120,0) 70%); }
  .tip.on { animation: tip 1s ease-out; }
  @keyframes tip { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1.6); } }
  .ticket.hop .sw { animation: hop .7s cubic-bezier(.3,1.6,.5,1); }
  @keyframes hop { 0% { transform: none; } 35% { transform: translate3d(0,-10px,24px) rotateZ(2deg); } 100% { transform: none; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg"></div>
  <div class="glow"></div>
  <div class="vig"></div>
  <div class="tip" id="tip"></div>

  <div class="ui" id="ui">
  <div class="part nameplate"><img class="f" src="img/home/nameplate.png" alt=""><span class="lbl gold-txt">ミミ</span></div>

  <nav class="places">
    <button class="part pl" style="--i:0"><img class="f" src="img/home/plate.png" alt=""><svg class="ico" viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></svg><span class="lbl gold-txt">交換所</span><span class="tag">新入荷</span></button>
    <button class="part pl" style="--i:1"><img class="f" src="img/home/plate.png" alt=""><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="3" width="11" height="16" rx="1"/><path d="M9 7l10 2-3 13-9-2"/></svg><span class="lbl gold-txt">コレクション</span></button>
    <button class="part pl pic" style="--i:2"><img class="f" src="img/home/plate_pic.png" alt=""><img class="win" src="../../assets/ui/face_mimi.webp" alt=""><span class="lbl gold-txt">ぱにゅぱにゅ</span><span class="tag">あと5回</span></button>
    <button class="part pl" style="--i:3"><img class="f" src="img/home/plate.png" alt=""><svg class="ico" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg><span class="lbl gold-txt">リコの教室</span></button>
    <button class="part pl pic" style="--i:4"><img class="f" src="img/home/plate_pic.png" alt=""><img class="win" src="../../assets/ui/face_rico_default.webp" alt=""><span class="lbl gold-txt">衣装</span></button>
  </nav>

  <div class="part ledger"><img class="f" src="img/home/ledger.png" alt=""><span class="lbl gold-txt">第4戦 <small>／全5戦</small></span>
    <div class="slot win" style="left:10.2%"><img class="p" src="../../assets/ui/face_rico_default.webp" alt="リコ先輩"><span class="rn">I</span><img class="st" src="img/home/seal.png" alt=""></div>
    <div class="slot win" style="left:26.3%"><img class="p" src="../../assets/ui/face_polka.webp" alt="ポルカ"><span class="rn">II</span><img class="st" src="img/home/seal.png" alt=""></div>
    <div class="slot win" style="left:42.5%"><img class="p" src="../../assets/ui/face_selina.webp" alt="セリナ"><span class="rn">III</span><img class="st" src="img/home/seal.png" alt=""></div>
    <div class="slot now" style="left:58.9%"><img class="p" src="../../assets/ui/face_grano.webp" alt="グラーノ"><span class="rn">IV</span><img class="st" src="img/home/mark.png" alt=""></div>
    <div class="slot lock" style="left:75.1%"><img class="p" src="../../assets/ui/face_velvet.webp" alt=""><span class="rn">V</span><img class="st" src="img/home/lock.png" alt=""></div>
  </div>

  <div class="top">
    <button class="part oct" aria-label="お知らせ"><img class="f" src="img/home/oct.png" alt=""><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><i class="dot"></i></button>
    <button class="part oct" aria-label="贈り物"><img class="f" src="img/home/oct.png" alt=""><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg></button>
    <button class="part oct" aria-label="コイン 850"><img class="f" src="img/home/oct.png" alt=""><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg></button>
    <button class="part oct" aria-label="設定"><img class="f" src="img/home/oct.png" alt=""><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </div>

  <div class="part frame"><img class="pic" src="../../assets/ui/face_grano.webp" alt=""><img class="f" src="img/home/frame.png" alt=""><span class="lbl gold-txt">グラーノ</span></div>

  <button class="part ticket"><img class="f" src="img/home/ticket.png" alt=""><span class="shine"></span><span class="lbl gold-txt">今夜の卓へ</span><span class="prize">勝てば 900 コイン＋ご褒美CG</span></button>
  </div>
</div>
<script>
  const st = document.getElementById('stage');
  function fit() { const k = innerHeight / 800; const w = Math.max(1280, innerWidth / k); document.documentElement.style.setProperty('--k', k); document.documentElement.style.setProperty('--sw', w + 'px'); }
  fit(); addEventListener('resize', fit);
  // 部品の形で光の膜を切る
  document.querySelectorAll('.part').forEach(p => { const im = p.querySelector('img.f'); if (im) p.style.setProperty('--m', 'url(' + im.getAttribute('src') + ')'); });
  // 視差：マウスで UI の層がわずかに傾き、絵は逆へ動く。光の当たる位置も動く
  const ui = document.getElementById('ui'), scene = document.querySelectorAll('.bg, .glow');
  addEventListener('pointermove', e => { const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
    setPar(x, y);
    scene.forEach(n => n.style.translate = (-x * 10) + 'px ' + (-y * 6) + 'px');
    document.documentElement.style.setProperty('--lx', (22 - x * 30) + '%'); });

  // ===== v15：部品ごとの置き方（奥行き z・傾き・ずれ・視差の強さ p・揺れ）と入場 =====
  const SPEC = [
    ['.nameplate', { z: 70, rx: 4, ry: 12, rz: -1, dx: 22, dy: 6, p: 5, o: '10% 50%', so: '10% 50%', sa: .5, sp: 5.2, d: 0, fx: -50 }],
    ['.pl:nth-child(1)', { z: 70, ry: 10, rz: -1.2, dx: 0, p: 5, o: '6% 50%', sa: .4, sp: 4.6, d: 120, frx: -25 }],
    ['.pl:nth-child(2)', { z: 62, ry: 10, rz: .8, dx: 8, p: 4.6, o: '6% 50%', sa: .45, sp: 5.4, d: 180, frx: -25 }],
    ['.pl:nth-child(3)', { z: 54, ry: 10, rz: -.6, dx: 16, p: 4.2, o: '6% 50%', sa: .4, sp: 5.0, d: 240, frx: -25 }],
    ['.pl:nth-child(4)', { z: 46, ry: 10, rz: 1.1, dx: 10, p: 3.8, o: '6% 50%', sa: .5, sp: 5.8, d: 300, frx: -25 }],
    ['.pl:nth-child(5)', { z: 38, ry: 10, rz: -.9, dx: 20, p: 3.4, o: '6% 50%', sa: .4, sp: 4.9, d: 360, frx: -25 }],
    ['.frame', { z: -10, rx: 2, ry: -8, rz: 1, dx: -10, dy: 14, p: 2, o: '50% 0%', so: '50% -30%', sa: .6, sp: 7, d: 420, fx: 0, fy: -60 }],
    ['.ledger', { z: 60, rx: 18, ry: 5, rz: -2, dx: 10, dy: -4, p: 5, o: '50% 100%', sa: 0, d: 480, fx: 0, fy: 50 }],
    ['.top .oct:nth-child(1)', { z: 40, ry: -10, p: 2, sa: 2, sp: 4.5, so: '50% 0%', d: 200, fx: 0, fy: -30 }],
    ['.top .oct:nth-child(2)', { z: 34, ry: -10, dy: 4, p: 2, sa: 0, d: 240, fx: 0, fy: -30 }],
    ['.top .oct:nth-child(3)', { z: 28, ry: -10, dy: 1, p: 2, sa: 0, d: 280, fx: 0, fy: -30 }],
    ['.top .oct:nth-child(4)', { z: 22, ry: -10, dy: 6, p: 2, sa: 0, d: 320, fx: 0, fy: -30 }],
    ['.ticket', { z: 80, rx: -6, ry: -10, rz: 2, dx: -46, dy: -22, p: 8, o: '50% 100%', so: '50% 100%', sa: .3, sp: 6, d: 620, fx: 50, fy: 40, frx: -40 }],
  ];
  const parts = [];
  st.classList.toggle('sm', innerHeight < 500);
  const small = st.classList.contains('sm') ? .5 : 1;
  for (const [sel, v] of SPEC) document.querySelectorAll(sel).forEach(el => {
    const en = document.createElement('span'); en.className = 'en'; const sw = document.createElement('span'); sw.className = 'sw';
    while (el.firstChild) sw.appendChild(el.firstChild); en.appendChild(sw); el.appendChild(en); el.classList.add('d3');
    const set = (k, val) => el.style.setProperty(k, val);
    set('--z', v.z * small + 'px'); set('--rx', (v.rx || 0) * small + 'deg'); set('--ry', (v.ry || 0) * small + 'deg'); set('--rz', (v.rz || 0) + 'deg');
    set('--dx', (v.dx || 0) + 'px'); set('--dy', (v.dy || 0) + 'px'); set('--p', v.p * small); set('--o', v.o || '50% 50%');
    set('--so', v.so || v.o || '8% 50%'); set('--sa', (v.sa || 0) + 'deg'); set('--sp', (v.sp || 5) + 's'); set('--sd', (-Math.random() * 5) + 's');
    set('--d', (v.d || 0) + 'ms'); set('--fx', (v.fx ?? -40) + 'px'); set('--fy', (v.fy || 0) + 'px'); set('--frx', (v.frx || 0) + 'deg');
    if (el.classList.contains('pl') || el.classList.contains('nameplate')) { const pin = document.createElement('i'); pin.className = 'pin'; sw.appendChild(pin); }
    if (el.classList.contains('frame')) [22, 78].forEach(l => { const c = document.createElement('i'); c.className = 'chain'; c.style.left = l + '%'; sw.appendChild(c); });
    const im = sw.querySelector('img.f'); if (im) sw.style.setProperty('--m', 'url(' + im.getAttribute('src') + ')');
    parts.push(el);
  });
  function setPar(x, y) { parts.forEach(el => { el.style.setProperty('--mx', x * 2); el.style.setProperty('--my', y * 2); }); }
  // 署名演出：長針の先が光ると、今夜の札が跳ねる（6秒ごと）
  const tip = document.getElementById('tip'), tk = document.querySelector('.ticket');
  setInterval(() => { tip.classList.remove('on'); void tip.offsetWidth; tip.classList.add('on'); setTimeout(() => { tk.classList.remove('hop'); void tk.offsetWidth; tk.classList.add('hop'); }, 120); }, 6000);
</script>
