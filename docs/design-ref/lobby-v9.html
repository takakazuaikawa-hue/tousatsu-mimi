<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロビー v9 見本</title>
<!-- ロビーの見本 v9（2026-10-05）。1280×800 の舞台。スマホでは本体と同じく舞台ごと縮み、文字は下の「文字の大きさの基準」で画面上の下限を守る。
     v8（5人を床に並べ、足元に♥の札）への実機の感想：「ロビーの質が最も気になる」「何気なく押すと別の画面へ飛ぶ」「文字が小さい、スマホは読めない」
     v9 の考え方：
     ・選ぶ → 確かめる → 始める。人物や札を押しても始まらない。始めるのは右の金のボタンだけ
     ・選んだ1人を大きく（頭から膝まで）。後ろに名前の大きな欧文、上からの光と縁の光。待つ間はごく小さく呼吸する
     ・右に「この卓のこと」：何話か・名前・ひとこと・覚えること・リコ先輩の助言・賞金・金のボタン
     ・右下の5枚の札がロイヤルフラッシュ（10♥ J♥ Q♥ K♥ A♥）。勝つと表に返る＝進み具合そのもの。札を押すとその人を選ぶ
     ・左下に施設（交換所・コレクション・ぱにゅぱにゅ）。数字の赤い大きなバッジはやめ、新着は金の点だけ
     ・リコ先輩を選ぶと、今日の衣装で大きく出る。「衣装を見る」もここから
     ?state=early（始めたばかり）／mid（既定：4人目が次）／clear（全員に勝った後）、?sel=rico_tutorial などで選ぶ人を変えられる -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@600;700;800&display=swap">
<style>
  /* ===== 文字の大きさの基準（本体の style.css にも同じ名前で入れる） =====
     舞台（1280×800）の px で書き、スマホで舞台ごと縮む時は、画面上で下限（2つめの数）を割らないよう大きくする。
       caption 14 / 下限11 … 単位・欧文の飾りラベル・補足
       label   16 / 下限13 … ボタンの小見出し・タブ・札の名前
       body    20 / 下限14 … 説明・助言・本文
       lead    24 / 下限16 … 会話・主ボタン・項目名
       title   30 / 下限20 … 画面や人物の見出し
       num     32 / 下限18 … コイン・賞金などの数字
       tap     押せる所の高さ 下限44（指で押せる大きさ） */
  :root {
    --k: 1;
    --fs-caption: max(14px, calc(11px / var(--k)));
    --fs-label: max(16px, calc(13px / var(--k)));
    --fs-body: max(20px, calc(14px / var(--k)));
    --fs-lead: max(24px, calc(16px / var(--k)));
    --fs-title: max(30px, calc(20px / var(--k)));
    --fs-num: max(32px, calc(18px / var(--k)));
    --fs-hero: max(52px, calc(26px / var(--k)));
    --tap: max(48px, calc(44px / var(--k)));

    --ink: #0b0809;
    --ink-2: #140e10;
    --glass: rgba(14, 10, 12, .72);
    --line: rgba(243, 236, 224, .14);
    --line-2: rgba(243, 236, 224, .26);
    --ivory: #f3ece0;
    --muted: #b3a89b;
    --dim: #7c7268;
    --gold: #d8b56c;
    --gold-hi: #f0d595;
    --gold-ink: #1a1206;
    --rose: #e8a3b2;
    --heart: #d1283f;
    --num: "Barlow Condensed", "Noto Sans JP", sans-serif;
    --sans: "Noto Sans JP", "Hiragino Sans", sans-serif;
    --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; }
  body { font-family: var(--sans); color: var(--ivory); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .stage { position: fixed; left: 50%; top: 50%; width: 1280px; height: 800px; overflow: hidden; background: var(--ink); isolation: isolate;
    transform: translate(-50%, -50%) scale(var(--k)); transform-origin: center; }
  :focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
  .jp { word-break: auto-phrase; line-break: strict; text-wrap: pretty; }

  /* ===== 部屋：大時計のホール。ぼかして沈め、選んだ人の後ろだけ温かい光 ===== */
  .bg { position: absolute; inset: -24px; background: url('../../assets/backgrounds/bg_lobby_clock.jpg') 38% 30% / cover no-repeat;
    filter: blur(3px) brightness(.46) saturate(.85); }
  .bg-light { position: absolute; inset: 0; pointer-events: none; background:
      radial-gradient(34% 52% at 30% 34%, rgba(255, 206, 140, .22), rgba(255, 206, 140, 0) 70%),
      linear-gradient(90deg, rgba(11, 8, 9, 0) 0%, rgba(11, 8, 9, 0) 52%, rgba(11, 8, 9, .62) 64%, rgba(11, 8, 9, .86) 100%),
      linear-gradient(0deg, rgba(11, 8, 9, .82) 0%, rgba(11, 8, 9, 0) 26%),
      linear-gradient(180deg, rgba(11, 8, 9, .55) 0%, rgba(11, 8, 9, 0) 14%); }
  .dust { position: absolute; inset: 0; pointer-events: none; }
  .dust i { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, rgba(255, 228, 170, .9), rgba(255, 228, 170, 0) 70%); animation: dust var(--d) linear var(--dl) infinite; }
  @keyframes dust { 0% { opacity: 0; transform: translate(0, 0); } 18% { opacity: .65; } 82% { opacity: .5; } 100% { opacity: 0; transform: translate(var(--dx), -120px); } }

  /* ===== 選んだ1人：頭から膝まで大きく。後ろに欧文の名前、上から光、縁に光 ===== */
  .hero { position: absolute; left: 0; top: 0; width: 780px; height: 800px; pointer-events: none; }
  .hero-word { position: absolute; left: 34px; top: 452px; font-family: var(--num); font-weight: 700; font-size: 248px; line-height: .8; letter-spacing: .02em;
    color: transparent; -webkit-text-stroke: 1.5px rgba(216, 181, 108, .24); white-space: nowrap; transition: opacity .5s ease, transform .7s var(--ease); }
  .hero-beam { position: absolute; left: 70px; top: -60px; width: 560px; height: 900px; opacity: .9;
    background: radial-gradient(50% 40% at 50% 20%, rgba(255, 222, 170, .18), rgba(255, 222, 170, 0) 70%); }
  /* 呼吸は外側の箱、入れ替えの動き（前の人が左へ消え、次の人が右から来る）は絵そのもの。2枚を重ねて、次の絵の読み込みが済んでから入れ替える */
  .hero-breath { position: absolute; inset: 0; transform-origin: 30% 92%; animation: breath 4.6s ease-in-out infinite alternate; }
  .hero-fig { position: absolute; left: 96px; top: 34px; height: 960px; width: auto; opacity: 0; transform: translateX(28px);
    filter: drop-shadow(0 0 1px rgba(255, 224, 180, .5)) drop-shadow(-10px 0 26px rgba(255, 196, 130, .16)) drop-shadow(0 30px 40px rgba(0, 0, 0, .55));
    transition: opacity .55s ease, transform .8s var(--ease); }
  .hero-fig.is-front { opacity: 1; transform: none; }
  .hero-fig.is-leaving { opacity: 0; transform: translateX(-22px); transition-duration: .35s, .5s; }
  .hero-fig.is-locked { filter: brightness(0) drop-shadow(0 0 2px rgba(190, 150, 255, .55)) drop-shadow(0 0 30px rgba(120, 80, 200, .35)); }
  .hero-fig.is-locked.is-front { opacity: .82; }
  @keyframes breath { from { transform: translateY(0) scale(1); } to { transform: translateY(-3px) scale(1.007); } }

  /* ===== 上の帯：タイトルへ／コイン・設定 ===== */
  .top { position: absolute; left: 0; right: 0; top: 0; height: 88px; padding: 20px 32px 0; display: flex; align-items: flex-start; gap: 14px; }
  .top .back { display: inline-flex; align-items: center; gap: .45em; height: var(--tap); padding: 0 1.1em 0 .8em; border-radius: 999px;
    font-size: var(--fs-label); font-weight: 500; letter-spacing: .08em; color: rgba(243, 236, 224, .86); border: 1px solid var(--line-2); background: rgba(11, 8, 9, .45); }
  .top .back svg { width: 1.1em; height: 1.1em; }
  .top .spacer { flex: 1; }
  .coins { display: inline-flex; align-items: center; gap: .5em; height: var(--tap); padding: 0 1.1em 0 .55em; border-radius: 999px; background: rgba(11, 8, 9, .55); border: 1px solid var(--line); }
  .coins img { width: calc(var(--tap) * .62); height: calc(var(--tap) * .62); object-fit: contain; }
  .coins b { font-family: var(--num); font-weight: 600; font-size: var(--fs-num); letter-spacing: .02em; color: var(--gold-hi); line-height: 1; }
  .coins small { font-size: var(--fs-caption); color: var(--muted); letter-spacing: .1em; }
  .icon-btn { width: var(--tap); height: var(--tap); border-radius: 50%; display: inline-grid; place-items: center; border: 1px solid var(--line); background: rgba(11, 8, 9, .55); color: rgba(243, 236, 224, .85); }
  .icon-btn svg { width: 46%; height: 46%; }
  svg { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* ===== 右：この卓のこと ===== */
  .panel { position: absolute; left: 784px; top: 96px; width: 464px; display: grid; gap: 11px; }
  .eyebrow { display: flex; align-items: center; gap: .7em; min-height: var(--tap); font-size: var(--fs-label); letter-spacing: .2em; color: var(--gold); font-weight: 500; }
  .eyebrow .ep { white-space: nowrap; }
  .chip-state { font-size: var(--fs-caption); letter-spacing: .14em; padding: .25em .7em; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap; }
  .chip-state.is-next { color: var(--gold-ink); background: var(--gold); border-color: var(--gold); font-weight: 700; }
  .chip-state.is-won { color: var(--muted); }
  .chip-state.is-locked { color: #b9a6e6; }
  .name { font-family: var(--mincho); font-weight: 800; font-size: var(--fs-hero); line-height: 1.12; letter-spacing: .04em; color: #fbf5ea; text-shadow: 0 2px 20px rgba(0, 0, 0, .5); }
  .epithet { margin-top: -6px; font-size: var(--fs-body); color: var(--muted); letter-spacing: .04em; }
  .rule { height: 1px; background: linear-gradient(90deg, rgba(216, 181, 108, .7), rgba(216, 181, 108, 0)); margin: 4px 0 2px; }
  .learn { display: grid; gap: 2px; }
  .learn small { font-size: var(--fs-caption); color: var(--dim); letter-spacing: .14em; }
  .learn b { font-size: var(--fs-lead); font-weight: 700; letter-spacing: .02em; line-height: 1.4; }
  .tip { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; padding: 12px 16px; border-radius: 6px; background: rgba(255, 255, 255, .035); border: 1px solid var(--line); }
  .tip img { width: calc(var(--fs-body) * 2.5); height: calc(var(--fs-body) * 2.5); border-radius: 50%; object-fit: cover; object-position: 50% 25%; border: 1px solid rgba(216, 181, 108, .6); background: var(--ink-2); }
  .tip p { font-size: var(--fs-body); line-height: 1.6; color: var(--ivory); }
  .tip p small { display: block; font-size: var(--fs-caption); color: var(--gold); letter-spacing: .12em; margin-bottom: 2px; }
  .tip p em { font-style: normal; color: var(--gold-hi); }
  .prize { display: flex; align-items: baseline; gap: .45em; flex-wrap: wrap; }
  .prize small { font-size: var(--fs-label); color: var(--muted); letter-spacing: .1em; }
  .prize b { font-family: var(--num); font-weight: 600; font-size: var(--fs-num); color: var(--gold-hi); letter-spacing: .02em; line-height: 1; }
  .prize span { font-size: var(--fs-label); color: var(--ivory); }
  .cta { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: .6em; width: 100%;
    height: max(68px, calc(48px / var(--k))); border-radius: 6px; font-size: var(--fs-lead); font-weight: 900; letter-spacing: .14em; color: var(--gold-ink);
    background: linear-gradient(180deg, #f6dc9c 0%, #dcb766 52%, #c99d4b 100%); box-shadow: 0 10px 30px rgba(216, 168, 80, .28), inset 0 1px 0 rgba(255, 255, 255, .55); transition: transform .15s ease, filter .2s ease; }
  .cta svg { width: 1em; height: 1em; stroke-width: 2.4; }
  .cta::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, .55) 50%, rgba(255, 255, 255, 0) 70%); transform: translateX(-120%); }
  .cta.is-shine::after { animation: ctaShine 1.1s var(--ease) .25s 1; }
  @keyframes ctaShine { to { transform: translateX(120%); } }
  .cta:hover { filter: brightness(1.05); }
  .cta:active { transform: translateY(1px) scale(.995); }
  .cta[disabled] { cursor: default; color: rgba(243, 236, 224, .62); background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 1px var(--line-2); font-weight: 700; letter-spacing: .06em; font-size: var(--fs-body); }
  .cta[disabled]::after { display: none; }
  .sub-row { display: flex; gap: 10px; align-items: center; }
  .ghost { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: var(--tap); padding: 0 1.1em; border-radius: 6px;
    font-size: var(--fs-label); font-weight: 500; letter-spacing: .08em; color: rgba(243, 236, 224, .9); border: 1px solid var(--line-2); background: rgba(11, 8, 9, .4); }
  .ghost svg { width: 1.15em; height: 1.15em; }
  .ghost:hover { border-color: rgba(216, 181, 108, .7); }
  .prof { margin-left: auto; display: inline-flex; gap: 8px; flex: none; }
  .prof .ghost { white-space: nowrap; }
  .name-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .ghost.sm { min-height: var(--tap); padding: 0 .85em; letter-spacing: .04em; font-size: var(--fs-caption); }
  .prize-row { display: flex; align-items: center; gap: 12px; }
  .prize-row #pSkip { margin-left: auto; }
  .skip2 { display: none; justify-content: center; margin-top: -6px; }
  .skip2 .link { margin: 0; }
  .link { min-height: var(--tap); padding: 0 .4em; font-size: var(--fs-caption); color: var(--muted); letter-spacing: .06em; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(179, 168, 155, .45); }
  .panel > * { transition: opacity .35s ease, transform .45s var(--ease); }
  .panel.is-swap > * { opacity: 0; transform: translateY(8px); }

  /* ===== 右下：ロイヤルフラッシュの5枚＝相手を選ぶ札 ===== */
  .hand { position: absolute; left: 784px; bottom: 24px; width: 464px; }
  .hand-head { display: flex; align-items: baseline; gap: .7em; margin-bottom: 12px; }
  .hand-head small { font-family: var(--num); font-size: var(--fs-caption); letter-spacing: .26em; color: var(--gold); font-weight: 600; }
  .hand-head span { font-size: var(--fs-label); color: var(--ivory); letter-spacing: .06em; }
  .cards { display: flex; gap: 11px; }
  .card { position: relative; width: 84px; height: 118px; border-radius: 7px; overflow: hidden; flex: none; background: #f5efe4;
    box-shadow: 0 8px 18px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(26, 18, 6, .25); transition: transform .3s var(--ease), box-shadow .3s ease; }
  .card img.face { position: absolute; inset: 9px 7px 7px; width: calc(100% - 14px); height: calc(100% - 16px); object-fit: cover; object-position: 50% 22%; border-radius: 3px; }
  .card .idx { position: absolute; left: 5px; top: 3px; z-index: 2; display: grid; justify-items: center; line-height: .9; font-family: var(--num); font-weight: 700; font-size: 18px; color: var(--heart);
    text-shadow: 0 0 3px #fff, 0 0 6px #fff; }
  .card .idx i { font-style: normal; font-size: 14px; }
  .card .seal { position: absolute; right: 4px; bottom: 4px; z-index: 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--mincho); font-weight: 800; font-size: 14px; color: #fff; background: radial-gradient(circle at 35% 30%, #e24a5c, #9e1427); box-shadow: 0 2px 6px rgba(0, 0, 0, .45); }
  .card.is-locked { background: #1b1418; }
  .card.is-locked img.back { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card.is-locked .lock { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; display: grid; place-items: center; background: rgba(11, 8, 9, .72); color: #e7dcff; }
  .card.is-locked .lock svg { width: 16px; height: 16px; }
  .card.is-next { box-shadow: 0 0 0 2px var(--gold), 0 0 22px rgba(240, 213, 149, .45), 0 8px 18px rgba(0, 0, 0, .5); }
  .card.is-sel { transform: translateY(-12px); }
  .card.is-sel::after { content: ""; position: absolute; inset: 0; border-radius: 7px; box-shadow: inset 0 0 0 3px var(--gold-hi); pointer-events: none; }
  .card:hover:not(.is-sel) { transform: translateY(-5px); }
  .cards-caption { margin-top: 10px; font-size: var(--fs-caption); color: var(--dim); letter-spacing: .06em; }

  /* ===== 左下：施設 ===== */
  .dock { position: absolute; left: 32px; bottom: 26px; display: flex; gap: 10px; }
  .fac { position: relative; display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 12px; align-items: center; text-align: left;
    min-height: max(60px, calc(44px / var(--k))); padding: 8px 18px 8px 14px; border-radius: 8px; background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .fac svg { grid-row: 1 / 3; width: calc(var(--fs-label) * 1.7); height: calc(var(--fs-label) * 1.7); color: var(--gold); stroke-width: 1.5; }
  .fac b { font-size: var(--fs-label); font-weight: 700; letter-spacing: .08em; line-height: 1.25; }
  .fac small { font-size: var(--fs-caption); color: var(--muted); letter-spacing: .04em; line-height: 1.25; }
  .fac .dot { position: absolute; right: 9px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold-hi); box-shadow: 0 0 8px rgba(240, 213, 149, .9); }
  .fac:hover { border-color: rgba(216, 181, 108, .55); }

  /* ===== スマホ横持ち（舞台が 0.6 倍より小さい時）：文字が大きくなる分、置き方を変える ===== */
  html.compact .hero-fig { left: 40px; top: 60px; height: 900px; }
  html.compact .hero-word { font-size: 200px; top: 500px; }
  html.compact .panel { left: 700px; top: 104px; width: 548px; gap: 12px; }
  html.compact .epithet, html.compact .tip, html.compact .cards-caption { display: none; }
  html.compact .hand { left: 32px; bottom: 22px; width: 640px; }
  html.compact .card { width: 104px; height: 146px; }
  html.compact .card .idx { font-size: 26px; }
  html.compact .card .idx i { font-size: 20px; }
  html.compact .card .seal { width: 36px; height: 36px; font-size: 19px; }
  html.compact .dock { left: auto; right: calc(32px + var(--tap) + 10px); bottom: auto; top: 20px; gap: 8px; }
  html.compact .fac { grid-template-columns: auto; padding: 0; width: var(--tap); height: var(--tap); min-height: 0; border-radius: 50%; place-items: center; }
  html.compact .fac b, html.compact .fac small { display: none; }
  html.compact .fac svg { width: 48%; height: 48%; grid-row: auto; }
  html.compact .top .coins { margin-right: calc(var(--tap) * 3 + 26px); }
  html.compact .ghost.sm { width: var(--tap); padding: 0; font-size: 0; gap: 0; }
  html.compact .ghost.sm svg { width: calc(var(--tap) * .42); height: calc(var(--tap) * .42); }
  html.compact .prize-row #pSkip { display: none; }
  html.compact #pSkip2 { display: flex; }

  @media (prefers-reduced-motion: reduce) {
    .hero-fig, .dust i, .cta.is-shine::after { animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg" aria-hidden="true"></div>
  <div class="bg-light" aria-hidden="true"></div>
  <div class="dust" aria-hidden="true">
    <i style="--x:220px;--y:560px;--s:6px;--d:10s;--dl:0s;--dx:16px"></i>
    <i style="--x:380px;--y:620px;--s:4px;--d:12s;--dl:2.4s;--dx:-12px"></i>
    <i style="--x:520px;--y:520px;--s:5px;--d:11s;--dl:5s;--dx:20px"></i>
    <i style="--x:640px;--y:600px;--s:3px;--d:13s;--dl:1.2s;--dx:-8px"></i>
    <i style="--x:140px;--y:420px;--s:4px;--d:12.5s;--dl:7s;--dx:10px"></i>
    <i style="--x:460px;--y:360px;--s:3px;--d:14s;--dl:3.6s;--dx:-14px"></i>
  </div>

  <section class="hero" id="hero" aria-hidden="true">
    <div class="hero-beam"></div>
    <div class="hero-breath"><img class="hero-fig" id="figA" alt=""><img class="hero-fig" id="figB" alt=""></div>
  </section>

  <header class="top">
    <button class="back" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>タイトル</button>
    <span class="spacer"></span>
    <div class="coins" title="コイン"><img src="../../assets/ui/chip_gold.webp" alt=""><b id="coins">850</b><small>COINS</small></div>
    <button class="icon-btn" type="button" aria-label="音量と設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h0a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
  </header>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="eyebrow"><span class="ep" id="pEp">第4話 · K♥ の卓</span><span id="pProf"></span></div>
    <div class="name-row"><h1 class="name jp" id="pName">グラーノ</h1><span class="chip-state is-next" id="pState">次の卓</span></div>
    <p class="epithet jp" id="pEpithet">値付けの商人</p>
    <div class="rule"></div>
    <div class="learn"><small>この卓で覚えること</small><b class="jp" id="pLearn">ポットオッズ・割に合う判断</b></div>
    <div class="tip"><img src="../../assets/ui/face_rico_bunny.webp" alt=""><p class="jp"><small>リコ先輩のひとこと</small><span id="pTip">「グラーノは何でも値段で誘ってくる。払う価値は自分で計算しな」</span></p></div>
    <div class="prize-row"><div class="prize" id="pPrize"><small>賞金</small><b>900</b><span>＋ ご褒美CG</span></div><span id="pSkip"></span></div>
    <button class="cta is-shine" id="pCta" type="button">この卓につく<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <div id="pSkip2" class="skip2"></div>
  </aside>

  <nav class="hand" aria-label="相手を選ぶ">
    <div class="hand-head"><small>ROYAL FLUSH</small><span id="handLeft">あと1枚で完成</span></div>
    <div class="cards" id="cards"></div>
  </nav>

  <nav class="dock" aria-label="施設">
    <button class="fac" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><b>交換所</b><small>新しい品あり</small><i class="dot"></i></button>
    <button class="fac" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 15.5l5-5 4 4 3-3 5 5"/><circle cx="15.5" cy="9" r="1.4"/></svg><b>コレクション</b><small>ご褒美CG 3/5</small></button>
    <button class="fac" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><b>ぱにゅぱにゅ</b><small>今日あと5回</small></button>
  </nav>
</div>

<script>
// ---- 見本のデータ（本体では OPPONENTS・LOBBY_PRESENT・save から作る） ----
const SEATS = [
  { id: 'rico_tutorial', rank: '10', ep: '第1話', name: 'リコ先輩', latin: 'RICO', img: 'rico_dress', face: 'face_rico_dress', epithet: '先輩バニー・教育係', learn: 'ポーカーの基礎（講義・全35問）',
    tip: '「まずはアタシが基礎から叩き込む。安心してかかってきな」', prize: 300, rematch: 50 },
  { id: 'polka', rank: 'J', ep: '第2話', name: 'ポルカ', latin: 'POLKA', img: 'polka_default', face: 'face_polka', epithet: '声の大きい常連', learn: 'ブラフ入門',
    tip: '「声がでかい時ほど、手は弱い。耳を澄ませな」', prize: 500, rematch: 200 },
  { id: 'selina', rank: 'Q', ep: '第3話', name: 'セリナ', latin: 'SELINA', img: 'selina_default', face: 'face_selina', epithet: '理詰めの常連', learn: '場札の危なさ・賭ける額の意味',
    tip: '「セリナは理詰めの女。ベット額の“意味”を読みな」', prize: 700, rematch: 300 },
  { id: 'grano', rank: 'K', ep: '第4話', name: 'グラーノ', latin: 'GRANO', img: 'grano_default', face: 'face_grano', epithet: '値付けの商人', learn: 'ポットオッズ・割に合う判断',
    tip: '「グラーノは何でも値段で誘ってくる。払う価値は自分で計算しな」', prize: 900, rematch: 400, skip: 1800 },
  { id: 'velvet', rank: 'A', ep: '第5話', name: 'ヴェルベット', latin: 'VELVET', img: 'velvet_default', face: 'face_velvet', epithet: 'VIPルームの悪徳ディーラー', learn: '読みの総まとめ',
    tip: '「ヴェルベットは言葉と圧で心を折りに来る。あんたはもう全部の武器を持ってる」', prize: 1500, rematch: 700, skip: 4500, vip: true },
];
const q = new URLSearchParams(location.search);
const STATE = q.get('state') || 'mid';
const cleared = STATE === 'early' ? [] : STATE === 'clear' ? SEATS.map(s => s.id) : ['rico_tutorial', 'polka', 'selina'];
const unlocked = (i) => i === 0 || cleared.includes(SEATS[i - 1].id);
const nextIdx = SEATS.findIndex((s, i) => unlocked(i) && !cleared.includes(s.id));
let sel = Math.max(0, SEATS.findIndex(s => s.id === q.get('sel')));
if (!q.get('sel')) sel = nextIdx >= 0 ? nextIdx : 0;
document.getElementById('coins').textContent = (STATE === 'early' ? 0 : STATE === 'clear' ? 6240 : 850).toLocaleString();

const $ = (id) => document.getElementById(id);
const LOCK = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
const PROFILE = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>';
const DRESS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3l3 3 3-3M9 3L6 8l3 2-2 11h10L15 10l3-2-3-5"/></svg>';

function renderCards() {
  $('cards').innerHTML = SEATS.map((s, i) => {
    const won = cleared.includes(s.id), unl = unlocked(i);
    const cls = ['card', won ? 'is-won' : '', !unl ? 'is-locked' : '', i === nextIdx ? 'is-next' : '', i === sel ? 'is-sel' : ''].filter(Boolean).join(' ');
    const body = unl
      ? `<img class="face" src="../../assets/ui/${s.face}.webp" alt="">${won ? '<span class="seal">勝</span>' : ''}`
      : `<img class="back" src="../../assets/ui/card_back_default.webp" alt=""><span class="lock">${LOCK}</span>`;
    return `<button class="${cls}" type="button" data-i="${i}" aria-pressed="${i === sel}" aria-label="${s.rank}♥ ${unl ? s.name : '伏せ札'}${won ? '（勝利済み）' : ''}"><span class="idx">${s.rank}<i>♥</i></span>${body}</button>`;
  }).join('');
  const own = cleared.length;
  $('handLeft').textContent = own >= SEATS.length ? '完成！ 全員に勝った' : `あと${SEATS.length - own}枚で完成`;
}

function renderPanel() {
  const s = SEATS[sel], i = sel, won = cleared.includes(s.id), unl = unlocked(i), isNext = i === nextIdx;
  $('pEp').textContent = `${s.ep} · ${s.rank}♥ の卓${s.vip ? ' · VIP' : ''}`;
  const st = $('pState');
  st.className = 'chip-state ' + (isNext ? 'is-next' : won ? 'is-won' : !unl ? 'is-locked' : '');
  st.textContent = isNext ? '次の卓' : won ? '勝利済み' : !unl ? '伏せ札' : '';
  st.hidden = !st.textContent;
  $('pName').textContent = unl ? s.name : '？？？';
  $('pEpithet').textContent = unl ? s.epithet : (s.vip ? 'VIPルームの主' : 'まだ会っていない相手');
  $('pLearn').textContent = s.learn;
  const prev = SEATS[i - 1];
  $('pTip').innerHTML = unl ? s.tip : `「${prev ? prev.name : ''}に勝ったら、紹介してあげる」`;
  $('pPrize').innerHTML = won
    ? `<small>再戦の報酬</small><b>+${s.rematch.toLocaleString()}</b><span>コイン</span>`
    : `<small>賞金</small><b>${s.prize.toLocaleString()}</b><span>＋ ${s.vip && !unl ? '秘密の' : 'ご褒美'}CG</span>`;
  const cta = $('pCta');
  cta.disabled = !unl;
  cta.classList.remove('is-shine'); void cta.offsetWidth;
  if (!unl) cta.innerHTML = `${LOCK}${prev.name}に勝つと開きます`;
  else if (s.id === 'rico_tutorial') cta.innerHTML = `${won ? 'リコ先輩と対戦・講義' : '講義を受ける'}${ARROW}`;
  else cta.innerHTML = `${won ? '再戦する' : 'この卓につく'}${ARROW}`;
  if (unl) cta.classList.add('is-shine');
  // プロフィール（リコ先輩は「衣装を見る」も）は見出しの行の右端に小さく。スキップは賞金の行の右に、文字のリンクで
  $('pProf').outerHTML = `<span id="pProf" class="prof">${unl ? `${s.id === 'rico_tutorial' ? `<button class="ghost sm" type="button">${DRESS}衣装</button>` : ''}<button class="ghost sm" type="button">${PROFILE}プロフィール</button>` : ''}</span>`;
  const skip = isNext && s.skip ? `<button class="link" type="button">コインで勝ったことにする（${s.skip.toLocaleString()}）</button>` : '';
  $('pSkip').outerHTML = `<span id="pSkip">${skip}</span>`;
  $('pSkip2').innerHTML = skip;
}

let heroFront = null, heroToken = 0;
async function renderHero() {
  const s = SEATS[sel], unl = unlocked(sel), token = ++heroToken;
  const a = $('figA'), b = $('figB');
  const next = heroFront === a ? b : a, cur = heroFront;
  next.classList.remove('is-front', 'is-leaving');
  next.classList.toggle('is-locked', !unl);
  next.src = `../../assets/characters/${s.img}.webp`;
  try { await next.decode(); } catch (e) {}
  if (token !== heroToken) return;            // 速く押し替えた時は、最後に選んだ人だけを出す
  void next.offsetWidth;
  next.classList.add('is-front');
  if (cur && cur !== next) { cur.classList.remove('is-front'); cur.classList.add('is-leaving'); }
  heroFront = next;
}
// 5人の絵は最初にまとめて読み込んでおく（選び替えた瞬間に出せるように）
const PRE = SEATS.map(s => { const im = new Image(); im.src = `../../assets/characters/${s.img}.webp`; im.decode().catch(() => {}); return im; });

function select(i, animate = true) {
  if (i === sel && animate) return;
  sel = i;
  const panel = $('panel');
  if (animate) { panel.classList.add('is-swap'); setTimeout(() => { renderPanel(); panel.classList.remove('is-swap'); }, 220); }
  else renderPanel();
  renderHero();
  renderCards();
}
$('cards').addEventListener('click', (e) => { const b = e.target.closest('.card'); if (b) select(+b.dataset.i); });
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') select(Math.min(SEATS.length - 1, sel + 1));
  if (e.key === 'ArrowLeft') select(Math.max(0, sel - 1));
});
// 舞台を窓に合わせる（本体の fitStage と同じ計算）。0.6 倍より小さければスマホの置き方
function fit() {
  const k = Math.min(innerWidth / 1280, innerHeight / 800);
  document.documentElement.style.setProperty('--k', k);
  document.documentElement.classList.toggle('compact', k < 0.6);
}
addEventListener('resize', fit); fit();
select(sel, false);
</script>
</body>
</html>
