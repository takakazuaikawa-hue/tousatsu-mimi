<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ホーム v12 見本</title>
<!-- ホームの見本 v12（2026-10-15）。v11「シンプルすぎて安く見えた」を受けて、豊かさと格を足す。
     ・部品を館（時計台のカジノ劇場）の物で作る：真鍮の歯車の飾り枠、劇場の電球付き看板、金の飾り彫りの札、ガラスの板
     ・層を重ねる：絵 → 金の飾り罫とガラスの UI → 手前の光の粒と舞う札
     ・要素は増やし、強弱で整理：一番大事な「今夜の卓へ」だけが大きく金色で光が走る
     ・動き：歯車が回る、看板の電球がまたたく、主役が呼吸する、主役のボタンにだけ光が走る
     絵は仮（ChatGPT の清書 g3a）。舞台は 1280×800 を高さで合わせ、横は画面幅まで伸ばす（左右の部品は端に付く）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..700&family=Shippori+Mincho+B1:wght@500;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<style>
  :root {
    --k: 1; --sw: 1280px;
    --ink: #0a0608; --ivory: #f6efe2; --muted: #cdbfa9;
    --gold: #cfa862; --gold-hi: #f4dca2; --gold-deep: #7d5a22; --brass: #b8893c;
    --red: #b3122c; --red-deep: #5e0716;
    --serif-jp: "Shippori Mincho B1", "Yu Mincho", serif; --serif: "Bodoni Moda", serif; --sans: "Noto Sans JP", sans-serif;
    --ease: cubic-bezier(.2, .7, .2, 1);
    --metal: linear-gradient(180deg, #fbe7b0 0%, #d6a956 22%, #8c6324 50%, #c99a48 74%, #f6dc9c 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #060304; overflow: hidden; }
  body { font-family: var(--sans); color: var(--ivory); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  svg { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  .stage { position: fixed; left: 0; top: 0; width: var(--sw); height: 800px; transform: scale(var(--k)); transform-origin: 0 0; overflow: hidden; }

  /* ===== 絵 ===== */
  .art { position: absolute; inset: 0; background: url('img/home1_g3a.png') 50% 30% / cover no-repeat; animation: artIn 1.4s var(--ease) both; }
  @keyframes artIn { from { opacity: 0; transform: scale(1.04); } }
  .breath { position: absolute; inset: 0; animation: breath 5.5s ease-in-out infinite alternate; transform-origin: 50% 70%; }
  @keyframes breath { to { transform: scale(1.006) translateY(-2px); } }
  .grade { position: absolute; inset: 0; pointer-events: none; background:
      linear-gradient(90deg, rgba(6,3,4,.86) 0, rgba(6,3,4,.42) 300px, rgba(6,3,4,0) 470px, rgba(6,3,4,0) calc(100% - 470px), rgba(6,3,4,.46) calc(100% - 300px), rgba(6,3,4,.88) 100%),
      linear-gradient(180deg, rgba(6,3,4,.7) 0, rgba(6,3,4,0) 120px),
      linear-gradient(0deg, rgba(6,3,4,.82) 0, rgba(6,3,4,0) 210px); }
  /* 大時計の後光（ゆっくり回る歯車の光） */
  .gearglow { position: absolute; left: 50%; top: 210px; width: 560px; height: 560px; margin: -280px 0 0 -280px; pointer-events: none; mix-blend-mode: screen; opacity: .55;
    background: conic-gradient(from 0deg, rgba(255,214,140,0) 0 8%, rgba(255,214,140,.16) 9% 11%, rgba(255,214,140,0) 12% 33%, rgba(255,214,140,.14) 34% 36%, rgba(255,214,140,0) 37% 58%, rgba(255,214,140,.16) 59% 61%, rgba(255,214,140,0) 62% 83%, rgba(255,214,140,.12) 84% 86%, rgba(255,214,140,0) 87%);
    -webkit-mask: radial-gradient(circle, transparent 30%, #000 44%, #000 60%, transparent 71%); mask: radial-gradient(circle, transparent 30%, #000 44%, #000 60%, transparent 71%);
    animation: spin 90s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 手前の光の粒 */
  .bokeh { position: absolute; border-radius: 50%; pointer-events: none; mix-blend-mode: screen; filter: blur(2px);
    background: radial-gradient(circle, rgba(255,222,160,.6), rgba(255,222,160,0) 68%); animation: drift var(--d) ease-in-out var(--dl) infinite alternate; }
  @keyframes drift { from { transform: translate(0,0); opacity: .25; } to { transform: translate(var(--dx), var(--dy)); opacity: .7; } }

  /* ===== 共通：金の飾り罫・真鍮の板・ガラス ===== */
  .rule { height: 1px; background: linear-gradient(90deg, rgba(244,220,162,0), var(--gold) 20%, var(--gold-hi) 50%, var(--gold) 80%, rgba(244,220,162,0)); }
  .glass { background: linear-gradient(160deg, rgba(40,18,22,.62), rgba(14,6,8,.78)); backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2);
    box-shadow: inset 0 1px 0 rgba(255,236,190,.22), inset 0 0 0 1px rgba(207,168,98,.42), 0 18px 40px rgba(0,0,0,.5); }
  .corner { position: absolute; width: 14px; height: 14px; border-color: var(--gold-hi); border-style: solid; opacity: .9; }
  .corner.tl { left: 5px; top: 5px; border-width: 1.5px 0 0 1.5px; } .corner.tr { right: 5px; top: 5px; border-width: 1.5px 1.5px 0 0; }
  .corner.bl { left: 5px; bottom: 5px; border-width: 0 0 1.5px 1.5px; } .corner.br { right: 5px; bottom: 5px; border-width: 0 1.5px 1.5px 0; }

  /* ===== 上の帯：名札・お知らせ・コイン ===== */
  .topbar { position: absolute; left: 0; right: 0; top: 0; height: 74px; display: flex; align-items: center; padding: 0 28px; gap: 18px; }
  .nameplate { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 22px 0 6px; position: relative;
    clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%); }
  .nameplate .rank { width: 42px; height: 42px; display: grid; place-items: center; position: relative; }
  .nameplate .rank svg { position: absolute; inset: 0; width: 42px; height: 42px; color: var(--gold); stroke-width: 1.2; animation: spin 40s linear infinite; }
  .nameplate .rank b { font-family: var(--serif); font-size: 17px; color: var(--gold-hi); }
  .nameplate .who { display: grid; line-height: 1.2; }
  .nameplate .who small { font-family: var(--serif); font-size: 11px; letter-spacing: .32em; color: var(--gold); }
  .nameplate .who b { font-family: var(--serif-jp); font-size: 18px; letter-spacing: .12em; }
  .topbar .spacer { flex: 1; }
  .purse { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 8px 0 10px; border-radius: 23px; }
  .purse img { width: 34px; height: 34px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.6)); }
  .purse b { font-family: var(--serif); font-size: 26px; font-weight: 600; color: var(--gold-hi); letter-spacing: .03em; min-width: 72px; }
  .purse .plus { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--metal); color: #3a2408; font-weight: 900; font-size: 18px; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .iconbtn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; position: relative; color: var(--gold-hi); }
  .iconbtn svg { width: 22px; height: 22px; }
  .iconbtn .dot { position: absolute; right: 9px; top: 9px; width: 9px; height: 9px; border-radius: 50%; background: #e02a45; box-shadow: 0 0 0 2px #1a080b, 0 0 8px rgba(224,42,69,.8); }

  /* ===== 左：行き先（真鍮の札。電球の看板の縁） ===== */
  .places { position: absolute; left: 28px; top: 104px; display: grid; gap: 12px; }
  .place { position: relative; width: 252px; height: 70px; display: grid; grid-template-columns: 64px 1fr; align-items: center; padding: 0 14px 0 8px; text-align: left;
    animation: placeIn .7s var(--ease) both; animation-delay: calc(.25s + var(--i) * .07s); transition: transform .25s var(--ease); }
  @keyframes placeIn { from { opacity: 0; transform: translateX(-24px); } }
  .place::before { content: ""; position: absolute; inset: 0; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%);
    background: linear-gradient(160deg, rgba(48,20,24,.7), rgba(14,6,8,.86)); box-shadow: inset 0 0 0 1px rgba(207,168,98,.5); }
  .place::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--metal); }
  .place .medal { position: relative; width: 52px; height: 52px; display: grid; place-items: center; color: #3a2408; }
  .place .medal::before { content: ""; position: absolute; inset: 0; background: var(--metal); clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  .place .medal::after { content: ""; position: absolute; inset: 4px; background: linear-gradient(160deg, #2a1012, #120507); clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); }
  .place .medal svg { position: relative; z-index: 1; width: 24px; height: 24px; color: var(--gold-hi); stroke-width: 1.4; }
  .place .pt { position: relative; display: grid; gap: 2px; }
  .place .pt small { font-family: var(--serif); font-size: 10.5px; letter-spacing: .34em; color: var(--gold); }
  .place .pt b { font-family: var(--serif-jp); font-weight: 800; font-size: 21px; letter-spacing: .14em; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  .place .badge { position: absolute; right: 26px; top: 50%; transform: translateY(-50%); font-family: var(--serif); font-size: 12px; font-weight: 700; color: #fff; background: linear-gradient(180deg, #e33a52, #9c0f25);
    padding: 3px 9px; border-radius: 10px; box-shadow: 0 0 10px rgba(227,58,82,.6); }
  .place:hover { transform: translateX(6px); }
  .place:hover::before { box-shadow: inset 0 0 0 1px var(--gold-hi), 0 0 18px rgba(244,220,162,.25); }

  /* ===== 右上：今夜の見どころ（絵入りバナー） ===== */
  .banner { position: absolute; right: 28px; top: 92px; width: 360px; height: 168px; overflow: hidden; border-radius: 4px; animation: placeIn .8s var(--ease) .35s both; }
  .banner .pic { position: absolute; inset: 0; background: url('../../assets/backgrounds/table_grano.webp') 50% 35% / cover; filter: saturate(1.05) brightness(.6); }
  .banner .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,4,6,.92) 0, rgba(10,4,6,.55) 52%, rgba(10,4,6,.05) 100%); }
  .banner .who { position: absolute; right: -30px; top: -6px; height: 250px; filter: drop-shadow(-6px 0 14px rgba(0,0,0,.6)); }
  .banner .frame { position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(244,220,162,.65), inset 0 0 0 5px rgba(10,4,6,.5), inset 0 0 0 6px rgba(207,168,98,.45); }
  .banner .txt { position: absolute; left: 20px; top: 18px; display: grid; gap: 4px; }
  .banner .txt small { font-family: var(--serif); font-size: 11px; letter-spacing: .36em; color: var(--gold); }
  .banner .txt b { font-family: var(--serif-jp); font-size: 26px; font-weight: 800; letter-spacing: .08em; line-height: 1.15; }
  .banner .txt span { font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  .banner .dots { position: absolute; left: 20px; bottom: 14px; display: flex; gap: 6px; }
  .banner .dots i { width: 18px; height: 3px; background: rgba(244,220,162,.35); } .banner .dots i.on { background: var(--gold-hi); }
  .banner .bulbs { position: absolute; left: 6px; right: 6px; top: 3px; height: 4px; display: flex; justify-content: space-between; }
  .banner .bulbs i { width: 4px; height: 4px; border-radius: 50%; background: #ffe7a8; box-shadow: 0 0 6px #ffd27a; animation: bulb 1.6s ease-in-out infinite; animation-delay: calc(var(--n) * .12s); }
  @keyframes bulb { 50% { opacity: .25; box-shadow: none; } }

  /* ===== 右下：今夜の卓へ（主役のボタン） ===== */
  .go { position: absolute; right: 28px; bottom: 34px; width: 360px; height: 196px; animation: placeIn .8s var(--ease) .45s both; }
  .go .opp { position: absolute; left: 0; top: 0; width: 360px; height: 96px; display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 14px; padding-right: 14px; }
  .go .slab { width: 66px; height: 92px; margin-left: 18px; border-radius: 4px; overflow: hidden; transform: rotate(-4deg); box-shadow: inset 0 0 0 1.5px var(--gold-hi), 0 0 14px rgba(244,220,162,.35), 0 8px 20px rgba(0,0,0,.6); background: #1a0b0e; }
  .go .slab img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
  .go .opp small { font-family: var(--serif); font-size: 11px; letter-spacing: .34em; color: var(--gold); display: block; }
  .go .opp b { font-family: var(--serif-jp); font-size: 25px; font-weight: 800; letter-spacing: .12em; display: block; line-height: 1.3; }
  .go .opp span { font-size: 13px; color: var(--muted); letter-spacing: .04em; }
  .go .opp span em { font-style: normal; color: var(--gold-hi); font-family: var(--serif); font-weight: 700; }
  .cta { position: absolute; left: 0; bottom: 0; width: 360px; height: 88px; display: flex; align-items: center; justify-content: center; gap: 16px; overflow: hidden;
    background: var(--metal); color: #2a1604; clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%);
    filter: drop-shadow(0 10px 24px rgba(0,0,0,.55)); transition: transform .2s var(--ease); }
  .cta::before { content: ""; position: absolute; inset: 4px; clip-path: inherit; border: 1px solid rgba(70,40,8,.55); background: linear-gradient(180deg, rgba(255,255,255,.25), rgba(255,255,255,0) 45%); }
  .cta::after { content: ""; position: absolute; top: -20%; bottom: -20%; width: 70px; left: -90px; transform: skewX(-20deg);
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.75), rgba(255,255,255,0)); animation: sheen 3.4s ease-in-out 1.6s infinite; }
  @keyframes sheen { 0% { left: -90px; } 38%, 100% { left: 420px; } }
  .cta b { position: relative; font-family: var(--serif-jp); font-size: 34px; font-weight: 800; letter-spacing: .24em; text-shadow: 0 1px 0 rgba(255,240,200,.6); }
  .cta img { position: relative; width: 44px; height: 44px; animation: chip 6s linear infinite; }
  @keyframes chip { to { transform: rotate(360deg); } }
  .cta:active { transform: translateY(3px) scale(.99); }

  /* ===== 左下：物語の進み具合（相手5人の肖像の札。勝った相手に WIN、今夜の相手は光る、まだの相手は影と錠前） ===== */
  .story { position: absolute; left: 30px; bottom: 28px; display: grid; gap: 10px; }
  .story .head { display: flex; align-items: baseline; gap: 12px; }
  .story .head small { font-family: var(--serif); font-size: 12px; letter-spacing: .38em; color: var(--gold); }
  .story .head b { font-family: var(--serif); font-size: 24px; font-weight: 600; color: var(--gold-hi); letter-spacing: .06em; }
  .story .head b i { font-style: normal; font-size: 15px; color: var(--muted); }
  .story .row { display: flex; gap: 10px; align-items: flex-end; }
  .pc { position: relative; width: 62px; height: 86px; border-radius: 4px; overflow: hidden; background: #160809;
    box-shadow: inset 0 0 0 1px rgba(244,220,162,.7), 0 8px 16px rgba(0,0,0,.55); }
  .pc img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
  .pc::after { content: ''; position: absolute; inset: 3px; border: 1px solid rgba(244,220,162,.35); border-radius: 2px; pointer-events: none; }
  .pc.win img { filter: saturate(.75) brightness(.8); }
  .pc.win em { position: absolute; left: -4px; right: -4px; bottom: 8px; text-align: center; font-style: normal; font-family: var(--serif); font-weight: 700; font-size: 12px; letter-spacing: .28em; color: #2a1604;
    background: var(--metal); transform: rotate(-8deg); box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .pc.now { width: 74px; height: 104px; box-shadow: inset 0 0 0 1.5px var(--gold-hi), 0 0 18px rgba(244,220,162,.5), 0 10px 20px rgba(0,0,0,.6); animation: nowGlow 2.2s ease-in-out infinite; }
  @keyframes nowGlow { 50% { box-shadow: inset 0 0 0 1.5px var(--gold-hi), 0 0 4px rgba(244,220,162,.15), 0 10px 20px rgba(0,0,0,.6); } }
  .pc.lock img { filter: brightness(0) ; opacity: .55; }
  .pc.lock svg { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; color: var(--gold); stroke-width: 1.6; }

  /* ===== リコ先輩のひと言（吹き出し・数秒ごとに入れ替わる） ===== */
  .say { position: absolute; left: calc(50% + 196px); top: 300px; max-width: 250px; padding: 12px 16px; border-radius: 3px; font-family: var(--serif-jp); font-weight: 700; font-size: 16px; letter-spacing: .06em; line-height: 1.5;
    animation: sayIn 6s ease-in-out 1.2s infinite; }
  .say::after { content: ""; position: absolute; left: -9px; top: 22px; border: 9px solid transparent; border-right-color: rgba(207,168,98,.42); border-left: 0; }
  @keyframes sayIn { 0%, 100% { opacity: 0; transform: translateY(6px); } 8%, 80% { opacity: 1; transform: none; } }

  /* スマホ横（高さが小さい時）：文字の下限を守るため部品を少し大きく */
  .stage.sm .place b { font-size: 24px; } .stage.sm .place .pt small { display: none; }
  .stage.sm .banner { display: none; }
  .stage.sm .place { width: 310px; height: 76px; } .stage.sm .place .badge { right: 22px; }
  .stage.sm .nameplate .who small, .stage.sm .go .opp span, .stage.sm .story .head small { display: none; }
  .stage.sm .nameplate .who b { font-size: 26px; } .stage.sm .go .opp b { font-size: 30px; } .stage.sm .go .opp small { font-size: 16px; } .stage.sm .story .head b { font-size: 30px; }
  .stage.sm .iconbtn { width: 60px; height: 60px; } .stage.sm .iconbtn svg { width: 28px; height: 28px; } .stage.sm .purse { height: 60px; } .stage.sm .purse b { font-size: 32px; }
  .stage.sm .go { bottom: 30px; } .stage.sm .say { font-size: 20px; max-width: 300px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="breath"><div class="art"></div></div>
  <div class="gearglow"></div>
  <div class="grade"></div>

  <!-- 上の帯 -->
  <div class="topbar">
    <div class="nameplate glass">
      <div class="rank"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="19" stroke-dasharray="3 3"/><circle cx="21" cy="21" r="15"/></svg><b>12</b></div>
      <div class="who"><small>ROOKIE DEALER</small><b>ミミ</b></div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn glass" aria-label="お知らせ"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="dot"></span></button>
    <button class="iconbtn glass" aria-label="贈り物"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg><span class="dot"></span></button>
    <div class="purse glass"><img src="../../assets/ui/chip_gold.webp" alt=""><b>850</b><span class="plus">＋</span></div>
    <button class="iconbtn glass" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>

  <!-- 左：行き先 -->
  <nav class="places">
