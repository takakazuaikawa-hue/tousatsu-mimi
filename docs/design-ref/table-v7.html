<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卓 v7 見本</title>
<!-- 卓の画面の見本 v7（2026-10-04）。v6 からの変更：左上の小さな助言・心の声の枠をやめ、リコ先輩の一言は行動ボタンの真上に1つだけ。手番は左上の1行に。勝率は手札の横の「見る」ボタンに。文字は13px 以上。
     本体には組み込んでいない。1280×800 で見る。
     方針：キャラが主役／UI は黒の半透明＋細い線1本／金は大事な数字と押してほしいボタンだけ／
     文字は明朝（名前）・ゴシック（本文）・Barlow Condensed（数字）の3種類／絵文字・斜めの帯・光のグラデーションは使わない -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;700&display=swap">
<style>
  :root {
    --ink: #0b0809;
    --panel: rgba(12, 9, 10, .74);
    --line: rgba(243, 236, 224, .14);
    --line-strong: rgba(243, 236, 224, .28);
    --ivory: #f3ece0;
    --muted: #a59c90;
    --dim: #6f675e;
    --gold: #d8b56c;
    --gold-ink: #1a1206;
    --crimson: #c53a4c;
    --suit-red: #c8283d;
    --suit-black: #17171b;
    --num: "Barlow Condensed", "Noto Sans JP", sans-serif;
    --sans: "Noto Sans JP", sans-serif;
    --mincho: "Shippori Mincho B1", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  body { font-family: var(--sans); color: var(--ivory); -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 1280px; height: 800px; overflow: hidden; background: var(--ink); }

  /* ---- 背景：卓の部屋をぼかして暗く。手前の卓だけ少し明るく ---- */
  .bg { position: absolute; inset: 0; background: url('../../assets/backgrounds/table_grano.webp') center 20% / 130% auto no-repeat; filter: blur(4px) brightness(.5) saturate(.8); transform: scale(1.04); }
  .bg-shade { position: absolute; inset: 0; background:
      radial-gradient(40% 50% at 50% 30%, rgba(216,181,108,.10), rgba(0,0,0,0) 70%),
      linear-gradient(90deg, rgba(11,8,9,.7) 0%, rgba(11,8,9,0) 30%, rgba(11,8,9,0) 70%, rgba(11,8,9,.5) 100%); }

  /* ---- 相手：卓の奥に大きく立つ（腰から下は卓の縁で隠れる） ---- */
  .opp { position: absolute; left: 50%; top: 58px; width: 600px; height: 900px; transform: translateX(-50%);
    background: url('../../assets/characters/grano_default.webp') center top / contain no-repeat; filter: drop-shadow(0 20px 40px rgba(0,0,0,.6)); }
  /* 卓：手前にフェルトと金の縁。相手の腰から下はここに隠れる */
  .felt { position: absolute; left: -12%; width: 124%; top: 392px; height: 900px; border-radius: 50% 50% 0 0 / 120px 120px 0 0;
    background: radial-gradient(60% 40% at 50% 10%, #3a1219 0%, #23090e 55%, #12060a 100%);
    box-shadow: 0 -1px 0 rgba(216,181,108,.55), 0 -10px 30px rgba(0,0,0,.6), inset 0 2px 0 rgba(0,0,0,.6), inset 0 0 0 1px rgba(216,181,108,.08); }
  .felt::after { content: ""; position: absolute; left: 8%; right: 8%; top: 22px; height: 400px; border-radius: 50% 50% 0 0 / 90px 90px 0 0; border-top: 1px solid rgba(216,181,108,.16); }

  /* ---- 上の帯：左に卓の名前と手番、真ん中にチップの綱引き、右にメニュー ---- */
  .top { position: absolute; z-index: 2; left: 0; right: 0; top: 0; height: 64px; background: linear-gradient(180deg, rgba(11,8,9,.9), rgba(11,8,9,.0)); display: grid; grid-template-columns: 300px 1fr 300px; align-items: center; padding: 0 28px; }
  .where { display: flex; align-items: baseline; gap: 14px; }
  .where .table { font-family: var(--mincho); font-size: 15px; letter-spacing: .12em; color: var(--ivory); }
  .where .hand { font-family: var(--num); font-size: 15px; letter-spacing: .14em; color: var(--muted); }
  .menu { justify-self: end; display: flex; gap: 8px; }
  .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); background: rgba(12,9,10,.5); color: var(--ivory); border-radius: 2px; }
  .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }

  .tug { justify-self: center; width: 520px; }
  .tug-row { display: flex; justify-content: space-between; align-items: baseline; }
  .tug-name { font-size: 11px; letter-spacing: .18em; color: var(--muted); }
  .tug-num { font-family: var(--num); font-weight: 500; font-size: 22px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .tug-num.me { color: var(--gold); }
  .tug-num.them { color: var(--ivory); }
  .tug-bar { position: relative; height: 3px; margin: 5px 0 4px; background: rgba(197,58,76,.75); }
  .tug-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 33%; background: var(--gold); }
  .tug-bar b { position: absolute; left: 50%; top: -4px; width: 1px; height: 11px; background: var(--ivory); opacity: .6; }
  .tug-goal { text-align: center; font-size: 11px; color: var(--muted); letter-spacing: .06em; }
  .tug-goal em { font-style: normal; font-family: var(--num); font-size: 13px; color: var(--ivory); letter-spacing: .04em; }

  /* ---- 手番の段：プリフロップ → フロップ → ターン → リバー ---- */
  .streets { position: absolute; left: 28px; top: 92px; display: grid; gap: 6px; }
  .street { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--dim); letter-spacing: .08em; }
  .street i { width: 6px; height: 6px; border: 1px solid currentColor; transform: rotate(45deg); }
  .street.now { color: var(--ivory); }
  .street.now i { background: var(--gold); border-color: var(--gold); }
  .street small { font-size: 10px; color: var(--dim); letter-spacing: .04em; }

  /* ---- 勝率（封印中）と詳細 ---- */
  .odds { position: absolute; right: 28px; top: 92px; width: 200px; border: 1px solid var(--line); background: var(--panel); padding: 12px 14px; }
  .odds-label { font-size: 11px; letter-spacing: .16em; color: var(--muted); }
  .odds-val { font-family: var(--num); font-size: 30px; font-weight: 500; color: var(--dim); line-height: 1.1; margin-top: 2px; }
  .odds-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .odds-hint b { color: var(--gold); font-weight: 500; }

  /* ---- 卓の中央：ポットと場札 ---- */
  .center { position: absolute; left: 50%; top: 452px; transform: translateX(-50%); display: grid; justify-items: center; gap: 12px; }
  .pot { display: flex; align-items: baseline; gap: 10px; padding: 4px 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: rgba(12,9,10,.55); }
  .pot span { font-size: 11px; letter-spacing: .2em; color: var(--muted); }
  .pot b { font-family: var(--num); font-weight: 500; font-size: 28px; color: var(--gold); letter-spacing: .02em; line-height: 1; }
  .board { display: flex; gap: 10px; }
  .slot { width: 66px; height: 92px; border: 1px solid var(--line-strong); border-radius: 6px; background:
      repeating-linear-gradient(45deg, rgba(243,236,224,.035) 0 6px, transparent 6px 12px), rgba(12,9,10,.45); }

  /* ---- 相手のセリフ：映画の字幕のように ---- */
  .line { position: absolute; left: 50%; top: 402px; transform: translateX(-50%); text-align: center; white-space: nowrap; }
  .line .who { font-family: var(--mincho); font-size: 13px; letter-spacing: .3em; color: var(--gold); }
  .line .say { margin-top: 2px; font-size: 18px; font-weight: 500; letter-spacing: .04em; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 18px rgba(0,0,0,.8); }

  /* ---- ミミ：左下に胸から上。手札は真ん中下 ---- */
  .mimi { position: absolute; left: -40px; bottom: -185px; width: 470px; height: 627px; background: url('../../assets/characters/mimi_bust_calm.webp') center top / contain no-repeat;
    -webkit-mask-image: linear-gradient(180deg, #000 70%, rgba(0,0,0,0) 92%); mask-image: linear-gradient(180deg, #000 70%, rgba(0,0,0,0) 92%); }
  .think { position: absolute; z-index: 1; left: 28px; top: 282px; width: 300px; max-width: none; max-width: 250px; padding: 9px 12px; background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--gold); font-size: 13px; line-height: 1.55; color: var(--ivory); }
  .think small { display: block; font-size: 10px; letter-spacing: .18em; color: var(--muted); margin-bottom: 2px; }

  .hand { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: grid; justify-items: center; gap: 10px; }
  .hand-name { font-size: 12px; letter-spacing: .1em; color: var(--muted); }
  .hand-name b { color: var(--ivory); font-weight: 500; letter-spacing: .04em; }
  .cards { display: flex; gap: 10px; }
  .card { position: relative; width: 92px; height: 128px; border-radius: 8px; background: #fbf8f2; box-shadow: 0 10px 24px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.08); color: var(--suit-black); }
  .card.red { color: var(--suit-red); }
  .card .r { position: absolute; left: 10px; top: 6px; font-family: var(--num); font-weight: 600; font-size: 34px; line-height: 1; }
  .card .s { position: absolute; left: 12px; top: 42px; font-size: 18px; line-height: 1; }
  .card .big { position: absolute; right: 10px; bottom: 6px; font-size: 52px; line-height: 1; }

  /* ---- 行動：右下に3つ。押してほしい1つだけ金で塗る ---- */
  .acts { position: absolute; right: 28px; bottom: 34px; width: 330px; display: grid; gap: 8px; }
  .act { display: flex; justify-content: space-between; align-items: center; height: 58px; padding: 0 18px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ivory); border-radius: 2px; }
  .act b { font-size: 19px; font-weight: 700; letter-spacing: .12em; }
  .act small { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .act.primary { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); height: 64px; }
  .act.primary small { color: rgba(26,18,6,.7); }
  .act.quiet { opacity: .55; }
  .act .chev { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* ---- リコ先輩の一言：左上、小さな顔＋1行 ---- */
  .coach { position: absolute; left: 28px; top: 214px; width: 300px; display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; padding: 8px 12px 8px 8px; background: var(--panel); border: 1px solid var(--line); }
  .coach .face { width: 40px; height: 40px; background: url('../../assets/battle/face/rico_smug.webp') center 20% / cover no-repeat; border: 1px solid var(--line-strong); }
  .coach small { display: block; font-size: 10px; letter-spacing: .18em; color: var(--muted); }
  .coach p { font-size: 13px; line-height: 1.5; }

  /* v7：左上は卓の名前＋手番の1行だけ */
  .where { display: grid; gap: 4px; }
  .where .table { font-size: 17px; }
  .where .hand-no { font-family: var(--num); font-size: 15px; color: var(--ivory); letter-spacing: .12em; }
  .where .hand-no em { font-style: normal; color: var(--gold); font-family: var(--sans); font-size: 13px; letter-spacing: .08em; margin-left: 8px; }
  .tug-name { font-size: 13px; }
  .tug-goal { font-size: 13px; }
  .text-btn { height: 38px; padding: 0 14px; border: 1px solid var(--line); background: rgba(12,9,10,.5); color: var(--ivory); font: inherit; font-size: 14px; letter-spacing: .1em; border-radius: 2px; }
  /* 勝率：手札の右に、封印中のボタン */
  .peek { position: absolute; right: 28px; top: 72px; display: grid; gap: 2px; padding: 10px 14px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ivory); text-align: left; font: inherit; }
  .peek small { font-size: 12px; color: var(--muted); letter-spacing: .12em; }
  .peek b { font-size: 15px; font-weight: 700; letter-spacing: .06em; }
  .peek b span { color: var(--gold); }
  .hand-name { font-size: 14px; }
  /* リコ先輩の一言：行動ボタンの真上 */
  .advice { position: absolute; right: 28px; bottom: 212px; width: 330px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; }
  .advice .face { width: 44px; height: 44px; background: url('../../assets/battle/face/rico_smug.webp') center 20% / cover no-repeat; border: 1px solid var(--line-strong); }
  .advice p { font-size: 15px; line-height: 1.5; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 12px rgba(0,0,0,.8); }
  .advice small { display: block; font-size: 12px; letter-spacing: .16em; color: var(--gold); }
  .act small { font-size: 12px; }
  .line .who { font-size: 14px; }
  .line .say { font-size: 20px; }
</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>
  <div class="bg-shade"></div>
  <div class="opp" aria-hidden="true"></div>
  <div class="felt" aria-hidden="true"></div>

  <header class="top">
    <div class="where"><span class="table">グラーノの卓</span><span class="hand-no">HAND 01<em>プリフロップ（配っただけ）</em></span></div>
    <div class="tug" aria-label="チップの取り合い">
      <div class="tug-row"><span class="tug-name">ミミ</span><span class="tug-name">グラーノ</span></div>
      <div class="tug-row"><span class="tug-num me">1,250</span><span class="tug-num them">2,550</span></div>
      <div class="tug-bar"><i></i><b></b></div>
      <div class="tug-goal">相手のチップを0にしたら勝ち　あと <em>2,550</em></div>
    </div>
    <nav class="menu"><button class="text-btn">役の一覧</button><button class="text-btn">中断</button></nav>
  </header>

  <div class="line"><div class="who">GRANO</div><div class="say">お嬢さんの財布の中身、楽しみですよ。</div></div>

  <div class="center">
    <div class="pot"><span>POT</span><b>100</b></div>
    <div class="board"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
  </div>

  <div class="mimi" aria-hidden="true"></div>

  <div class="hand">
    <div class="hand-name">ミミの手　<b>まだ役なし・同じマーク</b></div>
    <div class="cards">
      <div class="card"><span class="r">K</span><span class="s">♣</span><span class="big">♣</span></div>
      <div class="card"><span class="r">4</span><span class="s">♣</span><span class="big">♣</span></div>
    </div>
  </div>

  <button class="peek"><small>勝率</small><b>？　<span>ぱにゅぱにゅ</span>で見る</b></button>

  <div class="advice"><div class="face"></div><div><small>リコ先輩</small><p>Kがあるなら悪くない。タダで次の札を見よう</p></div></div>

  <div class="acts">
    <button class="act primary"><b>チェック</b><small>タダで次の札を見る</small></button>
    <div class="pair">
      <button class="act quiet"><b>降りる</b></button>
      <button class="act"><b>賭ける</b><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </div>
</div>
</body>
</html>
