<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ぱにゅぱにゅ 触り比べ</title>
<style>
  :root { --ink: #0b0809; --ivory: #f3ece0; --muted: #c9bfb2; --gold: #d8b56c; --gold-hi: #f0d595; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--ivory); overflow: hidden;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  /* 呼吸：絵全体をゆっくり拡縮（合成だけで済むので、止まっている間も描き直しは起きない） */
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transform-origin: 50% 100%; animation: breath 3.6s ease-in-out infinite; }
  @keyframes breath { 50% { transform: scale(1.006, 1.01); } }
  @media (prefers-reduced-motion: reduce) { #gl { animation: none; } }
  .bar { position: fixed; left: 0; right: 0; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    padding: 8px max(12px, env(safe-area-inset-left)); background: linear-gradient(180deg, rgba(8,4,6,.82), rgba(8,4,6,0)); }
  .grp { display: flex; align-items: center; gap: 6px; }
  .grp > span { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  .bar button { min-height: 44px; min-width: 44px; padding: 0 14px; border: 1px solid rgba(243,236,224,.28); border-radius: 2px;
    background: rgba(12,9,10,.72); color: var(--ivory); font: 700 14px/1 inherit; font-family: inherit; cursor: pointer; }
  .bar button.on { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #1a1206; border-color: var(--gold-hi); }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .grp b { font-size: 16px; color: var(--gold-hi); min-width: 2.4em; text-align: center; }
  .note { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; font-size: 13px; color: var(--muted);
    background: rgba(8,4,6,.6); padding: 6px 14px; border-radius: 2px; white-space: nowrap; pointer-events: none; transition: opacity .4s; }
  .note.off { opacity: 0; }
  .err { position: fixed; inset: 0; display: none; place-items: center; z-index: 9; font-size: 15px; padding: 24px; text-align: center; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="fx"></canvas></div>
<div class="bar">
  <div class="grp"><span>動き</span><button data-mode="mesh" class="on">網目＋ばね（新）</button><button data-mode="disc">今に近い動き</button></div>
  <div class="grp"><span>構図</span><button data-zoom="1">今</button><button data-zoom="1.28" class="on">寄り</button><button data-zoom="1.5">もっと寄り</button></div>
  <div class="grp"><span>揺れ</span><button data-amp="1.1">控えめ</button><button data-amp="1.5">標準</button><button data-amp="1.95" class="on">大きめ</button></div>
  <div class="grp"><span>衣装</span><button data-outfit="bunny">バニー</button><button data-outfit="bikini">水着</button></div>
  <div class="grp"><span id="lvName">ボタン</span><b id="lv">0/3</b><button id="btnReset">戻す</button></div>
</div>
<div class="note">押す・連打・長押し・引っぱる・お腹のボタン／寄り具合：ホイール・ピンチ・L/R</div>
<div class="err" id="err">この端末では試作を表示できませんでした（WebGL が使えません）</div>
<script>
(() => {
  // 絵：本編のぱにゅぱにゅと同じ 1400x788。胸のふくらみの中心（本編の座標と同じ）
  // 衣装：bunny＝黒いコルセット（お腹のボタン3つ）／bikini＝水着（左右の肩紐と胸の真ん中のリング）。どちらも同じ構図に位置合わせ済み
  const OUTFIT = new URLSearchParams(location.search).get('c') === 'bikini' ? 'bikini' : 'bunny', BIKINI = OUTFIT === 'bikini';
  const IMG = BIKINI ? '../../assets/characters/panyu_bikini_reach.webp' : '../../assets/characters/panyu_reach.webp';
  const CUPS = [{ c: [607, 600], r: 132 }, { c: [795, 600], r: 132 }];
  const CHEEK = [[636, 324], [764, 324]];
  const EYES = [[640, 281], [762, 281]];   // 目の中心（驚いた時に少し開く）
  // お腹のボタン（金のひし形・上から大中小）。外れるごとに揺れのレベルが上がる
  // 水着は：左の肩紐（カップの角の留め輪→首の方。見えている所だけ）、右の肩紐、胸の真ん中の金のリング
  const BTNS = BIKINI ? [{ a: [581, 536], b: [621, 458] }, { a: [825, 536], b: [786, 458] }, { c: [702, 655], w: 28, h: 28, ring: 1 }]
    : [{ c: [700, 663], w: 54, h: 54 }, { c: [700, 725], w: 30, h: 36 }, { c: [700, 775], w: 26, h: 30 }];
  const segD = (p, a, b) => { const ab = [b[0] - a[0], b[1] - a[1]], t = Math.max(0, Math.min(1, ((p[0] - a[0]) * ab[0] + (p[1] - a[1]) * ab[1]) / (ab[0] ** 2 + ab[1] ** 2))); return Math.hypot(p[0] - a[0] - ab[0] * t, p[1] - a[1] - ab[1] * t); };
  const hitPart = (b, ix, iy) => b.a ? segD([ix, iy], b.a, b.b) < 10 : Math.abs(ix - b.c[0]) < Math.max(26, b.w * 0.7) && Math.abs(iy - b.c[1]) < Math.max(24, b.h * 0.65);
  const COVERS = [[700, 677, 27, 29], [700, 725, 16, 19], [700, 775, 14, 16]];   // 1つ目は飾り石の下（両脇の小さいひし形・大きいひし形・下の玉）   // 外れた金具を隠す範囲（中心・半分の幅・半分の高さ。飾りまで含めて測った）
  // out/down＝止まる位置が外・下へずれる量、kx＝横のばねの硬さ、lx＝外へ揺れられる幅の上乗せ
  const LV = [{ push: 1, damp: 1, rs: 1, out: 0, down: 0, sag: 1, kx: 1, lx: 0 }, { push: 1.2, damp: 0.86, rs: 1.04, out: 14, down: 10, sag: 1.04, kx: 0.82, lx: 4 },
    { push: 1.4, damp: 0.74, rs: 1.08, out: 28, down: 20, sag: 1.08, kx: 0.66, lx: 8 }, { push: 1.65, damp: 0.62, rs: 1.12, out: 66, down: 31, sag: 1.12, kx: 0.5, lx: 12 }];
  const popped = [false, false, false];
  const lvNow = () => LV[popped.filter(Boolean).length];
  // 止まる位置。水着は左右別々：肩紐が外れた側は支えを失って下へ垂れ、リングが外れると左右へ大きく開く
  const restOf = (i) => {
    if (BIKINI) { const s = popped[i] ? 1 : 0, g = popped[2] ? 1 : 0; return [(i === 0 ? -1 : 1) * (8 * s + 52 * g), 18 * s + 12 * g]; }
    const l = lvNow(); return [(i === 0 ? -1 : 1) * l.out, l.down];
  };   // 頬（赤らむ所）
  const FOCUS = [701, 548];          // 寄せる時の注目点（胸の少し上）
  const cv = document.getElementById('gl');
  const gl = cv.getContext('webgl', { antialias: true, alpha: false, premultipliedAlpha: false });
  if (!gl) { document.getElementById('err').style.display = 'grid'; return; }

  // ---- 設定（ボタンで切り替え） ----
  const opt = { mode: 'mesh', zoom: 1.28, amp: 1.95 };
  document.querySelectorAll('[data-outfit]').forEach(b => { b.classList.toggle('on', b.dataset.outfit === OUTFIT); b.addEventListener('click', () => { if (b.dataset.outfit !== OUTFIT) location.search = b.dataset.outfit === 'bikini' ? '?c=bikini' : ''; }); });
  if (BIKINI) { document.getElementById('lvName').textContent = '留め'; document.querySelector('.note').textContent = '押す・連打・長押し・引っぱる・肩紐と胸のリング／寄り具合：ホイール・ピンチ・L/R'; }
  document.querySelectorAll('.bar button[data-mode], .bar button[data-zoom], .bar button[data-amp]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.mode ? 'mode' : b.dataset.zoom ? 'zoom' : 'amp';
    if (k === 'zoom') { setZoom(+b.dataset.zoom); return; }
    opt[k] = k === 'mode' ? b.dataset.mode : +b.dataset[k];
    b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    resetPhys(); layout(); kick();
  }));

  // ---- シェーダー：画像の座標で網目を置き、胸の範囲だけをずらす ----
  const VS = `
    attribute vec2 aP;
    uniform vec2 uImg, uOff, uView; uniform float uScale, uDisc;
    uniform vec2 uC0, uC1, uD0, uD1, uS0, uS1; uniform float uR0, uR1, uSpread, uSurp;
    uniform vec2 uE0, uE1;
    varying vec2 vUV, vPix; varying float vLit;
    vec3 cup(vec2 p, vec2 c, float r, vec2 d, vec2 s) {
      vec2 q = p - c;
      float rr = length(q / (vec2(r * 1.12, r) * uSpread));
      float w, a;
      if (uDisc > 0.5) { w = 1.0 - smoothstep(0.78, 1.0, rr); a = 1.0; }      // 今に近い：丸い板が丸ごと動く
      else {
        w = 1.0 - smoothstep(0.0, 1.0, rr);                                   // 中心ほど大きく、ふちへなだらかに体に溶ける（胸の外は動かさない）
        float t = clamp((q.y + r * 0.95 * uSpread) / (r * 1.7 * uSpread), 0.0, 1.0);               // 上（付け根）は固定、下ほど自由
        a = 0.18 + 0.82 * t * t * (3.0 - 2.0 * t);
        a = mix(a, 0.7 + 0.3 * a, clamp(-d.y / r * 2.5, 0.0, 1.0));            // 持ち上がる時は、胸全体が上がる
      }
      vec2 o = d * w * a + q * (s - 1.0) * w * (uDisc > 0.5 ? 1.0 : (0.35 + 0.65 * a));
      // つや：前へ出る向き（下へ沈む・横へ寄る）に合わせて、ほんの少し明るさを変える
      float lit = w * a * (-d.y / r) * 0.9 + w * (s.x - 1.0) * 0.6;
      return vec3(o, lit);
    }
    void main() {
      vec3 a = cup(aP, uC0, uR0, uD0, uS0), b = cup(aP, uC1, uR1, uD1, uS1);
      vec2 p = aP + a.xy + b.xy;
      // 驚き：頭がわずかにのけぞる（表情は描き起こした驚き顔に切り替える）
      if (uSurp > 0.001) {
        float head = 1.0 - smoothstep(330.0, 400.0, aP.y); head *= 1.0 - smoothstep(170.0, 260.0, abs(aP.x - 701.0));
        p.y -= 4.0 * uSurp * head;
      }
      vec2 s = uOff + p * uScale;
      gl_Position = vec4(s.x / uView.x * 2.0 - 1.0, 1.0 - s.y / uView.y * 2.0, 0.0, 1.0);
      vUV = aP / uImg; vPix = aP; vLit = a.z + b.z;
    }`;
  const FS = `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif
    uniform sampler2D uTex, uFace; uniform float uBlush, uSurpF; uniform vec4 uFaceR; uniform vec2 uImgF; uniform vec4 uB0, uB1, uB2; uniform vec3 uPop; varying vec2 vUV, vPix; varying float vLit;
    // ボタンが外れた所：コルセットの左右の布そのものが外へ引かれて開く（模様も縁取りも本物のまま分かれる）。すき間の奥は影
    uniform vec3 uGap;   // x＝上の端での半分の幅、y＝裂け目の下の端、z＝画面1点が絵の何点か（ふちのなめらかさ）
    const float GX = 700.0, GY = 638.0;   // 裂け目は谷間の先から始まる（飾り石の頂点のすぐ上）
    float gapHalf(float y) {
      if (uGap.x < 0.05 || y < GY || y > uGap.y) return 0.0;
      float t = (y - GY) / (uGap.y - GY);
      // 谷間の先からとがって始まり、飾り石の幅をすぐ覆い、胸の下で一番広く、下へ細るV字
      return (9.0 + 0.6 * uGap.x) * smoothstep(0.0, 1.0, uGap.x) * pow(1.0 - t, 0.85) * pow(clamp((y - GY) / 24.0, 0.0, 1.0), 0.85);
    }
    // 胸の合わせ目の赤い飾り石（1つ目と一緒に外れる）：石の外の黒い布で埋める。金の縁取りは拾わない範囲で写す
    vec3 jewel(vec3 col, vec2 q) {
      if (uPop.x < 0.5 || q.y < 637.0 || q.y > 656.0) return col;
      float a = abs(q.x - GX), jw = 1.5 + 9.5 * clamp((q.y - 639.0) / 9.0, 0.0, 1.0);   // 石の半分の幅（とがった頂点から広がる）
      if (a > jw + 1.0) return col;
      float tin = 11.0 + (654.0 - q.y) * 0.59;                                          // 金の縁取りの内側のふち
      float s = clamp((tin - 1.0 - jw) / jw, 0.0, 1.0);
      vec3 fab = texture2D(uTex, vec2(GX + sign(q.x - GX + 0.001) * (jw + (jw - a) * s), q.y) / uImgF).rgb;
      return mix(col, fab, 1.0 - smoothstep(jw, jw + 1.0, a));
    }
    // 外れた金具の跡：金具の形（ひし形＋飾り）に合わせた範囲を、すぐ外の布の鏡写しで埋める（b＝中心と半分の幅・高さ）
    vec3 cover(vec3 col, vec2 p, vec4 b, float on) {
      if (on < 0.5) return col;
      vec2 q = abs(p - b.xy) / b.zw; float d = pow(pow(q.x, 3.0) + pow(q.y, 3.0), 1.0 / 3.0);   // 角の丸い四角（飾りまで確実に隠す）
      float m = 1.0 - smoothstep(0.85, 1.05, d);
      if (m <= 0.0) return col;
      float ex = b.z * max(0.6, pow(max(0.0, 1.1 - pow(q.y, 3.0)), 1.0 / 3.0));   // この段での金具の端
      float sx = sign(p.x - b.x + 0.001);
      vec2 mp = vec2(b.x + sx * (2.0 * ex - abs(p.x - b.x)), p.y);   // 金具の端で折り返して、すぐ隣の布を鏡写し（質感がつながる）
      return mix(col, texture2D(uTex, mp / uImgF).rgb, m);
    }
    // 開いた布の見た目：e＝布の切り口からの距離（＋は布の上、−はすき間の中）
    vec3 gapShade(vec3 col, vec2 p, float h, float e) {
      float aa = max(0.6, uGap.z);
      // 布：切り口へ向かって少し奥へ回り込み（暗く）、いちばん端は厚みのつやが立つ
      col *= 1.0 - 0.22 * smoothstep(1.2, 3.5, e) * (1.0 - smoothstep(3.5, 13.0, e));
      col += vec3(0.04, 0.03, 0.04) * smoothstep(0.4, 1.0, e) * (1.0 - smoothstep(1.6, 2.8, e));
      // すき間の肌：元の絵と同じアニメ塗り（明るい面と影の2段をくっきり、影の境目にほんのり赤み）。色は絵から測った値
      float lw = clamp(h * 0.12, 0.0, 1.8);                        // 切り口が外へめくれて、裏地（深紅）が細くのぞく幅＝布の厚み
      float u = -e - 0.9 - lw;                                      // 肌の上での、布の縁からの距離
      bool left = p.x < GX;
      float sw = left ? 1.3 + 0.3 * h : 0.8 + 0.12 * h;             // 光は左から：左の縁は肌に広く影を落とし、右の縁は細く
      float yb = GY + 15.0 + 0.3 * h;                               // 胸のすぐ下は胸の影の中
      // 元の絵の肌はなめらかなぼかしとつやの丸みで塗られている：影はやわらかく、お腹は真ん中ほど前へ出て明るい
      float sd = max(0.9 * (1.0 - smoothstep(0.0, sw * 1.8, u)), 0.85 * (1.0 - smoothstep(yb - 9.0, yb + 7.0, p.y)));
      float c = clamp(1.0 - pow(abs(p.x - GX) / max(h, 1.0), 2.0), 0.0, 1.0);   // お腹の丸み（真ん中が前）
      vec3 lit = vec3(0.975, 0.835, 0.76), shd = vec3(0.9, 0.6, 0.52), ao = vec3(0.6, 0.31, 0.26);
      vec3 inside = mix(lit * mix(0.95, 1.01, c), shd, sd);
      inside += vec3(0.035, -0.02, -0.03) * sd * (1.0 - sd) * 4.0;           // 影の境目はほんのり赤みが差す
      inside = mix(inside, ao, 1.0 - smoothstep(0.0, 1.0 + aa * 0.5, u));   // 布が肌に触れる所はいちばん暗い
      float topW = 1.0 - smoothstep(GY, GY + 8.0, p.y);
      inside = mix(inside, vec3(0.89, 0.56, 0.46), topW);            // 谷間の先から続く
      float lu = clamp((-e - 0.9) / max(lw, 0.01), 0.0, 1.0);      // 裏地の上の位置（0＝切り口、1＝奥へ回り込む所）
      vec3 lining = mix(vec3(0.46, 0.08, 0.1), vec3(0.24, 0.035, 0.055), lu) * (left ? 1.08 : 0.9);   // 光の来る左側の裏地は少し明るい
      vec3 deep = mix(inside, lining, (1.0 - smoothstep(lw - aa * 0.5, lw + aa * 0.5, -e - 0.9)) * (1.0 - topW));
      col = mix(col, deep, 1.0 - smoothstep(-0.9 - aa * 0.5, -0.9 + aa * 0.5, e));
      // 絵と同じ濃い線画で、切り口をくっきり（裏地の奥側にも細い影の線）
      float ln = 1.0 - smoothstep(0.55, 0.55 + aa, abs(e + 0.25));
      float ln2 = (1.0 - smoothstep(0.35, 0.35 + aa, abs(-e - 0.9 - lw))) * smoothstep(0.8, 2.0, lw);
      col = mix(col, vec3(0.06, 0.02, 0.03), ln2 * 0.7);
      return mix(col, vec3(0.11, 0.045, 0.055), ln * 0.9 * smoothstep(0.0, 1.2, h));
    }
    // ---- 水着：外れた肩紐とリングを消し、下の肌を見せる（肌はすぐ隣の本物の肌から写す） ----
    uniform vec4 uBk;   // x＝左の肩紐、y＝右の肩紐、z＝胸のリングが外れたか、w＝水着か
    vec3 tex(vec2 q) { return texture2D(uTex, q / uImgF).rgb; }
    float skinLike(vec3 c) { return smoothstep(0.56, 0.66, c.r) * smoothstep(0.06, 0.14, c.r - c.b) * smoothstep(0.36, 0.46, c.g) * (1.0 - smoothstep(0.3, 0.38, c.r - c.g)); }   // 肌らしさ（なめらか。髪・リボンとの際で縞にならない）
    vec3 strapOff(vec3 col, vec2 p, vec2 a, vec2 b, float on) {
      if (on < 0.5) return col;
      vec2 ab = b - a; float t = clamp(dot(p - a, ab) / dot(ab, ab), 0.0, 1.0); vec2 cp = a + ab * t; float d = length(p - cp);
      if (d > 6.6) return col;
      vec2 n = normalize(vec2(-ab.y, ab.x)); float sd = dot(p - cp, n);
      vec3 c1 = tex(cp + n * 8.0), c2 = tex(cp - n * 8.0);                   // 紐の縁のにじみより外の、本物の肌
      float k1 = skinLike(c1), k2 = skinLike(c2), kk = k1 + k2;
      if (kk < 0.02) return col;                                           // 両側が肌でない所（髪・リボンの際）は触らない
      float u = clamp(sd / 16.0 + 0.5, 0.0, 1.0);
      vec3 fill = (c1 * k1 * u + c2 * k2 * (1.0 - u)) / max(k1 * u + k2 * (1.0 - u), 0.001);
      fill = mix(fill, (c1 * k1 + c2 * k2) / kk, step(k1 * u + k2 * (1.0 - u), 0.02));
      fill *= mix(vec3(1.0), vec3(0.995, 0.9, 0.885), (1.0 - smoothstep(0.4, 1.8, d)) * 0.5);   // 紐の跡がうっすら赤い
      float m = (1.0 - smoothstep(4.6, 6.6, d)) * smoothstep(4.5, 7.0, length(p - a)) * clamp(kk, 0.0, 1.0);   // カップの角の留め輪は残す
      return mix(col, fill, m);
    }
    // 胸のリング：輪とつながる帯の真ん中を、上下の本物の肌でつなぐ（輪の内側も含めて一続きに。半径の向きで写すと帯や金を拾う）
    vec3 ringOff(vec3 col, vec2 p, float on) {
      if (on < 0.5) return col;
      vec2 C = vec2(702.0, 655.0); float r = length(p - C), ax = abs(p.x - C.x);
      float ringM = 1.0 - smoothstep(16.0, 18.4, r);
      float bandM = (1.0 - smoothstep(4.8, 6.6, abs(p.y - 656.4))) * (1.0 - smoothstep(20.0, 25.0, ax));   // カップの角の短い端は残る
      float m = max(ringM, bandM);
      if (m < 0.001) return col;
      float hr = sqrt(max(0.0, 19.0 * 19.0 - ax * ax));                   // この列で、輪のにじみの外になる上下の位置

      const c = CUPS[i].c, r = CUPS[i].r, rs = restOf(i), d = [P[i].d[0] + rs[0], P[i].d[1] + rs[1]], s = [P[i].sx, P[i].sy];
      const qx = x - c[0], qy = y - c[1], w = 1 - sm(0, 1, Math.hypot(qx / (r * 1.12), qy / r));
      const t = Math.min(1, Math.max(0, (qy + r * 0.95) / (r * 1.7))); let a = 0.18 + 0.82 * t * t * (3 - 2 * t);
      const m = Math.min(1, Math.max(0, -d[1] / r * 2.5)); a = a * (1 - m) + (0.7 + 0.3 * a) * m;
      const k = w * (0.35 + 0.65 * a); ox += d[0] * w * a + qx * (s[0] - 1) * k; oy += d[1] * w * a + qy * (s[1] - 1) * k;
    }
    return [x + ox, y + oy];
  }
  const anchorOf = (k) => meshAt(...BTNS[k].a);
  function addRope(k, out) {
    const a = BTNS[k].a, b = BTNS[k].b, len = Math.hypot(b[0] - a[0], b[1] - a[1]) * 1.05, pts = [];
    for (let n = 0; n <= RN; n++) { const t = n / RN, x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t;
      pts.push({ x, y, px: x - out * 9 * t * t, py: y + 11 * t * t }); }   // 首の側の端ほど、外・上へぴんと跳ねる勢い
    ropes.push({ k, pts, seg: len / RN });
  }
  function stepRopes(dt) {
    const h = Math.min(dt, 1 / 60) / 2;
    for (const r of ropes) for (let s = 0; s < 2; s++) {
      const an = anchorOf(r.k); r.pts[0].x = an[0]; r.pts[0].y = an[1]; r.pts[0].px = an[0]; r.pts[0].py = an[1];
      for (let n = 1; n <= RN; n++) { const q = r.pts[n], vx = (q.x - q.px) * 0.988, vy = (q.y - q.py) * 0.988; q.px = q.x; q.py = q.y; q.x += vx; q.y += vy + RG * h * h; }
      for (let it = 0; it < 8; it++) for (let n = 0; n < RN; n++) {   // 長さを保つ（伸びない紐）
        const A = r.pts[n], B = r.pts[n + 1], dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1, f = (L - r.seg) / L;
        if (n === 0) { B.x -= dx * f; B.y -= dy * f; } else { A.x += dx * f * 0.5; A.y += dy * f * 0.5; B.x -= dx * f * 0.5; B.y -= dy * f * 0.5; }
      }
    }
  }
  const ropesMoving = () => ropes.some(r => r.pts.some(q => Math.hypot(q.x - q.px, q.y - q.py) > 0.02));
  function drawRopes() {
    for (const r of ropes) {
      const S = r.pts.map(q => [view.ox + q.x * view.s, view.oy + q.y * view.s]);
      const path = (o) => { fc.beginPath(); fc.moveTo(S[0][0] + o, S[0][1] + o); for (let n = 1; n < RN; n++) { const mx = (S[n][0] + S[n + 1][0]) / 2, my = (S[n][1] + S[n + 1][1]) / 2; fc.quadraticCurveTo(S[n][0] + o, S[n][1] + o, mx + o, my + o); } fc.lineTo(S[RN][0] + o, S[RN][1] + o); };
      fc.lineCap = 'round'; fc.lineJoin = 'round';
      fc.strokeStyle = 'rgba(60,20,20,.22)'; fc.lineWidth = 3.4 * view.s; path(1.6 * view.s); fc.stroke();   // 肌に落ちるうっすらした影
      fc.strokeStyle = '#1b1113'; fc.lineWidth = 2.7 * view.s; path(0); fc.stroke();
      fc.strokeStyle = 'rgba(150,95,105,.5)'; fc.lineWidth = 0.8 * view.s; path(-0.5 * view.s); fc.stroke();   // 生地のつや
    }
  }
  function stepParts(dt) {
    stepRopes(dt);
    for (let n = parts.length - 1; n >= 0; n--) { const q = parts[n]; q.t += dt; if (q.t > q.life) { parts.splice(n, 1); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt; if (q.star) { q.vx *= 0.9; q.vy = q.vy * 0.9 + 300 * dt; } else { q.vy += 2400 * dt; q.rot += q.vr * dt; } }
  }
  function drawParts() {
    fc.setTransform(view.dpr, 0, 0, view.dpr, 0, 0); fc.clearRect(0, 0, view.w, view.h); drawRopes();
    for (const q of parts) {
      const x = view.ox + q.x * view.s, y = view.oy + q.y * view.s, a = 1 - Math.max(0, (q.t - q.life * 0.7) / (q.life * 0.3));
      fc.globalAlpha = a;
      if (q.star) { const r = q.sz * view.s * (1 - q.t / q.life * 0.5); fc.fillStyle = '#ffe9a8'; fc.beginPath();
        fc.moveTo(x, y - r); fc.lineTo(x + r * 0.28, y); fc.lineTo(x, y + r); fc.lineTo(x - r * 0.28, y); fc.closePath(); fc.fill();
        fc.beginPath(); fc.moveTo(x - r, y); fc.lineTo(x, y + r * 0.28); fc.lineTo(x + r, y); fc.lineTo(x, y - r * 0.28); fc.closePath(); fc.fill(); }
      else { const b = BTNS[q.k], sc = view.s * (1 + q.t * 0.35); fc.save(); fc.translate(x, y); fc.rotate(q.rot);
        fc.beginPath();
        if (b.ring) fc.arc(0, 0, b.w / 2 * sc, 0, Math.PI * 2);   // リングは丸く切り抜く
        else { fc.moveTo(0, -b.h / 2 * sc); fc.lineTo(b.w / 2 * sc, 0); fc.lineTo(0, b.h / 2 * sc); fc.lineTo(-b.w / 2 * sc, 0); fc.closePath(); }   // ひし形に切り抜く
        fc.clip();
        fc.drawImage(img, b.c[0] - b.w / 2, b.c[1] - b.h / 2, b.w, b.h, -b.w / 2 * sc, -b.h / 2 * sc, b.w * sc, b.h * sc); fc.restore(); }
    }
    fc.globalAlpha = 1;
  }
  document.getElementById('btnReset').addEventListener('click', () => { popped.fill(false); ropes.length = 0; document.getElementById('lv').textContent = '0/3'; CUPS.forEach(c => { c.r = 132; }); resetPhys(); gap.len = GAP_END[0]; gap.w = 0; kick(); });
  // 動いている間だけ回す。止まったら描き直しも止める（スマホが熱くならないように）
  let raf = 0, last = 0;
  function loop(t) {
    const dt = Math.min(0.033, (t - (last || t)) / 1000) || 0.016; last = t;
    for (let n = 0; n < 4; n++) step(dt / 4);
    stepGap(dt); stepParts(dt); draw(); drawParts();
    const h = heatNow(); stepBlush(dt, h);
    if (energy() < 0.06 && !P.some(p => p.grab) && h < 0.04 && blush < 0.01 && !parts.length && !ropesMoving() && surpNow() < 0.005 && gapSettled()) { resetPhys(); gap.w = gapTarget(); blush = 0; draw(); drawParts(); raf = 0; last = 0; return; }
    raf = requestAnimationFrame(loop);
  }
  function kick() { if (!raf) { last = 0; raf = requestAnimationFrame(loop); } }
  document.addEventListener('visibilitychange', () => { if (document.hidden && raf) { cancelAnimationFrame(raf); raf = 0; } });

  // ---- 触る：押した位置から、押し込む向きにはずみ。長押し・引っぱりは指についてくる ----
  const toImg = (x, y) => [(x - view.ox) / view.s, (y - view.oy) / view.s];
  const hit = (ix, iy) => { let best = -1, bd = 1e9; CUPS.forEach((c, i) => { const d = Math.hypot((ix - c.c[0]) / 1.12, iy - c.c[1]); if (d < c.r * 1.15 && d < bd) { bd = d; best = i; } }); return best; };
  const ptrs = new Map();
  const stageEl = document.getElementById('stage');

  // ---- 寄り具合：ホイール／タッチパッドのピンチ／コントローラーの L・R／スマホの2本指。なめらかに追いつく ----
  const ZMIN = 1, ZMAX = 1.9;
  let zTarget = opt.zoom, zRaf = 0;
  const zoomBtns = [...document.querySelectorAll('[data-zoom]')];
  function setZoom(z, instant) {
    zTarget = Math.min(ZMAX, Math.max(ZMIN, z));
    zoomBtns.forEach(b => b.classList.toggle('on', Math.abs(+b.dataset.zoom - zTarget) < 0.06));
    if (instant) { opt.zoom = zTarget; layout(); return; }
    if (!zRaf) zRaf = requestAnimationFrame(zoomLoop);
  }
  function zoomLoop() {
    opt.zoom += (zTarget - opt.zoom) * 0.22;
    if (Math.abs(zTarget - opt.zoom) < 0.002) opt.zoom = zTarget;
    layout(); zRaf = opt.zoom === zTarget ? 0 : requestAnimationFrame(zoomLoop);
  }
  // ホイール（タッチパッドの2本指スクロール・ピンチ＝ctrl+ホイールも同じ）
  addEventListener('wheel', (e) => {
    e.preventDefault();
    const k = e.ctrlKey ? 0.01 : 0.0007;
    setZoom(zTarget * Math.exp(-e.deltaY * k));
  }, { passive: false });
  // コントローラー：L（LB/L1）で引く、R（RB/R1）で寄る。つながっている間だけ、軽く見に行く
  let padTimer = 0;
  const pollPad = () => {
    const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
    if (!pads.length) { clearInterval(padTimer); padTimer = 0; return; }
    for (const g of pads) {
      const L = (g.buttons[4] && g.buttons[4].pressed) || (g.buttons[6] && g.buttons[6].value > 0.3);
      const R = (g.buttons[5] && g.buttons[5].pressed) || (g.buttons[7] && g.buttons[7].value > 0.3);
      if (L) setZoom(zTarget / 1.025); if (R) setZoom(zTarget * 1.025);
    }
  };
  addEventListener('gamepadconnected', () => { if (!padTimer) padTimer = setInterval(pollPad, 33); });
  // スマホ：2本指でつまむと寄り具合。2本目が触れたら、つかみは離す
  const touches = new Map(); let pinch = null;
  const tdist = () => { const [a, b] = [...touches.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
  stageEl.addEventListener('pointerdown', (e) => {
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2) {
      pinch = { d0: tdist(), z0: zTarget };
      ptrs.forEach((g) => { P[g.i].grab = null; }); ptrs.clear();
    }
  }, true);
  stageEl.addEventListener('pointermove', (e) => {
    if (!touches.has(e.pointerId)) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && touches.size === 2) setZoom(pinch.z0 * tdist() / pinch.d0, true);
  }, true);
  const tup = (e) => { touches.delete(e.pointerId); if (touches.size < 2) pinch = null; };
  stageEl.addEventListener('pointerup', tup, true); stageEl.addEventListener('pointercancel', tup, true);

  const noteEl = document.querySelector('.note');
  stageEl.addEventListener('pointerdown', (e) => {
    noteEl.classList.add('off');   // 一番下のボタンに重ならないよう、触ったら操作の説明は消す
    if (pinch) return;
    const [ix, iy] = toImg(e.clientX, e.clientY);
    const bk = BTNS.findIndex((b, k) => !popped[k] && hitPart(b, ix, iy));
    if (bk >= 0) { popButton(bk); return; }
    const i = hit(ix, iy); if (i < 0) return;
    try { stageEl.setPointerCapture(e.pointerId); } catch (_) {}
    addHeat();
    const p = P[i], c = CUPS[i], amp = opt.amp * (1 + HEAT_PUSH * heatNow()) * lvNow().push;
    // 押し込み：押した所から中心へ向かう向き＋下へ。中心に近いほど縦に縮む
    const qx = c.c[0] - ix, qy = c.c[1] - iy; const L = Math.hypot(qx, qy) || 1;
    const near = 1 - Math.min(1, L / c.r);
    // 押す位置で変わる：上＝沈む／下＝跳ね上がる／横＝横へ振れて、もう片方にぶつかる／真ん中＝つぶれる
    const ux = qx / L, uy = qy / L, edge = 1 - near;            // 指から中心へ押し出す向き。ふちほど大きく動く
    const mag = 430 * amp * (0.3 + 0.7 * edge);
    const kx = ux * mag * 1.15, ky = uy * mag + 70 * amp, km = Math.hypot(kx, ky);
    // 揺れている最中は、ほぼ今の向きに乗せる（打ち消さない）。上限に近いほど押す力を弱める（張り付いて止まらない）
    const hh = heatNow(), lsNow = Math.max(6, Math.min(c.r * Math.min(0.56 + 0.2 * hh, 0.36 * opt.amp * (1 + HEAT_GAIN * hh)), 0.82 * dirLim(i, p.d[0] + restOf(i)[0], p.d[1] + restOf(i)[1], p.sy, p.sx) - Math.hypot(...restOf(i))));   // 余地は0にしない（マイナスだと押す力が暴れる）
    const room = Math.max(0.3, 1 - (Math.hypot(p.d[0], p.d[1]) / lsNow) ** 3);
    const sp = Math.hypot(p.v[0], p.v[1]), ride = Math.min(1, sp / 60);   // 揺れている最中は、今動いている向きにだけ足す（ブランコをこぐ要領）
    const pv1 = p.v[1];
    const kr = Math.max(km, 300 * amp);   // こぐ力は、押す位置によらずしっかり
    if (sp > 1) { p.v[0] += ((p.v[0] / sp) * kr * ride + kx * (1 - ride)) * room; p.v[1] += ((p.v[1] / sp) * kr * ride + ky * (1 - ride)) * room; }
    else { p.v[0] += kx; p.v[1] += ky; }
    const vm = 1500, vv = Math.hypot(p.v[0], p.v[1]); if (vv > vm) { p.v[0] *= vm / vv; p.v[1] *= vm / vv; }
    const o = P[1 - i], toward = Math.sign(CUPS[1 - i].c[0] - c.c[0]);
    if (ux * toward > 0.3) { o.v[0] += kx * 0.5; o.v[1] += ky * 0.25; o.svy -= 0.8 * amp; }   // 内へ押すと、もう片方にぶつかる
    const sqz = (s0) => { p.svy += (Math.abs(p.svy) > 1.5 ? Math.sign(p.svy) * Math.abs(s0) * 0.8 : s0) * room; };
    if (uy > 0) sqz(-(3.2 * near + 1.6 * uy * edge) * amp);      // 上・真ん中：縦につぶれる
    else {   // 下：はじかずに、手で持ち上げる（勢いではなく、じわっとかかる力）。離すと重さでたっぷり落ちる
      p.v[1] = pv1 + (p.v[1] - pv1) * ride; p.v[0] *= 0.6 + 0.4 * ride;
      p.lf = LIFT_T; p.lfA = LIFT_A * (amp / 1.95) * (0.55 + 0.45 * edge) * room * (1 - ride * 0.5); sqz(-0.8 * (-uy) * edge * amp); p.lift = 1;
    }
    ptrs.set(e.pointerId, { i, x0: e.clientX, y0: e.clientY, t0: performance.now() });
    kick();
  });
  stageEl.addEventListener('pointermove', (e) => {
    const g = ptrs.get(e.pointerId); if (!g) return;
    const dx = (e.clientX - g.x0) / view.s, dy = (e.clientY - g.y0) / view.s;
    if (!P[g.i].grab && (Math.hypot(dx, dy) > 6 || performance.now() - g.t0 > 220)) P[g.i].grab = { dx: 0, dy: 0 };
    if (P[g.i].grab) { P[g.i].grab.dx = dx; P[g.i].grab.dy = dy; }
    kick();
  });
  const up = (e) => {
    const g = ptrs.get(e.pointerId); if (!g) return; ptrs.delete(e.pointerId);
    const p = P[g.i]; if (p.grab) { p.grab = null; p.svy += 1.2 * opt.amp * (1 + HEAT_PUSH * heatNow()); }   // 離した瞬間の弾み
    kick();
  };
  stageEl.addEventListener('pointerup', up); stageEl.addEventListener('pointercancel', up);
})();
</script>
