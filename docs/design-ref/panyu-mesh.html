<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ぱにゅぱにゅ 触り比べ</title>
<style>
  :root { --ink: #0b0809; --ivory: #f3ece0; --muted: #c9bfb2; --gold: #d8b56c; --gold-hi: #f0d595; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--ivory); overflow: hidden;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  /* 呼吸：絵全体をゆっくり拡縮（合成だけで済むので、止まっている間も描き直しは起きない） */
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transform-origin: 50% 100%; animation: breath 3.6s ease-in-out infinite; }
  @keyframes breath { 50% { transform: scale(1.006, 1.01); } }
  @media (prefers-reduced-motion: reduce) { #gl { animation: none; } }
  .bar { position: fixed; left: 0; right: 0; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    padding: 8px max(12px, env(safe-area-inset-left)); background: linear-gradient(180deg, rgba(8,4,6,.82), rgba(8,4,6,0)); }
  .grp { display: flex; align-items: center; gap: 6px; }
  .grp > span { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  .bar button { min-height: 44px; min-width: 44px; padding: 0 14px; border: 1px solid rgba(243,236,224,.28); border-radius: 2px;
    background: rgba(12,9,10,.72); color: var(--ivory); font: 700 14px/1 inherit; font-family: inherit; cursor: pointer; }
  .bar button.on { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #1a1206; border-color: var(--gold-hi); }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .grp b { font-size: 16px; color: var(--gold-hi); min-width: 2.4em; text-align: center; }
  .note { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; font-size: 13px; color: var(--muted);
    background: rgba(8,4,6,.6); padding: 6px 14px; border-radius: 2px; white-space: nowrap; pointer-events: none; transition: opacity .4s; }
  .note.off { opacity: 0; }
  .err { position: fixed; inset: 0; display: none; place-items: center; z-index: 9; font-size: 15px; padding: 24px; text-align: center; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="fx"></canvas></div>
<div class="bar">
  <div class="grp"><span>構図</span><button data-zoom="1">今</button><button data-zoom="1.28" class="on">寄り</button><button data-zoom="1.5">もっと寄り</button></div>
  <div class="grp" id="outfits"><span>衣装</span></div>
  <div class="grp"><span id="lvName">ボタン</span><b id="lv">0/3</b><button id="btnReset">戻す</button></div>
</div>
<div class="note">押す・連打・長押し・引っぱる・お腹のボタン／寄り具合：ホイール・ピンチ・L/R</div>
<div class="err" id="err">この端末では試作を表示できませんでした（WebGL が使えません）</div>

  const OUTFITS = {

    pajama: { name: 'パジャマ', img: 'panyu_pajama_reach.webp', kind: 'front', feel: { k: 0.7, c: 0.66, ks: 0.72, cs: 0.75, sq: 1.15, kc: 1.1, push: 0.95 }, label: 'ボタン', what: '胸の下のボタン',   // サテン：ゆるく、ふわっと大きく長く揺れる

      pose: { mass: [0.5, 0.72], cups: [[622, 632, 126], [852, 596, 136]],   /* 寝転んだ胸はひとかたまりで揺れる（付け根も動き、中心付近は同じ大きさで動く） */ keep: [[480, 712, 92, 62], [930, 735, 110, 48], [640, 794, 250, 42]],   /* 動かさない所：手前の手・右の胸の下の腕・胸の下を横切る腕 */   /* 動かさない所：手前の手・右の腕・胸の下を横切る腕 */ cheek: [[480, 312], [628, 272]], eyes: [[465, 280], [595, 232]], faceR: [400, 140, 300, 270], faceC: [550, 280, 128, 108], blushC: [552, 292, 120, 58], head: [550, 330, 400], focus: [740, 600], surprise: 'panyu_pajama2_surprise_face.webp' } },

      parts: [{ c: [699, 649], w: 36, h: 36, round: 1 }, { c: [699, 691], w: 36, h: 36, round: 1 }, { c: [700, 757], w: 80, h: 64, rect: 1 }],
      covers: [[699, 649, 21, 21], [699, 691, 21, 21], [700, 757, -46, 38]],   // バックルの跡はベルトの続きで埋まる（横に鏡写し）
      gap: { gx: 700, gy: 632, ends: [632, 670, 708, 800], lin: [0.55, 0.06, 0.09], lin2: [0.25, 0.02, 0.04], line: [0.12, 0.02, 0.03] } },
    bikini: { name: '水着', img: 'panyu_bikini_reach.webp', kind: 'strap', ring: 1, feel: { k: 1.4, c: 0.92, ks: 1.45, cs: 0.9, sq: 1.25, kc: 0.85, push: 1.1 }, label: '留め', what: '肩紐と胸のリング',   // 伸びる生地：速く、ぷるんと細かく戻る
      parts: [{ a: [581, 536], b: [621, 458] }, { a: [825, 536], b: [786, 458] }, { c: [702, 655], w: 28, h: 28, ring: 1 }], covers: [], gap: null },
    dress: { name: 'ドレス', img: 'panyu_dress_reach.webp', kind: 'strap', feel: { k: 0.92, c: 0.8, ks: 0.9, cs: 0.85, sq: 1.0, kc: 1.35, push: 1.0 },   // シルク：しなやか。左右がつられて一緒に揺れる
      label: '留め', sw: [5.0, 6.8, 7.8], what: '肩紐と胸元の宝石',
      parts: [{ a: [570, 512], b: [598, 446] }, { a: [832, 512], b: [810, 446] }, { c: [700, 672], w: 56, h: 70 }],
      covers: [null, null, [700, 690, 28, 56]],   // 宝石と下の雫まで
      gap: { gx: 700, gy: 638, ends: [638, 638, 638, 760], lin: [0.6, 0.08, 0.12], lin2: [0.28, 0.03, 0.06], line: [0.12, 0.03, 0.05] } },
  };
  // 外れた部品の飛び方：vx/vy＝横と上への勢い（範囲）、g＝重さ、spin＝回る速さ、bounce＝画面の下で弾む強さ、shake＝画面が揺れる強さ、spark＝きらめきの色と数
  const FLY = { vx: [260, 480], vy: [700, 960], g: 2400, spin: [9, 17], life: 1.6, bounce: 0, shake: 0, spark: '#ffe9a8', n: 16 };
  OUTFITS.pajama.fly = { vx: [150, 300], vy: [950, 1200], g: 2700, spin: [16, 26], life: 2.4, bounce: 0.55, spark: '#fff1f5', n: 12 };   // 軽いボタンがぽんっと高く跳ね、下で弾む
  OUTFITS.santa.fly = { vx: [200, 320], vy: [480, 640], g: 3000, spin: [6, 10], life: 1.6, bounce: 0.3, spark: '#ffd98a', n: 14, shake: 2 };   // 金ボタンは重く、短く飛ぶ
  OUTFITS.santa.parts[2].fly = { vx: [40, 90], vy: [120, 200], g: 3300, spin: [2, 4], life: 1.8, bounce: 0.22, spark: '#ffd98a', n: 22, shake: 10 };   // バックルはどすんと落ちる
  OUTFITS.bikini.fly = { vx: [220, 380], vy: [950, 1200], g: 2500, spin: [18, 28], life: 1.9, bounce: 0.4, spark: '#ffe9a8', n: 14, shake: 3 };   // リングは高く回る
  OUTFITS.bikini.strapShake = 4;
  Object.assign(OUTFITS.bunny.gap, { flap: [0.12, 1.8], wk: 1, spring: 0 });
  Object.assign(OUTFITS.pajama.gap, { flap: [0.42, 6.5], wk: 1.25, spring: 0, gx: 706, gy: 606, fabY: 650, ramp: 36, vk: [0.75, 0.75, 0], ct: [0, 0], shift: 4, skin: [665, 462, 740, 500], wide: 2.1, gyB: 598, rampB: 64, bkSkin: 1, bkGain: [1.02, 1.14, 1.18],   /* ボタンが外れると服が大きく開く */   /* ボタンが外れると、V字の先の襟の重なりも左右に離れる */   /* V字の中は引き伸ばさない（網目で胸が動くだけ）。開くのはV字の先から下 */ ends: [606, 700, 758, 830] });   // 一番上のボタンの所でつながらない（V字からそのまま開く）   // やわらかい前立てが外へ大きくめくれ、裏地のサテンが幅広くのぞく

  OUTFITS.pajama2.fly = OUTFITS.pajama.fly;
  OUTFITS.pajama.outK = OUTFITS.pajama2.outK = 0.5; OUTFITS.pajama.downK = OUTFITS.pajama2.downK = 1.4;   // やわらかいパジャマは左右へは開きすぎず（胸の間の布と肌が横に伸びない）、下へ垂れる
  Object.assign(OUTFITS.santa.gap, { flap: [0.16, 2.6], wk: 1.05, spring: 1 });     // ベルトが弾けて、一度開きすぎてから戻る
  Object.assign(OUTFITS.dress.gap, { flap: [0.22, 3.2], wk: 1.4, spring: 0, gy: 637, fabY: 637, ramp: 10, vk: [0.5, 0.5, 0], ct: [-4, 0], skin: [640, 465, 760, 500], ends: [637, 637, 637, 760] });     // 身頃が大きく左右に分かれる
  OUTFITS.dress.fly = { vx: [180, 300], vy: [820, 1000], g: 2500, spin: [8, 13], life: 1.8, bounce: 0.3, spark: '#ff7a8a', n: 22, shake: 3 };   // 宝石は赤くきらめく
  OUTFITS.dress.strapShake = 2; OUTFITS.dress.ropeLen = 0.8; OUTFITS.dress.ropeDrape = 1; OUTFITS.dress.ropeG = 5200; OUTFITS.dress.ropeDamp = 0.955; OUTFITS.dress.ropeKick = 0.35;   // サテンの太い紐は重い：すとんと落ちて、揺れはすぐ収まる   // 外れた紐は胸の丸みに沿って外へ垂れる（腕の上までは届かない長さ）
  OUTFITS.dress.fold = { apex: [[570, 522], [832, 522]], neck: [[0.796, 0.606], [-0.796, 0.606]], out: [[-0.716, 0.698], [0.716, 0.698]], len: 30 };   // 肩紐が外れると、角が内側へ折れ返って垂れる
  const qc = new URLSearchParams(location.search).get('c'), OUTFIT = OUTFITS[qc] ? qc : 'bunny', OF = OUTFITS[OUTFIT];
  const STRAP = OF.kind === 'strap', BIKINI = OUTFIT === 'bikini';
  const IMG = '../../assets/characters/' + OF.img;
  const PZ = OF.pose || { cups: [[607, 600, 132], [795, 600, 132]], cheek: [[636, 324], [764, 324]], eyes: [[640, 281], [762, 281]], faceR: [560, 170, 290, 250], faceC: [701, 315, 118, 92], blushC: [699, 322, 120, 56], head: [701, 330, 400], focus: [701, 548], surprise: 'panyu_surprise_face.webp' };   // 構図（今までの5着は共通）
  const CUPS = PZ.cups.map(([x, y, r]) => ({ c: [x, y], r, r0: r }));
  const CHEEK = PZ.cheek;
  const EYES = PZ.eyes;   // 目の中心（驚いた時に少し開く）
  // お腹のボタン（金のひし形・上から大中小）。外れるごとに揺れのレベルが上がる
  // 水着は：左の肩紐（カップの角の留め輪→首の方。見えている所だけ）、右の肩紐、胸の真ん中の金のリング
  const BTNS = OF.parts;
  const segD = (p, a, b) => { const ab = [b[0] - a[0], b[1] - a[1]], t = Math.max(0, Math.min(1, ((p[0] - a[0]) * ab[0] + (p[1] - a[1]) * ab[1]) / (ab[0] ** 2 + ab[1] ** 2))); return Math.hypot(p[0] - a[0] - ab[0] * t, p[1] - a[1] - ab[1] * t); };
  const hitPart = (b, ix, iy) => b.a ? segD([ix, iy], b.a, b.b) < 10 : Math.abs(ix - b.c[0]) < Math.max(26, b.w * 0.7) && Math.abs(iy - b.c[1]) < Math.max(24, b.h * 0.65);
  const COVERS = [0, 1, 2].map(k => OF.covers[k] || [0, 0, 1, 1]);   // 1つ目は飾り石の下（両脇の小さいひし形・大きいひし形・下の玉）   // 外れた金具を隠す範囲（中心・半分の幅・半分の高さ。飾りまで含めて測った）
  // out/down＝止まる位置が外・下へずれる量、kx＝横のばねの硬さ、lx＝外へ揺れられる幅の上乗せ
  const LV = [{ push: 1, damp: 1, rs: 1, out: 0, down: 0, sag: 1, kx: 1, lx: 0 }, { push: 1.2, damp: 0.86, rs: 1.04, out: 14, down: 10, sag: 1.04, kx: 0.82, lx: 4 },
    { push: 1.4, damp: 0.74, rs: 1.08, out: 28, down: 20, sag: 1.08, kx: 0.66, lx: 8 }, { push: 1.65, damp: 0.62, rs: 1.12, out: 66, down: 31, sag: 1.12, kx: 0.5, lx: 12 }];
  const popped = [false, false, false];
  const lvNow = () => LV[popped.filter(Boolean).length];
  // 止まる位置。水着は左右別々：肩紐が外れた側は支えを失って下へ垂れ、リングが外れると左右へ大きく開く
  const restOf = (i) => {
    if (STRAP) { const s = popped[i] ? 1 : 0, g = popped[2] ? 1 : 0; return [(i === 0 ? -1 : 1) * (s ? 8 + 52 * g : -6 + 46 * g), s ? 22 + 12 * g : -36 + 8 * g]; }   // 肩紐があるうちは上・内へ引き上げられている
    const l = lvNow(); return [(i === 0 ? -1 : 1) * l.out * (OF.outK || 1), l.down * (OF.downK || 1)];   // 衣装ごとに、左右へ開く量と下へ垂れる量を変える
  };   // 頬（赤らむ所）
  const sagOf = (i) => STRAP ? (popped[i] ? 1.12 : 0.9) + (popped[2] ? 0.03 : 0) : lvNow().sag;
  const FOCUS = PZ.focus;          // 寄せる時の注目点（胸の少し上）
  const cv = document.getElementById('gl');
  const gl = cv.getContext('webgl', { antialias: true, alpha: false, premultipliedAlpha: false });
  if (!gl) { document.getElementById('err').style.display = 'grid'; return; }

  // ---- 設定（ボタンで切り替え） ----
  const opt = { mode: 'mesh', zoom: 1.28, amp: 1.95 };   // 動きは網目＋ばねだけ、揺れは1.95が標準（2026-10-12 決定）
  const ob = document.getElementById('outfits');
  Object.entries(OUTFITS).forEach(([k, o]) => { const b = document.createElement('button'); b.textContent = o.name; b.classList.toggle('on', k === OUTFIT); b.addEventListener('click', () => { if (k !== OUTFIT) location.search = k === 'bunny' ? '' : '?c=' + k; }); ob.appendChild(b); });
  document.getElementById('lvName').textContent = OF.label; document.querySelector('.note').textContent = '押す・連打・長押し・引っぱる・' + OF.what + '／寄り具合：ホイール・ピンチ・L/R';
  document.querySelectorAll('.bar button[data-mode], .bar button[data-zoom], .bar button[data-amp]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.mode ? 'mode' : b.dataset.zoom ? 'zoom' : 'amp';
    if (k === 'zoom') { setZoom(+b.dataset.zoom); return; }
    opt[k] = k === 'mode' ? b.dataset.mode : +b.dataset[k];
    b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    resetPhys(); layout(); kick();
  }));

  // ---- シェーダー：画像の座標で網目を置き、胸の範囲だけをずらす ----
  const VS = `
    attribute vec2 aP;
    uniform vec2 uImg, uOff, uView; uniform float uScale, uDisc;
    uniform vec2 uC0, uC1, uD0, uD1, uS0, uS1; uniform float uR0, uR1, uSpread, uSurp;
    uniform vec2 uE0, uE1; uniform vec3 uHead; uniform vec2 uMass; uniform vec4 uK0, uK1, uK2;
    float keep1(vec2 p, vec4 k) { if (k.z <= 0.0) return 0.0; return 1.0 - smoothstep(0.55, 1.0, length((p - k.xy) / k.zw)); }
    varying vec2 vUV, vPix; varying float vLit;
    vec3 cup(vec2 p, vec2 c, float r, vec2 d, vec2 s) {
      vec2 q = p - c;
      float rr = length(q / (vec2(r * 1.12, r) * uSpread));
      float w, a;
      if (uDisc > 0.5) { w = 1.0 - smoothstep(0.78, 1.0, rr); a = 1.0; }      // 今に近い：丸い板が丸ごと動く
      else {
