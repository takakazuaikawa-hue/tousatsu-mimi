<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ホーム v11 見本</title>
<!-- ホームの見本 v11（2026-10-05）。v10「センスなさすぎ」を受けて、名作のホーム画面を調べ直してから組み直した。
     参考にしたもの（何を学んだか）
     ・Reverse: 1999 のホーム … 主役の人物を1人だけ大きく（頭から腿まで）。背景は暗く沈めて人物を立たせる。
       行き先のボタンを「その世界の物」として作る（入場券・ポスター・スケッチ）。いちばん大事な行き先が、いちばん大きく、いちばん色がある。
       小さな行き先は、細い線の絵と名前だけを画面の端に（箱で囲まない）。字は時代に合った明朝・セリフ体を1種類
     ・Reverse: 1999 の物語の選択 … 章を「ポスター」として見せる
     ・GIRLS' FRONTLINE 2 … 背景を被写界深度でぼかし、人物だけをくっきり
     ・ペルソナ5／メタファー … 文字と形そのものを世界の顔にする（決まった図柄を全画面で繰り返す）
     この作品の「世界の物」＝トランプ。だからホームの道具立てを札にする：
     ・いちばん大事な行き先「今夜の卓」＝これから取りに行く1枚（K♥）。手札から抜き出して大きく、金の「卓へ」を添える
     ・進み具合＝ロイヤルフラッシュの手札（右下の扇）。勝った札は表、まだの札は裏、今夜の1枚の所は空き
     ・リコ先輩の要点＝札にクリップで留めた手書きのメモ
     ・行ける所（交換所など）＝左の端に、細い金の線の絵と明朝の名前だけ
     ・主役＝ミミ1人を大きく。大時計を後光のように背負う。背景（大広間）はぼかして沈める
     ?hero=rico でリコ先輩（今の衣装）を主役に（設定で選べる想定）。?state=first|early|mid|last|clear、?event=first|unlock -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..700&family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@500;600;700;800&display=swap">
<style>
  :root {
    --k: 1;
    --bx: 0px;
    --fs-caption: max(14px, calc(11px / var(--k)));
    --fs-label: max(16px, calc(13px / var(--k)));
    --fs-body: max(20px, calc(14px / var(--k)));
    --fs-lead: max(24px, calc(16px / var(--k)));
    --fs-title: max(30px, calc(20px / var(--k)));
    --fs-num: max(34px, calc(19px / var(--k)));
    --tap: max(48px, calc(44px / var(--k)));
    --el: calc(max(30px, env(safe-area-inset-left, 0px) / var(--k) + 14px) - var(--bx));
    --er: calc(max(30px, env(safe-area-inset-right, 0px) / var(--k) + 14px) - var(--bx));

    --ink: #0a0608;
    --ivory: #f5eee2;
    --muted: #cbbfae;
    --dim: #8f8273;
    --gold: #cfa862;
    --gold-hi: #f1d89e;
    --gold-deep: #8b6a2f;
    --heart: #c3132f;
    --paper: #f6efe2;
    --serif-jp: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --serif: "Bodoni Moda", "Shippori Mincho B1", serif;
    --hand: "Klee One", "Shippori Mincho B1", serif;
    --sans: "Noto Sans JP", "Hiragino Sans", sans-serif;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #080507; }
  body { font-family: var(--sans); color: var(--ivory); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: inherit; }
  svg { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 4px; }
  .jp { word-break: auto-phrase; line-break: strict; text-wrap: pretty; }
  .nb { white-space: nowrap; }
  .stage { position: fixed; left: 50%; top: 50%; width: 1280px; height: 800px; overflow: visible; isolation: isolate;
    transform: translate(-50%, -50%) scale(var(--k)); transform-origin: center; }

  /* ===== 背景：大広間を被写界深度でぼかし、沈める（人物だけを立たせる） ===== */
  .bg { position: absolute; left: -357px; top: 0; width: 1886px; height: 800px; pointer-events: none;
    background: url('../../assets/backgrounds/home_hall_blur.webp') 0 0 / 100% 100% no-repeat; filter: brightness(.74) saturate(.95) contrast(1.05); }
  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #080507 0, rgba(8, 5, 7, 0) 60px, rgba(8, 5, 7, 0) calc(100% - 60px), #080507 100%); }
  .grade { position: absolute; top: 0; bottom: 0; left: calc(-1 * var(--bx)); right: calc(-1 * var(--bx)); pointer-events: none; background:
      radial-gradient(70% 82% at 52% 42%, rgba(8, 4, 6, 0) 50%, rgba(8, 4, 6, .55) 100%),
      linear-gradient(90deg, rgba(8, 4, 6, .74) 0, rgba(8, 4, 6, .3) 300px, rgba(8, 4, 6, 0) 420px),
      linear-gradient(0deg, rgba(8, 4, 6, .62) 0, rgba(8, 4, 6, 0) 26%),
      linear-gradient(180deg, rgba(8, 4, 6, .55) 0, rgba(8, 4, 6, 0) 16%); }
  /* 大時計が主役の後ろで後光になる。光は右（VIP の扉）から */
  .halo { position: absolute; left: 672px; top: 250px; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(circle, rgba(255, 220, 160, .3) 0%, rgba(255, 200, 130, .12) 38%, rgba(255, 200, 130, 0) 66%); animation: halo 7s ease-in-out infinite alternate; }
  @keyframes halo { from { opacity: .75; transform: scale(.97); } to { opacity: 1; transform: scale(1.03); } }
  .door { position: absolute; left: 1042px; top: 200px; width: 360px; height: 520px; margin: -260px 0 0 -180px; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(22% 46% at 50% 50%, rgba(255, 232, 178, .42), rgba(255, 210, 140, .12) 46%, rgba(255, 200, 120, 0) 74%); animation: door 4.6s ease-in-out infinite alternate; }
  @keyframes door { from { opacity: calc(var(--vip, .8) * .5); } to { opacity: var(--vip, .8); } }

  /* ===== 主役：1人を大きく（頭から腿まで）。縁に暖かい光、背景から浮かせる影。ごく小さく呼吸 ===== */
  .hero { position: absolute; left: 169px; top: 3px; width: 984px; height: 1475px; pointer-events: none; }
  .hero .breath { position: absolute; inset: 0; transform-origin: 50% 54%; animation: breath 5.2s ease-in-out infinite alternate; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%;
    filter: drop-shadow(1.5px 0 0 rgba(255, 222, 170, .38)) drop-shadow(-1px 0 0 rgba(255, 190, 150, .14)) drop-shadow(0 0 30px rgba(6, 2, 4, .55)); }
  @keyframes breath { from { transform: translateY(0) scale(1); } to { transform: translateY(-3px) scale(1.004); } }
  .fore { position: absolute; top: 0; bottom: 0; left: calc(-1 * var(--bx)); right: calc(-1 * var(--bx)); pointer-events: none;
    background: linear-gradient(0deg, rgba(8, 4, 6, .6) 0, rgba(8, 4, 6, .22) 14%, rgba(8, 4, 6, 0) 30%); }
  .hero-hit { position: absolute; left: 470px; top: 60px; width: 380px; height: 740px; border-radius: 40% 40% 0 0; }
  .hero.is-rico { left: 120px; top: 6px; width: 1070px; height: 1427px; }
  .hero-hit.is-rico { left: 430px; width: 420px; }
  .in-hero { animation: heroIn 1.1s var(--ease) both; }
  @keyframes heroIn { from { opacity: 0; transform: translateX(-26px); } }

  /* 前景のぼけ：手前に光の粒（奥行き） */
  .bokeh { position: absolute; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(circle, rgba(255, 220, 160, .55), rgba(255, 220, 160, 0) 68%); filter: blur(2px); animation: drift var(--d) ease-in-out var(--dl) infinite alternate; }
  @keyframes drift { from { transform: translate(0, 0); opacity: var(--o1); } to { transform: translate(var(--dx), var(--dy)); opacity: var(--o2); } }

  /* ===== 左上：今の話（劇場の看板のように） ===== */
  .marquee { position: absolute; left: var(--el); top: 26px; display: grid; gap: 4px; }
  .mq-eye { font-family: var(--serif); font-size: var(--fs-caption); letter-spacing: .42em; color: var(--gold); font-weight: 500; display: flex; align-items: center; gap: .9em; }
  .mq-eye::before { content: ""; width: 34px; height: 1px; background: linear-gradient(90deg, rgba(207, 168, 98, 0), var(--gold)); }
  .mq-eye b { font-weight: 700; color: var(--gold-hi); letter-spacing: .2em; }
  .mq-title { font-family: var(--serif-jp); font-weight: 800; font-size: max(40px, calc(22px / var(--k))); letter-spacing: .1em; line-height: 1.15; text-shadow: 0 2px 18px rgba(0, 0, 0, .7); }
  .mq-sub { font-family: var(--serif-jp); font-weight: 600; font-size: var(--fs-label); letter-spacing: .1em; color: var(--muted); text-shadow: 0 1px 10px rgba(0, 0, 0, .9); }
  .mq-sub::before { content: "この卓で覚えること　"; color: var(--gold); font-size: .86em; }
  .mq-sub.is-free::before { content: ""; }

  /* ===== 右上：コインと設定（箱で囲まない） ===== */
  .purse { position: absolute; right: var(--er); top: 22px; display: flex; align-items: center; gap: 18px; }
  .coins { display: flex; align-items: center; gap: .55em; }
  .coins img { width: calc(var(--fs-num) * 1.05); height: calc(var(--fs-num) * 1.05); object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .5)); }
  .coins b { font-family: var(--serif); font-weight: 600; font-size: var(--fs-num); font-variant-numeric: lining-nums; color: var(--gold-hi); line-height: 1; letter-spacing: .02em; text-shadow: 0 2px 14px rgba(0, 0, 0, .6); }
  .coins small { font-family: var(--serif); font-size: var(--fs-caption); letter-spacing: .32em; color: var(--muted); align-self: flex-end; padding-bottom: .3em; }
  .gear { width: var(--tap); height: var(--tap); border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(241, 216, 158, .38); color: var(--gold-hi); background: rgba(10, 6, 8, .35); }
  .gear svg { width: 46%; height: 46%; stroke-width: 1.4; }
  .gear:hover { border-color: var(--gold-hi); background: rgba(10, 6, 8, .55); }

  /* ===== 左：行ける所（細い金の線の絵と明朝の名前だけ。箱で囲まない） ===== */
  .places { position: absolute; left: var(--el); top: 148px; display: grid; gap: 8px; }
  .place { position: relative; display: grid; grid-template-columns: calc(var(--fs-label) * 2.6) auto; column-gap: 12px; align-items: center; min-height: var(--tap); padding: 4px 10px 4px 0; }
  .place .pi { width: calc(var(--fs-label) * 2.6); height: calc(var(--fs-label) * 2.6); display: grid; place-items: center; color: var(--gold-hi); border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, rgba(241, 216, 158, .14), rgba(241, 216, 158, 0) 70%); transition: transform .25s var(--ease), filter .25s ease; }
  .place .pi svg { width: 68%; height: 68%; stroke-width: 1.3; }
  .place .pt { display: grid; gap: 1px; }
  .place b { font-family: var(--serif-jp); font-weight: 700; font-size: var(--fs-lead); letter-spacing: .1em; line-height: 1.25; text-shadow: 0 2px 12px rgba(0, 0, 0, .8); white-space: nowrap; }
  .place small { font-size: var(--fs-caption); color: var(--muted); letter-spacing: .04em; line-height: 1.35; text-shadow: 0 1px 8px rgba(0, 0, 0, .9); white-space: nowrap; }
  .place small em { font-style: normal; color: var(--gold-hi); }
  .place .new { position: absolute; left: calc(var(--fs-label) * 2.1); top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--heart); box-shadow: 0 0 0 2px #1a0d10, 0 0 10px rgba(195, 19, 47, .8); }
  .place:hover .pi { transform: scale(1.08); filter: drop-shadow(0 0 8px rgba(241, 216, 158, .6)); }
  .place:hover b { color: var(--gold-hi); }
  .place.is-locked b, .place.is-locked .pi { opacity: .5; }

  /* ===== 右：手札（ロイヤルフラッシュ）と、今夜の1枚 ===== */
  .card { position: absolute; width: 124px; height: 174px; border-radius: 9px; transform-origin: 50% 50%;
    background: linear-gradient(160deg, #fcf8ef 0%, #f2e8d4 100%); box-shadow: 0 12px 24px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(90, 60, 20, .28); }
  .card::before { content: ""; position: absolute; inset: 6px; border-radius: 5px; border: 1px solid rgba(166, 128, 66, .55); pointer-events: none; }
  .card .ix { position: absolute; left: 9px; top: 8px; display: grid; justify-items: center; font-family: var(--serif); font-weight: 700; font-size: 23px; line-height: .92; color: var(--heart); z-index: 2; }
  .card .ix i { font-style: normal; font-size: 17px; font-family: var(--sans); }
  .card .ix.b { left: auto; top: auto; right: 9px; bottom: 8px; transform: rotate(180deg); }
  .card .win { position: absolute; left: 22px; right: 22px; top: 20px; bottom: 20px; border-radius: 40px 40px 6px 6px / 34px 34px 6px 6px; overflow: hidden; border: 1px solid rgba(166, 128, 66, .7); background: #2a1a1e; }
  .card .win img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
  .card.is-back { background: #1b1015 url('../../assets/ui/card_back_default.webp') center / cover; box-shadow: 0 12px 24px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(207, 168, 98, .35); }
  .card.is-back::before, .card.is-ghost::before { display: none; }
  .card.is-ghost { background: rgba(241, 216, 158, .05); box-shadow: none; border: 1.5px dashed rgba(241, 216, 158, .5); }
  .card.is-ghost::after { content: "今夜の1枚"; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--serif-jp); font-weight: 700; font-size: 15px; letter-spacing: .1em; color: rgba(241, 216, 158, .75); writing-mode: vertical-rl; }
  .fan { position: absolute; left: var(--el); bottom: 0; width: 430px; height: 262px; }
  .fan-label { position: absolute; left: var(--el); top: 540px; text-align: left; font-family: var(--serif); font-size: var(--fs-caption); letter-spacing: .4em; color: var(--gold); text-shadow: 0 1px 10px rgba(0, 0, 0, .9); }
  .fan-label b { display: block; font-family: var(--serif-jp); font-size: var(--fs-label); letter-spacing: .12em; color: var(--ivory); font-weight: 700; margin-top: 2px; }
  .deal { animation: deal .7s var(--ease) both; animation-delay: var(--dd, 0s); }
  @keyframes deal { from { opacity: 0; translate: 60px 90px; } }

  /* 今夜の1枚：手札から抜き出して大きく。金の縁が光る */
  .col { position: absolute; right: var(--er); top: 86px; width: 340px; display: flex; flex-direction: column; align-items: center; z-index: 3; }
  .tonight { position: relative; width: 214px; height: 300px; transform: rotate(-3deg); }
  .tonight .card { width: 214px; height: 300px; border-radius: 13px; left: 0; top: 0;
    box-shadow: 0 0 0 2px rgba(241, 216, 158, .95), 0 0 46px rgba(241, 200, 120, .45), 0 24px 40px rgba(0, 0, 0, .55); }
  .tonight .card::before { inset: 9px; border-radius: 7px; }
  .tonight .card .ix { font-size: 36px; left: 14px; top: 12px; }
  .tonight .card .ix i { font-size: 26px; }
  .tonight .card .ix.b { display: none; }
  .tonight .card .win { left: 30px; right: 30px; top: 28px; bottom: 76px; border-radius: 74px 74px 8px 8px / 60px 60px 8px 8px; }
  .tonight .card .nm { position: absolute; left: 16px; right: 16px; bottom: 20px; text-align: center; color: #2a1712; }
  .tonight .card .nm b { display: block; font-family: var(--serif-jp); font-weight: 800; font-size: 25px; letter-spacing: .12em; line-height: 1.15; }
  .tonight .card .nm small { display: block; font-family: var(--serif); font-size: 11px; letter-spacing: .38em; color: #8b6a2f; margin-top: 3px; }
  .tonight .card::after { content: ""; position: absolute; inset: 0; border-radius: 13px; pointer-events: none;
    background: linear-gradient(115deg, rgba(255, 255, 255, 0) 40%, rgba(255, 255, 255, .55) 50%, rgba(255, 255, 255, 0) 60%) -120% 0 / 250% 100% no-repeat; animation: sheen 6s ease-in-out 2s infinite; }
  @keyframes sheen { 0% { background-position: -120% 0; } 22%, 100% { background-position: 220% 0; } }
  .lift { animation: lift 1s var(--ease) .9s both; }
  @keyframes lift { from { opacity: 0; transform: translate(-60px, 260px) rotate(-14deg) scale(.6); } }
  /* 札の右上に「今夜の卓」の赤い帯 */
  .eye-tonight { position: absolute; right: -10px; top: 26px; z-index: 3; padding: .3em .9em .3em 1em; font-family: var(--serif-jp); font-weight: 800; font-size: var(--fs-caption); letter-spacing: .24em; color: #fff4dc;
    background: linear-gradient(180deg, #d42a44, #9c0f26); box-shadow: 0 4px 10px rgba(0, 0, 0, .4); clip-path: polygon(8px 0, 100% 0, 100% 100%, 8px 100%, 0 50%); }

  /* リコ先輩のメモ：今夜の1枚に金のクリップで留めた手書き */
  .memo { position: relative; width: 100%; margin-bottom: 26px; padding: 14px 20px 12px; transform: rotate(-2deg); color: #3a2418; z-index: 2;
    background: linear-gradient(175deg, #fbf3e3, #efe2c8); border-radius: 3px; box-shadow: 0 14px 28px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(120, 80, 30, .18); }
  .memo::before { content: ""; position: absolute; left: 50%; margin-left: 8px; bottom: -22px; width: 12px; height: 40px; border-radius: 6px;
    background: linear-gradient(90deg, #f7dea0, #b98a3c); box-shadow: 0 2px 4px rgba(0, 0, 0, .35); transform: rotate(-3deg); }
  .memo p { font-family: var(--hand); font-weight: 600; font-size: var(--fs-label); line-height: 1.6; letter-spacing: .02em; }
  .memo p em { font-style: normal; color: #a3122c; background: linear-gradient(transparent 62%, rgba(195, 19, 47, .16) 62%); }
  .memo .sig { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 6px; font-family: var(--hand); font-size: var(--fs-caption); color: #7a5a3a; }
  .memo .sig img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; object-position: 50% 25%; border: 1px solid rgba(139, 106, 47, .6); }
  .memo-in { animation: memoIn .8s var(--ease) 1.5s both; }
  @keyframes memoIn { from { opacity: 0; transform: translate(20px, -10px) rotate(-12deg); } }

  /* 金の「卓へ」：今夜の1枚の下に。押すのはここ（札そのものも押せる） */
  .go { position: relative; margin-top: 22px; width: 240px; height: max(62px, calc(48px / var(--k))); border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: .5em;
    font-family: var(--serif-jp); font-size: var(--fs-lead); font-weight: 800; letter-spacing: .32em; padding-left: .32em; color: #1f1407;
    background: linear-gradient(180deg, #fbe7b0 0%, #e2bd6c 48%, #b98a3c 100%); box-shadow: 0 0 0 1px rgba(255, 240, 200, .6) inset, 0 12px 30px rgba(207, 160, 80, .35), 0 4px 10px rgba(0, 0, 0, .4); }
  .go svg { width: .9em; height: .9em; stroke-width: 2.2; }
  .go:hover { filter: brightness(1.06); }
  .go:active { transform: translateY(1px); }
  .prize { position: relative; margin-top: 10px; width: 100%; text-align: center; font-size: var(--fs-caption); color: var(--muted); letter-spacing: .06em; text-shadow: 0 1px 10px rgba(0, 0, 0, .9); }
  .prize b { font-family: var(--serif); font-size: var(--fs-label); font-weight: 700; color: var(--gold-hi); }
  .go-in { animation: goIn .7s var(--ease) 1.4s both; }
  @keyframes goIn { from { opacity: 0; transform: translateY(12px); } }

  /* 押した時だけ出る吹き出し */
  .bubble { position: absolute; max-width: 360px; padding: 12px 18px 14px; border-radius: 14px; background: rgba(250, 244, 233, .96); color: #2a1a1e; z-index: 8;
    box-shadow: 0 12px 30px rgba(0, 0, 0, .45); font-size: var(--fs-body); line-height: 1.55; transition: opacity .3s ease, transform .4s var(--ease); }
  .bubble small { display: block; font-size: var(--fs-caption); font-weight: 700; letter-spacing: .14em; color: #a0753a; margin-bottom: 2px; }
  .bubble::after { content: ""; position: absolute; right: 44px; bottom: -8px; width: 18px; height: 18px; background: inherit; transform: rotate(45deg); border-radius: 3px; }
  .bubble.is-hide { opacity: 0; transform: translateY(6px); pointer-events: none; }
  .bubble-hero { left: 330px; top: 92px; }

  /* ===== 真ん中の知らせ（紙の札の上に） ===== */
  .notice { position: absolute; top: 0; bottom: 0; left: calc(-1 * var(--bx)); right: calc(-1 * var(--bx)); z-index: 20; display: grid; place-items: center;
    background: rgba(5, 2, 4, .7); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fadeIn .4s ease both; }
  .notice[hidden] { display: none; }
  .ncard { position: relative; width: 660px; padding: 34px 44px 30px; border-radius: 16px; text-align: center; color: #2a1712;
    background: linear-gradient(170deg, #fcf7ec, #efe3cb); box-shadow: 0 0 0 1px rgba(255, 245, 220, .6) inset, 0 40px 90px rgba(0, 0, 0, .6); display: grid; gap: 14px; justify-items: center; animation: rise .55s var(--ease) both; }
  .ncard::before { content: ""; position: absolute; inset: 10px; border-radius: 9px; border: 1px solid rgba(166, 128, 66, .55); pointer-events: none; }
  .ncard > small { font-family: var(--serif-jp); font-weight: 700; font-size: var(--fs-label); letter-spacing: .3em; color: #8b6a2f; }
  .ncard h2 { font-family: var(--serif-jp); font-weight: 800; font-size: max(42px, calc(24px / var(--k))); letter-spacing: .08em; line-height: 1.25; }
  .ncard p { font-size: var(--fs-body); line-height: 1.75; max-width: 25em; }
  .ncard p em { font-style: normal; color: var(--heart); font-weight: 700; }
  .nrow { display: flex; gap: 10px; margin: 6px 0 4px; perspective: 700px; }
  .nrow .card { position: relative; width: 66px; height: 92px; }
  .nrow .card .ix { font-size: 22px; left: 0; right: 0; top: 0; bottom: 0; place-content: center; }
  .nrow .card .ix i { font-size: 18px; }
  .nrow .card.is-new { animation: flip .9s var(--ease) .35s both; }
  .nrow .card .tag { position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; font-family: var(--sans); font-size: var(--fs-caption); font-weight: 700; color: var(--heart); }
  .nbtns { display: flex; gap: 12px; margin-top: 8px; align-items: center; }
  .nbtns .go { position: static; width: 250px; letter-spacing: .16em; }
  .ghost { min-height: max(62px, calc(48px / var(--k))); padding: 0 1.5em; border-radius: 999px; font-family: var(--serif-jp); font-weight: 700; font-size: var(--fs-label); letter-spacing: .14em; color: #5a3a24; border: 1px solid rgba(139, 106, 47, .6); }
  .steps { display: flex; gap: 8px; }
  .steps i { width: 8px; height: 8px; border-radius: 50%; background: rgba(139, 106, 47, .3); }
  .steps i.on { background: #8b6a2f; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; margin: 2px 0; }
  .two > div { display: grid; justify-items: center; gap: 6px; padding: 16px 12px 14px; border-radius: 10px; border: 1px solid rgba(139, 106, 47, .3); background: rgba(255, 255, 255, .35); }
  .two img { width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .3)); }
  .two b { font-family: var(--serif-jp); font-size: var(--fs-lead); font-weight: 800; letter-spacing: .12em; }
  .two span { font-size: var(--fs-label); color: #5a4436; line-height: 1.55; }
  .two span em { font-style: normal; color: var(--heart); font-weight: 700; }
  .two .is-keep { border-color: rgba(195, 19, 47, .45); background: rgba(195, 19, 47, .06); }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } }
  @keyframes flip { 0% { transform: rotateY(90deg); } 100% { transform: none; } }

  .spot-dim { position: absolute; top: 0; bottom: 0; left: calc(-1 * var(--bx)); right: calc(-1 * var(--bx)); z-index: 19; background: rgba(5, 2, 4, .66); animation: fadeIn .35s ease both; }
  .spot-dim[hidden], .coach[hidden] { display: none; }
  /* 右の列ごと暗幕の上に出し、押す所（卓へ）と今夜の1枚だけを明るく残す */
  body.is-spot .col { z-index: 21; }
  body.is-spot .memo, body.is-spot .prize { opacity: .18; transition: opacity .3s ease; }
  body.is-spot .go { animation: ring 1.6s ease-in-out infinite; }
  @keyframes ring { 50% { box-shadow: 0 0 0 6px rgba(241, 216, 158, .45), 0 0 50px rgba(241, 200, 120, .6); } }
  .coach { position: absolute; right: calc(var(--er) + 370px); top: 470px; z-index: 22; width: 360px; padding: 16px 20px; border-radius: 14px; background: rgba(250, 244, 233, .97); color: #2a1a1e; box-shadow: 0 16px 40px rgba(0, 0, 0, .5); animation: rise .45s var(--ease) both; }
  .coach p { font-size: var(--fs-body); line-height: 1.6; }
  .coach p em { font-style: normal; color: var(--heart); font-weight: 700; }
  .coach p small { display: block; margin-top: 4px; font-size: var(--fs-caption); color: #8a6a3a; letter-spacing: .06em; }
  .coach::after { content: ""; position: absolute; right: -9px; top: 50%; margin-top: -9px; width: 18px; height: 18px; background: inherit; transform: rotate(45deg); border-radius: 3px; }

  .toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); padding: .6em 1.3em; border-radius: 999px; background: rgba(12, 8, 10, .92); border: 1px solid rgba(241, 216, 158, .3);
    font-size: var(--fs-label); opacity: 0; transition: opacity .25s ease; pointer-events: none; z-index: 30; white-space: nowrap; }
  .toast.is-on { opacity: 1; }

  /* ===== スマホ横持ち：文字が大きくなる分、置き方を変える ===== */
  html.compact .marquee { top: 22px; }
  html.compact .places { top: 136px; gap: 2px; }
  html.compact .place small { display: none; }
  html.compact .col { width: 470px; top: 118px; }
  html.compact .memo { margin-bottom: 22px; padding: 12px 20px 10px; }
  html.compact .memo .sig { display: none; }
  html.compact .tonight { transform: rotate(-3deg) scale(.86); margin: -20px 0; }
  html.compact .mq-sub { display: none; }
  html.compact .fan-label { display: none; }
  html.compact .ncard { width: 900px; }
  html.compact .nrow .card { width: 84px; height: 118px; }
  html.compact .coach { width: 520px; right: calc(var(--er) + 500px); top: 480px; }

  @media (prefers-reduced-motion: reduce) {
    .halo, .door, .hero .breath, .bokeh, .tonight .card::after, .deal, .lift, .memo-in, .go-in, .in-hero, body.is-spot .go { animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">

    <button class="gear" type="button" aria-label="音量と設定" data-msg="音量と設定を開く"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h0a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
  </div>

  <nav class="places" aria-label="行ける所">
    <button class="place" type="button" data-msg="交換所（グラーノの店）を開く"><span class="pi"><svg viewBox="0 0 32 32"><path d="M6 13.5 15.5 4H26v10.5L16.5 24 6 13.5Z"/><circle cx="21.3" cy="8.7" r="1.8"/><path d="M11.5 14.5c1.4-1.6 3.4-1.4 4 .1.6 1.5-1.6 2.5-2.9 3.8M16 20.5l-.4.4"/><path d="M4 28h10"/></svg></span><span class="pt"><b>交換所</b><small id="shopLine">新しい品 <em>3点</em></small></span><i class="new" id="shopNew"></i></button>
    <button class="place" type="button" data-msg="コレクション（ご褒美CG・称号）を開く"><span class="pi"><svg viewBox="0 0 32 32"><rect x="5" y="6" width="22" height="20" rx="1.5"/><rect x="8.5" y="9.5" width="15" height="13" rx=".5"/><path d="M16 19.5s-3.8-2.3-3.8-5a2 2 0 0 1 3.8-1 2 2 0 0 1 3.8 1c0 2.7-3.8 5-3.8 5Z"/></svg></span><span class="pt"><b>コレクション</b><small id="cgLine">ご褒美CG 3/5</small></span></button>
    <button class="place" type="button" data-msg="ぱにゅぱにゅ（ミニゲーム）を開く"><span class="pi"><svg viewBox="0 0 32 32"><circle cx="16" cy="17" r="10.5"/><path d="M12 16.2v.6M20 16.2v.6"/><path d="M13.5 20.2c1.4 1.3 3.6 1.3 5 0"/><path d="M9.5 21.5h1.6M20.9 21.5h1.6" opacity=".7"/><path d="M22.5 5.5l.8 1.8 1.8.8-1.8.8-.8 1.8-.8-1.8-1.8-.8 1.8-.8z"/></svg></span><span class="pt"><b>ぱにゅぱにゅ</b><small>今日あと <em>5</em> 回</small></span></button>
    <button class="place" type="button" data-msg="リコの教室（講義）を開く"><span class="pi"><svg viewBox="0 0 32 32"><path d="M16 9.5c-3-2.2-7-2.6-10.5-1.6V25c3.5-1 7.5-.6 10.5 1.6 3-2.2 7-2.6 10.5-1.6V7.9C23 6.9 19 7.3 16 9.5Z"/><path d="M16 9.5v17.1"/><path d="M21 7.4V15l1.6-1.2 1.6 1.2V7.1"/></svg></span><span class="pt"><b>リコの教室</b><small id="lecLine">修了で <em>+300</em> ＆ CG</small></span></button>
    <button class="place" type="button" id="outfitPlace" data-msg="衣装（リコ先輩の衣装を眺める）を開く"><span class="pi"><svg viewBox="0 0 32 32"><path d="M16 9.2a2.6 2.6 0 1 0-2.6-2.6"/><path d="M16 9.2v2.3L4.6 20.4a1.4 1.4 0 0 0 .9 2.5h21a1.4 1.4 0 0 0 .9-2.5L16 11.5"/><path d="M13.2 26.5c1.6-1.8 4-1.8 5.6 0" opacity=".7"/></svg></span><span class="pt"><b>衣装</b><small id="outfitLine">交換所で買うと開く</small></span></button>

  <div class="fan" id="fan" aria-label="ロイヤルフラッシュの手札"></div>

    <div class="eye-tonight">今夜の卓</div>

      <span class="nm"><b id="tName">グラーノ</b><small id="tEp">EPISODE 04</small></span>

  </div>

  <div class="notice" id="notice" hidden><div class="ncard" role="dialog" aria-modal="true" aria-labelledby="ntTitle" id="ntCard"></div></div>

  <div class="coach" id="coach" hidden><p class="jp" id="coachText"></p></div>
  <div class="toast" id="toast"></div>
</div>

<script>
// ---- 見本のデータ（言葉は本体の正典から。数字は OPPONENTS と同じ） ----
const SEATS = [
  { id: 'rico_tutorial', rank: '10', ep: 1, name: 'リコ先輩', face: 'face_rico_bunny', prize: 300, theme: 'ポーカーの基礎' },
  { id: 'polka', rank: 'J', ep: 2, name: 'ポルカ', face: 'face_polka', prize: 500, theme: 'ブラフ入門', tip: '今夜の相手はポルカ。声がでかい時ほど、<em>手は弱い</em>。耳を澄ませな' },
  { id: 'selina', rank: 'Q', ep: 3, name: 'セリナ', face: 'face_selina', prize: 700, theme: 'ボード危険度・ベットサイズ', tip: 'セリナは理詰めの女。<em>ベット額</em>の“意味”を読みな' },
  { id: 'grano', rank: 'K', ep: 4, name: 'グラーノ', face: 'face_grano', prize: 900, theme: 'ポットオッズ・割に合う判断', tip: 'グラーノは何でも値段で誘ってくる。<em>払う価値</em>は自分で計算しな' },
  { id: 'velvet', rank: 'A', ep: 5, name: 'ヴェルベット', face: 'face_velvet', prize: 1500, theme: 'レンジ・総合判断', tip: 'ヴェルベットは言葉と圧で心を折りに来る。あんたはもう<em>全部の武器</em>を持ってる' },
];
const HERO = {
  mimi: { img: '../../assets/characters/hd/mimi_default.webp', cls: '', who: 'ミミ（心の声）', lines: ['（よし……今夜もやるぞ）', '（深呼吸、深呼吸……）', '（ぱにゅぱにゅ、今日も頼むね）', '（勝ったらご褒美CG……！）', '（負けたら罰ゲームとかないよね……？）'] },
  rico: { img: '../../assets/characters/hd/rico_dress.webp', cls: 'is-rico', who: 'リコ先輩', lines: ['「今夜は……特別ね」', '「VIPルーム、覚悟は？」', '「アタシ、決めるときは決めるの」'] },
};
const q = new URLSearchParams(location.search);
const EVENT = q.get('event');
const STATE = q.get('state') || (EVENT === 'first' ? 'first' : EVENT === 'unlock' ? 'last' : 'mid');
const early = STATE === 'first' || STATE === 'early';
const cleared = STATE === 'clear' ? SEATS.map(s => s.id) : early ? ['rico_tutorial'] : STATE === 'last' ? ['rico_tutorial', 'polka', 'selina', 'grano'] : ['rico_tutorial', 'polka', 'selina'];
const nextIdx = SEATS.findIndex(s => !cleared.includes(s.id));
const hero = HERO[q.get('hero')] || HERO.mimi;
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString();
const FACE = (f) => `../../assets/ui/${f}.webp`;

// 主役
$('heroImg').src = hero.img;
if (hero.cls) { $('hero').classList.add(hero.cls); $('heroHit').classList.add(hero.cls); }
$('bubbleWho').textContent = hero.who;

// 左上・右上・左の行き先
const nx = SEATS[nextIdx >= 0 ? nextIdx : 4];
$('epNo').textContent = nextIdx >= 0 ? String(nx.ep).padStart(2, '0') : 'ALL';
$('epTitle').textContent = nextIdx >= 0 ? `第${nx.ep}話` : '全話クリア';
$('epSub').textContent = nextIdx >= 0 ? nx.theme : '好きな相手と再戦できる';
if (nextIdx < 0) $('epSub').classList.add('is-free');
$('coins').textContent = fmt(early ? 300 : STATE === 'clear' ? 6240 : STATE === 'last' ? 1750 : 850);
$('cgLine').textContent = `ご褒美CG ${STATE === 'clear' ? 5 : STATE === 'last' ? 4 : STATE === 'mid' ? 3 : 0}/5`;
if (early) { $('shopLine').textContent = '品ぞろえ 5点'; $('shopNew').remove(); }
if (!early) $('outfitLine').textContent = 'リコ先輩の衣装を見る'; else $('outfitPlace').classList.add('is-locked');
document.documentElement.style.setProperty('--vip', String([.55, .55, .7, .85, 1.15, .8][cleared.length]));

// 手札（ロイヤルフラッシュ）：扇の要は画面の右下の外。勝った札は表、今夜の1枚は空き、まだの札は裏
const FAN = { px: 206, py: 592, r: 420 };   // 扇の要（.fan の箱の中の座標。箱は左下の端に寄る）
function cardFace(s, cls = '') {
  return `<span class="ix">${s.rank}<i>♥</i></span><span class="win"><img src="${FACE(s.face)}" alt=""></span><span class="ix b">${s.rank}<i>♥</i></span>`;
}
const inHand = SEATS.filter((s, i) => i !== nextIdx);
const spread = Math.min(30, 10 * (inHand.length - 1));
$('fan').innerHTML = inHand.map((s, j) => {
  const won = cleared.includes(s.id);
  const a = inHand.length > 1 ? -spread / 2 + spread * j / (inHand.length - 1) : 0, rad = a * Math.PI / 180;
  const cx = FAN.px + FAN.r * Math.sin(rad), cy = FAN.py - FAN.r * Math.cos(rad);
  return `<div class="${won ? 'card' : 'card is-back'} deal" style="left:${cx - 62}px;top:${cy - 87}px;transform:rotate(${a}deg);--dd:${.25 + j * .09}s">${won ? cardFace(s) : ''}</div>`;
}).join('');
const left = SEATS.length - cleared.length;
$('fanLeft').textContent = left ? `あと ${left} 枚` : '完成！';

// 今夜の1枚・メモ・卓へ
if (nextIdx >= 0) {
  $('tIx').innerHTML = $('tIxB').innerHTML = `${nx.rank}<i>♥</i>`;
  $('tFace').src = FACE(nx.face);
  $('tName').textContent = nx.name;
  $('tEp').textContent = `EPISODE ${String(nx.ep).padStart(2, '0')}`;
  $('memoText').innerHTML = nx.tip;
  $('prize').innerHTML = `勝てば <b>${fmt(nx.prize)}</b> コイン ＋ ご褒美CG`;
} else {
  $('tIx').innerHTML = $('tIxB').innerHTML = `A<i>♥</i>`;
  $('tFace').src = FACE('face_velvet');
  $('tName').textContent = '好きな卓へ';
  $('tEp').textContent = 'ROYAL FLUSH';
  $('memoText').innerHTML = '全部の卓を制覇したね。今夜は<em>どの子</em>と遊ぶ？';
  $('prize').innerHTML = '再戦でもコインがもらえる';
}
$('memoFace').src = FACE(q.get('hero') === 'rico' ? 'face_rico_dress' : 'face_rico_bunny');

// 押すと話す（数秒で消える）
let li = 0, tm = 0;
$('heroHit').addEventListener('click', () => {
  $('bubbleLine').textContent = hero.lines[li]; li = (li + 1) % hero.lines.length;
  $('bubble').classList.remove('is-hide'); clearTimeout(tm); tm = setTimeout(() => $('bubble').classList.add('is-hide'), 4200);
});
let tt = 0;
const toast = (m) => { const t = $('toast'); t.textContent = m; t.classList.add('is-on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('is-on'), 1600); };
document.querySelectorAll('[data-msg]').forEach(b => b.addEventListener('click', () => toast(b.dataset.msg)));
const toSelect = () => { location.href = `select-v11.html?state=${STATE === 'first' ? 'early' : STATE}`; };
$('goBtn').addEventListener('click', toSelect);
$('tonightCard').addEventListener('click', toSelect);

// ---- 真ん中の知らせ（紙の札の上に、1つずつ） ----
const notice = $('notice'), card = $('ntCard');
const mini = (s, cls = '') => `<span class="card ${cls}"><span class="ix">${s.rank}<i>♥</i></span></span>`;
function showCard(html, onReady) { card.innerHTML = html; card.style.animation = 'none'; void card.offsetWidth; card.style.animation = ''; notice.hidden = false; onReady && onReady(); }
function closeNotice() { notice.hidden = true; }
function firstVisit() {
  const p1 = `<small>このゲームの目標</small><h2 id="ntTitle">ロイヤルフラッシュ</h2>
    <div class="nrow">${SEATS.map((s, i) => i === 0 ? `<span class="card is-new"><span class="ix">${s.rank}<i>♥</i></span><span class="tag">研修で獲得</span></span>` : `<span class="card is-back"></span>`).join('')}</div>
    <p class="jp" style="margin-top:18px">相手に勝つたびに、<em>♥の札が1枚</em>手に入る。5枚そろえば完成。<br><span class="nb">最後の1枚は、<em>大階段の上のVIPルーム</em>に。</span></p>
    <div class="nbtns"><button class="go" type="button" id="ntNext">次へ</button></div><div class="steps"><i class="on"></i><i></i></div>`;
  const p2 = `<small>コインとチップ</small><h2 id="ntTitle">持ち帰れるのは コインだけ</h2>
    <div class="two"><div><img src="../../assets/ui/chip_red.webp" alt=""><b>チップ</b><span class="jp">卓の上だけで使う。<br>次の卓では、また最初から</span></div>
    <div class="is-keep"><img src="../../assets/ui/chip_gold.webp" alt=""><b>コイン</b><span class="jp">勝つともらえる。<br><em>交換所</em>で使える</span></div></div>
    <div class="nbtns"><button class="go" type="button" id="ntNext">わかった</button></div><div class="steps"><i></i><i class="on"></i></div>`;
  showCard(p1, () => $('ntNext').addEventListener('click', () => showCard(p2, () => $('ntNext').addEventListener('click', () => { closeNotice(); spotlight(); }))));
}
function spotlight() {
  document.body.classList.add('is-spot'); $('spotDim').hidden = false; $('coach').hidden = false;
  $('coachText').innerHTML = `最初の相手は<em>ポルカ</em>。準備ができたら「卓へ」からね<small>光っているボタンを押そう</small>`;
  $('spotDim').addEventListener('click', () => { document.body.classList.remove('is-spot'); $('spotDim').hidden = true; $('coach').hidden = true; }, { once: true });
}
function unlocked() {
  showCard(`<small>NEW TABLE</small><h2 id="ntTitle">新しい卓が開いた</h2>
    <div class="nrow">${SEATS.map((s, i) => i <= 3 ? `<span class="card${i === 3 ? ' is-new' : ''}"><span class="ix">${s.rank}<i>♥</i></span></span>` : `<span class="card is-back"></span>`).join('')}</div>
    <p class="jp">グラーノに勝って <em>K♥</em> を手に入れた。ロイヤルフラッシュまで、<span class="nb">あと1枚。</span><br>最後の卓は <em class="nb">VIPルームのヴェルベット</em>。</p>
    <div class="nbtns"><button class="go" type="button" id="ntGo">卓へ</button><button class="ghost" type="button" id="ntLater">あとで</button></div>`, () => {
    $('ntLater').addEventListener('click', closeNotice); $('ntGo').addEventListener('click', () => { closeNotice(); toSelect(); });
  });
}
if (EVENT === 'first') setTimeout(firstVisit, 900);
if (EVENT === 'unlock') setTimeout(unlocked, 900);

function fit() {
  const k = Math.min(innerWidth / 1280, innerHeight / 800);
  const bx = Math.max(0, Math.min(300, (innerWidth / k - 1280) / 2));
  const r = document.documentElement.style; r.setProperty('--k', k); r.setProperty('--bx', `${bx}px`);
  document.documentElement.classList.toggle('compact', k < 0.6);
}
addEventListener('resize', fit); fit();
</script>
</body>
</html>
