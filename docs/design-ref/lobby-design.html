<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Bebas+Neue&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Sans", sans-serif; color: #f7eecf; background: #0b0510; }
    a { color: #f5d77a; } a:hover { color: #fff3c4; }
    .disp { font-family: "Bebas Neue", "Noto Sans JP", Impact, sans-serif; letter-spacing: .06em; }
    .door { position: relative; width: 168px; height: 420px; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; background: linear-gradient(180deg, rgba(42,15,61,.55) 0%, rgba(11,5,16,.85) 100%); box-shadow: inset 0 0 0 1px rgba(245,215,122,.35), 0 16px 34px rgba(0,0,0,.6); overflow: hidden; }
    .door-img { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; }
    .door-img img { height: 92%; object-fit: contain; filter: drop-shadow(0 12px 22px rgba(0,0,0,.8)); }
    .door-no { position: absolute; left: 10px; top: 6px; font-family: "Bebas Neue", Impact, sans-serif; font-size: 44px; color: rgba(245,215,122,.85); line-height: 1; }
    .door-foot { position: relative; z-index: 2; width: 100%; padding: 10px 12px 12px; background: linear-gradient(180deg, rgba(11,5,16,0) 0%, rgba(11,5,16,.92) 30%); display: flex; flex-direction: column; gap: 4px; }
    .door-name { font-size: 19px; font-weight: 900; }
    .door-tag { font-size: 11px; color: #c4b89a; font-weight: 700; }
    .door-cta { height: 40px; border: 0; margin-top: 6px; background: linear-gradient(90deg, #f5d77a, #d9b35a); color: #14081d; font-weight: 900; font-size: 15px; font-family: inherit; transform: skewX(-12deg); }
    .door-cta > span { display: inline-block; transform: skewX(12deg); }
    .gen { position: absolute; right: 8px; top: 8px; z-index: 5; padding: 3px 8px; background: #ffc1d8; color: #3a0f2a; font-size: 10px; font-weight: 900; transform: rotate(4deg); }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #0b0510;">
  <!-- 背景：カジノフロア（新規生成予定：奥に5つの卓が並ぶ大広間） -->
  <div style="position: absolute; inset: 0; background: url(./lobby.jpg) center 30% / cover no-repeat; filter: brightness(.7) saturate(.85);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,5,16,.55) 0%, rgba(11,5,16,.15) 40%, rgba(11,5,16,.9) 100%);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(104deg, rgba(0,0,0,0) 0 57%, rgba(245,215,122,.16) 57% 57.6%, rgba(0,0,0,0) 57.6%); pointer-events: none;"></div>
  <div class="gen" style="left: 12px; top: 108px; right: auto;">背景 新規生成：VIPカジノ大広間</div>

  <!-- 見出し：章タイトル -->
  <div style="position: absolute; left: 36px; top: 14px;">
    <div class="disp" style="font-size: 20px; color: #c4b89a; letter-spacing: .4em;">VIP CASINO LOUNGE</div>
    <div style="font-size: 40px; font-weight: 900; letter-spacing: .1em; line-height: 1.1; text-shadow: 0 4px 0 rgba(0,0,0,.5);">ロビー</div>
  </div>
  <!-- 所持コイン：POTと同じ文法の巨大数字 -->
  <div style="position: absolute; right: 40px; top: 14px; text-align: right;">
    <div class="disp" style="font-size: 16px; color: #c4b89a; letter-spacing: .3em;">COINS</div>
    <div class="disp" style="font-size: 64px; line-height: .9; color: #f5d77a; text-shadow: 0 0 30px rgba(245,215,122,.5);">1,250</div>
  </div>

  <!-- リコ：コンシェルジュとして左に大きく（新規生成：トレイを持つ案内ポーズ） -->
  <div style="position: absolute; left: -20px; bottom: -30px; width: 360px; height: 660px; display: flex; align-items: flex-end; justify-content: center;">
    <img src="./rico_default.webp" alt="リコ先輩" style="height: 100%; object-fit: contain; filter: drop-shadow(0 20px 40px rgba(0,0,0,.85));">
    <div class="gen">新規生成：案内ポーズ差分</div>
  </div>
  <div style="position: absolute; left: 250px; bottom: 96px; max-width: 240px; padding: 12px 16px; background: rgba(255,253,243,.96); color: #14081d; font-size: 15px; font-weight: 700; border-radius: 14px; box-shadow: 0 8px 20px rgba(0,0,0,.5);">「今夜はどの卓にする？　ポルカ、そろそろ本気で悔しがるよ〜」</div>

  <!-- 対戦相手：5枚の「卓の扉」。進行は左→右、施錠は暗く -->
  <div style="position: absolute; left: 386px; right: 34px; top: 150px; display: flex; gap: 12px; align-items: flex-end;">
    <div class="door" style="height: 380px;">
      <div class="door-no">00</div>
      <div class="door-img"><img src="./rico_default.webp" alt="リコ先輩" style="opacity:.9; filter: drop-shadow(0 12px 22px rgba(0,0,0,.8)) saturate(.9);"></div>
      <div class="door-foot"><div class="door-name">リコの講義</div><div class="door-tag">基礎の8章 ＋ 真剣モード</div><button class="door-cta"><span>受講する</span></button></div>
    </div>
    <div class="door" style="height: 420px; box-shadow: inset 0 0 0 2px #f5d77a, 0 0 34px rgba(245,215,122,.4), 0 16px 34px rgba(0,0,0,.6);">
      <div class="door-no" style="color:#f5d77a;">01</div>
      <div style="position:absolute; left:0; right:0; top:0; height:26px; background:#f5d77a; color:#14081d; font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; letter-spacing:.2em;">NEXT TABLE</div>
      <div class="door-img"><img src="./polka_default.webp" alt="ポルカ"></div>
      <div class="door-foot"><div class="door-name">ポルカ</div><div class="door-tag">ブラフ入門 ・ 賞金 500</div><button class="door-cta"><span>この卓につく</span></button></div>
    </div>
    <div class="door">
      <div class="door-no">02</div>
      <div class="door-img"><img src="./selina_default.webp" alt="セリナ"></div>
      <div class="door-foot"><div class="door-name">セリナ</div><div class="door-tag">ボード危険度 ・ 賞金 800</div><button class="door-cta" style="background: rgba(0,0,0,.5); color:#c4b89a; box-shadow: inset 0 0 0 1px rgba(217,179,90,.4);"><span>挑戦する</span></button></div>
    </div>
    <div class="door" style="filter: brightness(.55) saturate(.6);">
      <div class="door-no">03</div>
      <div class="door-img"><img src="./grano_recommend.webp" alt="グラーノ" style="filter: brightness(.3) drop-shadow(0 12px 22px rgba(0,0,0,.8));"></div>
      <div class="door-foot"><div class="door-name">？？？</div><div class="door-tag">セリナに勝つと解放</div>
        <div style="height:40px; margin-top:6px; display:flex; align-items:center; justify-content:center; gap:8px; color:#c4b89a; font-size:13px; font-weight:900;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>施錠中</div></div>
    </div>
    <div class="door" style="filter: brightness(.45) saturate(.5);">
      <div class="door-no">04</div>
      <div style="position:absolute; left:0; right:0; top:0; height:26px; background:#c8253a; color:#fff; font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; letter-spacing:.2em;">VIP ROOM</div>
      <div class="door-img"><img src="./velvet_default.webp" alt="ヴェルベット" style="filter: brightness(.25) drop-shadow(0 12px 22px rgba(0,0,0,.8));"></div>
      <div class="door-foot"><div class="door-name">？？？</div><div class="door-tag">最深部 ・ ボス</div>
        <div style="height:40px; margin-top:6px; display:flex; align-items:center; justify-content:center; gap:8px; color:#c4b89a; font-size:13px; font-weight:900;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>施錠中</div></div>
    </div>
  </div>

  <!-- 下段：施設ボタン（斜めスラブ、横一列） -->
  <div style="position: absolute; left: 386px; right: 34px; bottom: 36px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;">
    <button style="position: relative; height: 84px; border: 0; background: linear-gradient(90deg, #8a4cc4, #5a2a8a); color: #fff; font-family: inherit; font-weight: 900; transform: skewX(-12deg); box-shadow: 0 12px 26px rgba(0,0,0,.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="display: inline-block; transform: skewX(12deg); font-size: 20px;">交換所</span><span style="display: inline-block; transform: skewX(12deg); font-size: 11px; opacity: .85;">グラーノの店 ・ NEW 3</span>
    </button>
    <button style="position: relative; height: 84px; border: 0; background: rgba(0,0,0,.55); color: #f7eecf; font-family: inherit; font-weight: 900; transform: skewX(-12deg); box-shadow: inset 0 0 0 1px rgba(245,215,122,.4), 0 12px 26px rgba(0,0,0,.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="display: inline-block; transform: skewX(12deg); font-size: 20px;">ミニポーカー</span><span style="display: inline-block; transform: skewX(12deg); font-size: 11px; opacity: .85;">デイリー任務 ・ JP 5,000</span>
    </button>
    <button style="position: relative; height: 84px; border: 0; background: rgba(0,0,0,.55); color: #f7eecf; font-family: inherit; font-weight: 900; transform: skewX(-12deg); box-shadow: inset 0 0 0 1px rgba(245,215,122,.4), 0 12px 26px rgba(0,0,0,.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="display: inline-block; transform: skewX(12deg); font-size: 20px;">コレクション</span><span style="display: inline-block; transform: skewX(12deg); font-size: 11px; opacity: .85;">称号 12/28 ・ 名鑑</span>
    </button>
    <button style="position: relative; height: 84px; border: 0; background: linear-gradient(90deg, #ffc1d8, #ff8fb8); color: #3a0f2a; font-family: inherit; font-weight: 900; transform: skewX(-12deg); box-shadow: 0 12px 26px rgba(0,0,0,.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="display: inline-block; transform: skewX(12deg); font-size: 20px;">ぱにゅぱにゅ</span><span style="display: inline-block; transform: skewX(12deg); font-size: 11px; opacity: .85;">ぷにぷにして遊ぶ</span>
    </button>
  </div>
</div>
</x-dc>
