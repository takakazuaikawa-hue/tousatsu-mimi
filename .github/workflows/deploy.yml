name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Collect game files only
        # 配信するのはゲーム本体だけ（docs/・tools/・qa/・README は公開しない）
        # 例外：ぱにゅぱにゅの網目＋ばね（本編が iframe で読む docs/design-ref/panyu-mesh.html）だけは配信する
        run: |
          mkdir -p _site
          cp index.html voice.js game.js home.js home-live.js live-cg.js loader.js style.css read-compact.css allstar.js allstar-ui.js allstar.css _site/
          cp sw.js offline.js offline.css type-roles.css manifest.webmanifest _site/
          if [ -f ui-modal.css ]; then cp ui-modal.css _site/; fi
          mkdir -p _site/battles/games
          cp battles/core.js battles/core.css battles/read-pc.css _site/battles/
          cp battles/games/*.js _site/battles/games/
          rsync -a --exclude '_source_png' --exclude '_original' --exclude '*.md' assets/ _site/assets/
          mkdir -p _site/docs/design-ref
          cp docs/design-ref/panyu-mesh.html _site/docs/design-ref/
      - name: Write offline-files.json
        # まとめてダウンロード用の一覧（全ファイルの相対URL・sha1先頭12桁・サイズ）。sw.js と自分自身は含めない
        run: node tools/make-offline-files.mjs _site
      - name: Check index.html can find every file
        # index.html が読むファイル（src / href の相対パス）が配信物に全部あるか。1つでも無ければ配信を止める
        run: |
          missing=0
          for f in $(grep -oE '(src|href)="[^"]+"' index.html | sed -E 's/^(src|href)="//; s/"$//' | grep -vE '^(https?:|//|data:|mailto:|#|\$)' | sed -E 's/[?#].*//' | sort -u); do
            if [ ! -e "_site/$f" ]; then echo "missing: $f"; missing=1; fi
          done
          [ -e _site/docs/design-ref/panyu-mesh.html ] || { echo "missing: docs/design-ref/panyu-mesh.html"; missing=1; }
          exit $missing
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
