<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d080e">
<link rel="icon" type="image/webp" href="assets/ui/emblem_rabbit_gold.webp">
<title>ミミのテキサスホールデムポーカー 〜転生したらバニーガールだった私の外れスキル《ぱにゅぱにゅ》だけがレベルアップな件〜</title>
<!--
  ★FOUC（Flash of Unstyled Content）対策：
  外部 style.css の読み込みが遅延・混雑した瞬間に、無装飾の生HTML（黒文字＋白背景）が
  一瞬表示されてしまう問題を防ぐための「クリティカルCSSの先出し」。
  外部CSSが未着でも、最低限「真っ黒画面＋読み込み中の見た目」を即座に保証する。
  外部CSSが読み込み完了すれば、通常のスタイルが上書きしてそのまま自然に引き継がれる。
-->
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    color: #f7eecf;
    font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Sans", sans-serif;
  }
  #preload-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: #0b0809; overflow: hidden;
  }
  /* 読み込み画面の一枚絵（カードで口元を隠すミミ）は、外部CSSの到着前から画面いっぱいに敷く。
     文字と進み具合は外部CSSが届いてから出す（素のまま散らばらないように） */
  #preload-overlay .preload-kv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 68% 50%; }
  #preload-overlay .preload-kv-motion { display: none; }
  #preload-overlay .preload-inner { visibility: hidden; }
  /* 外部CSSが未着の間だけ、素のテキストが見苦しく散らばらないよう非表示にしておく。
     着荷後は style.css 側の .preload-overlay 等のルールが上書きして通常表示になる。 */
  #portrait-warning, #fullscreen-btn-group { display: none; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Bebas+Neue&family=Shippori+Mincho+B1:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css?v=20261004i">
<link rel="stylesheet" href="battles/core.css?v=20261004i">
</head>
<body>
<div id="preload-overlay">
  <!-- 読み込み画面：カードで口元を隠して笑うミミ。動画が再生できた時だけ上に重ねる（失敗・視差効果を減らす設定・データ節約では一枚絵のまま） -->
  <img class="preload-kv" src="assets/backgrounds/loading_mimi.webp" alt="" fetchpriority="high">
  <video class="preload-kv-motion" muted playsinline loop preload="none" aria-hidden="true"></video>
  <div class="preload-shade"></div>
  <div class="preload-inner">
    <img class="preload-logo-img" src="assets/ui/title_logo.webp" alt="ミミのテキサスホールデムポーカー">
    <div class="preload-progress">
      <div class="preload-bar"><div class="preload-bar-fill" id="preload-fill"></div></div>
      <div class="preload-count"><span>読み込み中</span><span><b id="preload-pct">0</b>%</span></div>
    </div>
    <div class="preload-tip-box">
      <div class="preload-tip-label">ポーカー豆知識</div>
      <div class="preload-tip" id="preload-tip"></div>
    </div>
  </div>
</div>
<!-- グローバルなBGM要素（テンプレ外。画面切替でも保持） -->
<audio id="lobby-bgm-audio" loop preload="none">
  <source src="assets/bgm/velvet-night-casino.m4a" type="audio/mp4">
</audio>
<audio id="ending-bgm-audio" preload="none">
  <source src="assets/bgm/ending.m4a" type="audio/mp4">
</audio>
<!-- シーン専用BGM（タイトル/バトル/ボス/ミニゲーム）。src を差し替えて使い回し、
     ロビー/エンディング/シンセと排他再生することで二重再生（＝うるささ）を防ぐ -->
<audio id="scene-bgm-audio" loop preload="auto"></audio>

<div id="stage">
  <div id="app"></div>
</div>

<!-- 縦持ち警告：スマホ縦画面で表示 -->
<div id="portrait-warning">
  <div class="portrait-warning-inner">
    <div class="rotate-icon">📱↻</div>
    <div class="portrait-message">
      <h2>横向きでプレイしてください</h2>
      <p>このゲームは横向き画面に最適化されています。<br>
      端末を横にしてから「⛶ 全画面で遊ぶ」ボタンを押すと、画面いっぱいに広がります。</p>
      <p class="portrait-tip">💡 画面回転ロックがオンの場合は解除してください<br>
      iPhone は Safari の共有ボタン →「ホーム画面に追加」から起動すると、広い画面で遊べます</p>
    </div>
  </div>
</div>

<!-- 全画面化ボタン：横向きでフルスクリーン未適用時に表示 -->
<div id="fullscreen-btn-group" hidden>
  <button id="fullscreen-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span class="fs-label">タップして全画面で遊ぶ</span></button>
  <button id="fullscreen-dismiss-btn" type="button" title="このボタンを閉じる" aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<!-- 画面テンプレート群 -->
<template id="tpl-title">
  <!-- タイトル v3（2026-10-04・見本は docs/design-ref/title-v3.html）：今の背景（title_bg）とロゴ（title_logo_hd＝同じデザインの高解像度版）を活かす。
       ・背景：一枚絵の上に、ミミの写っていない所の光（シャンデリア・ろうそく・大時計）だけが動くループ動画を重ねる（game.js applyTitleScene）
       ・ロゴは大時計が後ろからのぞく位置。操作はミミの体に重ならない右下。金は押してほしい1つだけ、絵文字なし
       ・起動して初めて開いた時だけ、黒から → ロゴに金の光 → ボタンの順に出す（.t3-intro） -->
  <div class="screen title-screen t3">
    <div class="t3-scene" aria-hidden="true">
      <img class="t3-bg" src="assets/backgrounds/title_bg.webp" alt="" onerror="this.style.display='none';">
      <video class="t3-motion" muted playsinline loop preload="none"></video>
    </div>
    <div class="t3-grade" aria-hidden="true"></div>
    <div class="t3-motes" aria-hidden="true">
      <i style="--x:640px;--y:520px;--s:7px;--d:9s;--delay:0s;--o:.7;--dx:18px"></i>
      <i style="--x:760px;--y:600px;--s:5px;--d:11s;--delay:2s;--o:.55;--dx:-14px"></i>
      <i style="--x:880px;--y:470px;--s:6px;--d:10s;--delay:4.5s;--o:.6;--dx:22px"></i>
      <i style="--x:990px;--y:560px;--s:4px;--d:12s;--delay:1.2s;--o:.5;--dx:-10px"></i>
      <i style="--x:1120px;--y:420px;--s:6px;--d:9.5s;--delay:3.3s;--o:.6;--dx:12px"></i>
      <i style="--x:560px;--y:300px;--s:4px;--d:13s;--delay:6s;--o:.45;--dx:16px"></i>
      <i style="--x:1200px;--y:640px;--s:5px;--d:10.5s;--delay:5.2s;--o:.5;--dx:-18px"></i>
      <i style="--x:700px;--y:250px;--s:3px;--d:12s;--delay:7.4s;--o:.4;--dx:10px"></i>
      <i style="--x:920px;--y:700px;--s:6px;--d:11.5s;--delay:8.1s;--o:.55;--dx:-12px"></i>
      <i style="--x:430px;--y:640px;--s:4px;--d:10s;--delay:3.8s;--o:.45;--dx:14px"></i>
    </div>

    <h1 class="t3-logo">
      <img src="assets/ui/title_logo_hd.webp" alt="ミミのテキサスホールデムポーカー 〜転生したらバニーガールだった私の外れスキル《ぱにゅぱにゅ》だけがレベルアップな件〜"
        onerror="this.closest('.t3-logo').classList.add('is-text'); this.remove();">
      <i class="t3-shine" aria-hidden="true"></i>
      <span class="t3-logo-text"><span>ミミの</span>テキサスホールデム<br>ポーカー</span>
    </h1>

    <!-- 続きから／はじめから・記録（game.js applyTitleButtons が埋める） -->
    <div class="t3-menu" data-bind="titleButtons"></div>

    <!-- 右上：音（共通の音量バーを injectAudioBars がここへ入れる）・シェア -->
    <nav class="t3-utils" aria-label="音とシェア">
      <button class="t3-icon" type="button" data-action="share-game" aria-label="シェア" title="シェア"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="17.5" cy="6" r="2.5"/><circle cx="17.5" cy="18" r="2.5"/><path d="M8.2 10.9l7-3.7M8.2 13.1l7 3.7"/></svg></button>
    </nav>
    <div class="t3-ver">v1.0</div>
  </div>
</template>

<template id="tpl-lobby">
  <div class="screen lobby-screen v3 v4 v5">
    <div class="bg-layer bg-lobby" data-motion-bg="assets/motion/lobby_loop.mp4"></div>

    <header class="top-hud lobby-hud">
      <button class="btn btn-ghost" data-action="back-title">← タイトルへ</button>
      <h2 class="lobby-title"><span class="v2-disp lobby-title-eyebrow">VIP CASINO LOUNGE</span><span class="lobby-title-main">ロビー</span></h2>
      <div class="hud-right">
        <div class="lobby-coins">
          <div class="lb3-chip-tray" aria-hidden="true"><i class="lb3-chip lb3-chip-r"></i><i class="lb3-chip lb3-chip-r"></i><i class="lb3-chip lb3-chip-r"></i><i class="lb3-chip lb3-chip-g"></i><i class="lb3-chip lb3-chip-g"></i></div>
          <div>
            <div class="v2-disp lobby-coins-label">COINS</div>
            <div class="v2-disp lobby-coins-num"><span data-bind="saveCoins">0</span></div>
          </div>
        </div>
      </div>
    </header>

    <main class="lobby-main">
      <!-- リコ先輩：左に等身大のコンシェルジュ（衣装ランダム＋衣装ビューア導線） -->
      <div class="lobby-rico-standing lb4-rico">
        <img data-bind="lobbyRicoImg" src="assets/characters/rico_default.webp" alt="リコ先輩" onerror="window.assetFallback(this,'rico')">
        <button class="lobby-rico-outfit" data-bind="lobbyRicoOutfit" data-action="open-rico-viewer" title="リコ先輩を眺める"></button>
      </div>
      <div class="lb4-rico-bubble" data-bind="lb4RicoLine">「ようこそ。今夜の卓、案内するよ」</div>

      <!-- 相手カードの一覧：どの卓につくか悩む美しさで並べる -->
      <section class="lb5-cards" data-bind="lb5Cards"></section>

      <!-- 下部オペレーションバー（黒×金で統一） -->
      <nav class="lb3-bar lb4-bar">
        <button class="lb3-bar-btn lb4-bar-btn lb4-ac-red" data-action="open-shop">
          <span class="lb3-bar-name">交換所</span><span class="lb3-bar-sub">グラーノの店</span>
          <span class="lobby-shop-newbadge" data-bind="lobbyShopNewBadge" style="display:none"></span>
        </button>
        <button class="lb3-bar-btn lb4-bar-btn lb4-ac-gold" data-action="open-collection">
          <span class="lb3-bar-name">コレクション</span><span class="lb3-bar-sub">称号・ご褒美CG</span>
        </button>
        <button class="lb3-bar-btn lb4-bar-btn lb4-ac-pink" data-action="panyu-free" title="ぱにゅぱにゅで遊ぶ（バトル効果なし・コインのごほうびは1日5回まで）">
          <span class="lb3-bar-name">ぱにゅぱにゅ</span><span class="lb3-bar-sub" data-bind="lobbyPanyuSub">ぷにぷにして遊ぶ</span>
          <span class="lobby-panyu-left" data-bind="lobbyPanyuLeft"></span>
        </button>
        <button class="lb3-bar-btn lb4-bar-btn lb4-bar-audio" data-action="lb3-toggle-audio" title="音量・設定">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
        </button>
      </nav>

      <!-- 音量パネル（バーの♪でトグル） -->
      <div class="lobby-bottom-panel lb3-audio-panel" data-bind="lobbyBottomPanel" style="display:none"></div>
    </main>
  </div>
</template>

<template id="tpl-shop">
  <div class="screen shop-screen v2">
    <div class="bg-layer bg-shop"></div>
    <div class="shop-v2-scrim"></div>

    <div class="shop-v2-owner character-frame char-grano-shop">
      <img src="assets/characters/grano_offer.webp" alt="グラーノ" onerror="this.onerror=function(){window.assetFallback(this,'grano')};this.src='assets/characters/grano_recommend.webp';">
    </div>
    <div class="shop-v2-bubble grano-shop-bubble" data-bind="ricoShopComment">「おや、いらっしゃい。今日の掘り出し物は……ふふ、良い目をお持ちだ」</div>

    <button class="btn btn-ghost shop-v2-back" data-action="back-lobby">← ロビーへ</button>

    <header class="shop-v2-head">
      <div class="shop-v2-disp shop-v2-brand">GRANO TRADING CO.</div>
      <div class="shop-v2-title">交換所</div>
    </header>
    <div class="shop-v2-coins">
      <div class="shop-v2-disp shop-v2-coins-label">COINS</div>
      <div class="shop-v2-disp shop-v2-coins-num" data-bind="saveCoins">0</div>
    </div>

    <nav class="shop-v2-tabs">
      <button class="shop-cat-btn active" data-cat="panyu"><span>ぱにゅ強化</span></button>
      <button class="shop-cat-btn" data-cat="note"><span>戦術ノート</span></button>
      <button class="shop-cat-btn" data-cat="skin"><span>見た目</span></button>
      <button class="shop-cat-btn" data-cat="stack"><span>チップ拡張</span></button>
      <button class="shop-cat-btn" data-cat="memory"><span>メモリ</span></button>
    </nav>

    <section class="shop-items" data-bind="shopItems"></section>
  </div>
</template>

<template id="tpl-battle">
  <div class="screen battle-screen v2 t8">
    <div class="bg-layer bg-poker"></div>
    <!-- v8：卓の奥の部屋に、相手の頭上から落ちる柔らかい光 -->
    <div class="t8-room" aria-hidden="true"></div>
    <div class="v2-slash v2-slash-red"></div>
    <div class="v2-slash v2-slash-gold"></div>

    <!-- 左上：HAND ナンバー＋ストリート（縦積み） -->
    <header class="v2-hand">
      <div class="t8-table-name" data-bind="t8TableName"></div>
      <div class="v2-hand-row">
        <span class="v2-disp v2-hand-label">HAND</span>
        <span class="v2-disp v2-hand-no" data-bind="handNo2">01</span>
        <span class="v2-disp v2-hand-max" data-bind="handMax2">/ 05</span>
      </div>
      <div class="v2-streets" data-bind="streetList"></div>
    </header>

    <!-- 右上：中断／役の早見表（画面直下に置く。ヘッダー内だと右寄せが効かない） -->
    <button class="btn btn-ghost v2-pause" data-action="back-lobby"><svg class="t8-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>中断</button>

    <!-- 左下：役の早見表（常設・研修中も開ける） -->
    <button class="btn btn-ghost v2-help-btn" data-action="show-hand-guide" type="button" title="役の早見表を見る"><svg class="t8-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="11" height="15" rx="1.5"/><path d="M8.5 20.5h10V8"/></svg>役の一覧</button>

    <!-- クリア後の練習用：相手の手札を見る（使っている間の対戦は称号・ランクの記録対象外） -->
    <button class="backdoor-toggle" data-action="toggle-backdoor" data-bind="backdoorBtn" title="練習用：相手の手札を見る（使っている間の対戦は称号・ランクの記録対象外）">✦</button>
    <div class="backdoor-panel" data-bind="backdoorPanel"></div>

    <!-- 相手：卓の向こうに大きく。テルは付箋 -->
    <div class="v2-opp">
      <div class="character-frame char-opponent" data-action="char-profile" data-char="__opponent__" title="相手のプロフィールを見る">
        <img data-bind="opponentImg" alt="相手">
        <!-- 卓での待機（呼吸・まばたき）。いつもの表情の時だけ、再生できたら上に重ねる -->
        <video class="t8-idle" muted playsinline loop preload="none" aria-hidden="true"></video>
      </div>
      <div class="v2-tells" data-bind="tellTags"></div>
    </div>
    <!-- v8：相手に落ちる光、卓のレール（革＋金の象嵌）とフェルト、四隅の沈み、上の帯の下地 -->
    <div class="t8-opp-light" aria-hidden="true"></div>
    <div class="t8-tint" aria-hidden="true"></div>
    <div class="t8-rail" aria-hidden="true"></div>
    <div class="t8-felt" aria-hidden="true"></div>
    <div class="t8-vignette" aria-hidden="true"></div>
    <div class="t8-topbar" aria-hidden="true"></div>

    <!-- 戦術ノートの常時表示（相手のレンジ帯／癖メモ）。
         ★.v2-opp には mask-image が掛かっていて箱の外が透明に切り落とされるため、
           この2つは .v2-opp の中に置けない。卓の直下（.battle-screen）に出す。 -->
    <div class="v2-range-band" data-bind="noteRangeBand"></div>
    <div class="opponent-info"></div>

    <!-- 相手のセリフ：舞台の字幕帯 -->
    <div class="v2-band">
      <div class="v2-band-name v2-disp" data-bind="opponentNameLatin">—</div>
      <div class="opponent-speech v2-band-text" data-bind="opponentSpeech"></div>
      <div class="opponent-hand v2-band-hand" data-bind="opponentHand">
        <div class="card card-back"></div>
        <div class="card card-back"></div>
      </div>
    </div>

    <!-- 右上：POT -->
    <div class="v2-pot" data-bind="potBlock"></div>

    <!-- 中央：場札 -->
    <section class="center-table v2-table">
      <div class="community-cards" data-bind="communityCards">
        <div class="card empty"></div><div class="card empty"></div><div class="card empty"></div><div class="card empty"></div><div class="card empty"></div>
      </div>
      <div class="v2-danger" data-bind="dangerBar"></div>
    </section>

    <!-- チップ残量ゲージ：数字だけでなくキャラの前面で量が見える -->
    <div class="v2-stack-gauge is-opp" data-bind="oppStackGauge"></div>
    <div class="v2-stack-gauge is-mimi" data-bind="mimiStackGauge"></div>

    <!-- 右中：勝率の封印（ぱにゅぱにゅで開封）＋詳細データ -->
    <div class="v2-seal-row">
      <div class="v2-seal" data-bind="winrateSeal"></div>
      <button class="v2-detail-toggle" data-action="toggle-v2-detail">詳細データ ▾</button>
    </div>
    <aside class="right-panel v2-detail" data-bind-visible="v2detail">
      <div class="zazazo-display" style="display:none">
        <div class="zazazo-bar"><div class="zazazo-fill" data-bind="zazazoFill"></div></div>
        <div class="zazazo-text" data-bind="zazazoText"></div>
      </div>
      <div class="psych-stats" data-bind="psychStats" style="display:none"></div>
      <div class="situation-analysis" data-bind="situationAnalysis"></div>
    </aside>

    <!-- 左下：コメント帯（ミミの心の声→リコの助言を一箇所に。決断の直前に読む位置） -->
    <div class="v2-comments left-panel">
      <div class="v2-com v2-com-mimi">
        <div class="v2-com-face"><img src="assets/ui/face_mimi.webp" alt="ミミ" onerror="this.onerror=function(){window.assetFallback(this,'mimi')};this.src='assets/characters/mimi_mini.webp';"></div>
        <div class="mimi-thought-bubble v2-com-text" data-bind="mimiThought"></div>
      </div>
      <div class="v2-com v2-com-rico">
        <div class="v2-com-face character-frame char-rico v2-rico-face" data-action="char-profile" data-char="rico_tutorial" title="リコ先輩のプロフィールを見る">
          <img src="assets/ui/face_rico.webp" alt="リコ先輩" onerror="this.onerror=function(){window.assetFallback(this,'rico')};this.src='assets/characters/rico_default.webp';">
        </div>
        <div class="rico-bubble v2-com-text v2-rico-bubble" data-bind="ricoAdvice"></div>
      </div>
    </div>

    <!-- 右下：ミミのバストアップ＋手札＋役 -->
    <div class="mimi-area v2-mimi">
      <div class="character-frame char-mimi v2-mimi-frame" data-action="char-profile" data-char="mimi" title="ミミのプロフィールを見る">
        <img data-bind="mimiImg" data-mimi-face src="assets/characters/mimi_default.webp" alt="ミミ" onerror="window.assetFallback(this,'mimi')">
      </div>
    </div>
    <div class="v2-myhand">
      <div class="v2-role">
        <div class="v2-role-label">ミミの役</div>
        <div class="hand-label hand-label-hand v2-role-name" data-bind="currentHandName">—</div>
        <div class="hand-kicker v2-role-kicker" data-bind="currentHandKicker"></div>
      </div>
      <div class="player-hand" data-bind="playerHand">
        <div class="card empty"></div><div class="card empty"></div>
      </div>
    </div>

    <!-- 左下：アクション（斜めスラブ） -->
    <footer class="bottom-bar v2-actions">
      <div class="action-area" data-bind="actionArea"></div>
    </footer>
  </div>
</template>

<template id="tpl-psych-modal">
  <div class="modal-overlay battle-modal-overlay">
    <div class="battle-bg"></div>
    <div class="battle-vignette"></div>

    <!-- 右上：ぱにゅぱにゅボタン（モーダル外配置で常時アクセス可能） -->
    <button class="panyu-floating-btn" data-action="use-panyu-sense" data-bind="panyuSenseBtn" type="button">
      <span class="panyu-floating-icon">💖</span>
      <span class="panyu-floating-label">ぱにゅぱにゅ</span>
    </button>

    <!-- 中央：拡大したバトルモーダル -->
    <div class="modal psych-modal">
      <h3 class="psych-title">— 心理バトル —</h3>

      <!-- v2：右上ミミミゲージ（JSが中身を生成／講義モードでは非表示のまま） -->
      <div class="v2p-gauge" data-bind="zazazoGaugeBox" style="display:none"></div>

      <!-- v2：相手の舞台演出（顔アップ or 立ち絵。JSが中身を生成） -->
      <div class="v2p-opponent-stage character-frame" data-bind="psychOpponentStage"></div>

      <!-- キャラポートレート行（モーダル内・顔から胸まで。互換維持のため残置、v2レイアウトでは非表示） -->
      <div class="battle-portraits">
        <div class="battle-portrait portrait-mimi">
          <img data-mimi-face src="assets/characters/mimi_default.webp" alt="ミミ" onerror="window.assetFallback(this,'mimi')">
          <div class="portrait-name">ミミ</div>
        </div>
        <div class="battle-portrait portrait-opponent" data-bind="battleOpponentChar"></div>
      </div>

      <div class="psych-cards-row">
        <div class="psych-board-info">
          <div class="psych-board-label">場札</div>
          <div class="psych-board-cards" data-bind="psychBoardCards"></div>
          <div class="psych-pot" title="ポット = このハンドで賭けられたチップの合計">POT <span data-bind="psychPot">0</span></div>
        </div>
        <div class="v2p-vs">VS</div>
        <div class="psych-hand-info">
          <div class="psych-hand-label">ミミの手札</div>
          <div class="psych-hand-cards" data-bind="psychHandCards"></div>
        </div>
      </div>
      <div class="psych-situation" data-bind="psychSituation"></div>
      <div class="psych-speech" data-bind="psychSpeech"></div>
      <div class="psych-hint zazazo-hint" data-bind="zazazoHint"></div>
      <div class="psych-choices" data-bind="psychChoices"></div>
      <button class="psych-skip-btn" data-bind="psychSkipBtn" data-action="psych-skip" style="display:none;">スキップ（性格読み切り済み）</button>
    </div>
  </div>
</template>

<template id="tpl-ending">
  <div class="screen ending-screen">
    <div class="ending-stage" id="ending-stage"></div>
  </div>
</template>

<template id="tpl-result">
  <div class="screen result-screen">
    <div class="bg-layer bg-result-stage"></div>
    <div class="v2-slash v2-slash-gold"></div>

    <div class="result-char result-char-mimi"><img data-result-mimi src="assets/characters/mimi_win.webp" alt="ミミ" onerror="window.assetFallback(this,'mimi')"></div>
    <div class="result-char result-char-opp"><img data-result-opp alt="相手"></div>

    <div class="rz-titleblock">
      <h2 class="result-title" data-bind="resultTitle">勝利</h2>
      <div class="result-stage-tag v2-disp" data-bind="resultStageTag">STAGE 01 — ???</div>
    </div>

    <div class="rz-panel">
      <div class="rz-top-row">
        <div class="rank-display">
          <div class="rank-emblem-wrap">
            <img class="rank-emblem-img" src="assets/ui/emblem_rabbit_gold.webp" alt="" onerror="this.style.display='none'">
            <div class="rank-emblem-inner">
              <div class="rank-label v2-disp">RANK</div>
              <div class="rank-value v2-disp" data-bind="rankValue">A</div>
            </div>
          </div>
        </div>
        <div class="coins-block">
          <div class="coins-label v2-disp">COINS</div>
          <div class="coins-value v2-disp"><span data-bind="earnedCoins">0</span></div>
          <div class="reward-chips" data-bind="rewardChips"></div>
        </div>
      </div>

      <div class="result-stats">
        <div class="rz-stat">
          <div class="rz-stat-k">SCORE</div>
          <div class="rz-stat-v v2-disp" data-bind="score">0</div>
        </div>
        <div class="rz-stat">
          <div class="rz-stat-k">心理バトル</div>
          <div class="rz-stat-v v2-disp"><span data-bind="psychSuccess">0</span></div>
        </div>
        <div class="rz-stat">
          <div class="rz-stat-k">最大役</div>
          <div class="rz-stat-v v2-disp rz-stat-hand" data-bind="bestHand">-</div>
        </div>
        <div class="rz-stat">
          <div class="rz-stat-k">ブラフブレイク</div>
          <div class="rz-stat-v v2-disp rz-stat-bluff" data-bind="bluffBreak">なし</div>
        </div>
      </div>

      <details class="result-breakdown">
        <summary class="result-breakdown-toggle v2-detail-toggle">スコア内訳を見る ▾</summary>
        <div class="result-reason" data-bind="resultReason"></div>
      </details>

      <div class="result-buttons" data-bind="resultButtons">
        <button class="btn btn-primary result-main-btn" data-action="rematch"><span>再戦</span></button>
        <div class="result-sub-buttons">
          <button class="btn btn-secondary" data-action="back-lobby">ロビーへ</button>
        </div>
      </div>
    </div>
  </div>
</template>
